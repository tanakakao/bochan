name: Continue material train Yvar Phase 2

on:
  push:
    branches:
      - feat/material-train-yvar-phase2

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'Continue Phase 2 fixed-noise implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/material-train-yvar-phase2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch correlated material families and fixed-noise likelihood
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          root = Path('.')
          deep = root / 'src/bochan/models/regression/gaussian/deep'

          likelihood_source = '''\"\"\"Fixed known observation noise for correlated multitask GPs.\"\"\"

          from __future__ import annotations

          import warnings

          import torch
          from gpytorch.distributions import MultitaskMultivariateNormal
          from gpytorch.likelihoods import FixedNoiseGaussianLikelihood
          from gpytorch.utils.warnings import GPInputWarning
          from linear_operator.operators import LinearOperator, ZeroLinearOperator
          from torch import Tensor


          class MultitaskFixedNoiseGaussianLikelihood(FixedNoiseGaussianLikelihood):
              \"\"\"Fixed per-observation, per-task variance for wide multitask targets.

              The public noise contract is ``[..., n, m]``. The likelihood converts this
              wide tensor to the covariance event order at the likelihood boundary, using
              ``MultitaskMultivariateNormal._interleaved`` rather than assuming one layout.
              Stored training noise is canonicalized in interleaved order internally.
              \"\"\"

              def __init__(self, noise: Tensor, *, num_tasks: int | None = None) -> None:
                  resolved_num_tasks = self._validate_wide_noise(
                      noise,
                      num_tasks=num_tasks,
                      argument_name=\"noise\",
                  )
                  super().__init__(
                      noise=self._flatten_event(noise, interleaved=True),
                      learn_additional_noise=False,
                  )
                  self.num_tasks = resolved_num_tasks

              @staticmethod
              def _validate_wide_noise(
                  noise: Tensor,
                  *,
                  num_tasks: int | None,
                  argument_name: str,
              ) -> int:
                  if not torch.is_tensor(noise):
                      raise TypeError(f\"{argument_name} must be a Tensor.\")
                  if noise.ndim < 2:
                      raise ValueError(
                          f\"{argument_name} must have shape [..., n, m] for multitask noise.\"
                      )
                  inferred_num_tasks = int(noise.shape[-1])
                  if inferred_num_tasks < 2:
                      raise ValueError(
                          f\"{argument_name} must contain at least two task columns.\"
                      )
                  if num_tasks is not None and inferred_num_tasks != int(num_tasks):
                      raise ValueError(
                          f\"{argument_name} task dimension does not match num_tasks: \"
                          f\"{inferred_num_tasks} != {int(num_tasks)}.\"
                      )
                  if not torch.isfinite(noise).all():
                      raise ValueError(f\"{argument_name} must contain only finite variances.\")
                  if (noise <= 0).any():
                      raise ValueError(
                          f\"{argument_name} must contain strictly positive variances.\"
                      )
                  return inferred_num_tasks

              @staticmethod
              def _flatten_event(noise: Tensor, *, interleaved: bool) -> Tensor:
                  if interleaved:
                      ordered = noise
                  else:
                      ordered = noise.transpose(-1, -2)
                  return ordered.reshape(*ordered.shape[:-2], -1)

              @property
              def task_noise(self) -> Tensor:
                  \"\"\"Return fixed training variance in natural ``[..., n, m]`` shape.\"\"\"

                  flat_noise = self.noise_covar.noise
                  if flat_noise.shape[-1] % self.num_tasks != 0:
                      raise RuntimeError(
                          \"Stored fixed noise is incompatible with the configured task count.\"
                      )
                  num_data = flat_noise.shape[-1] // self.num_tasks
                  return flat_noise.reshape(
                      *flat_noise.shape[:-1],
                      num_data,
                      self.num_tasks,
                  )

              def _shaped_noise_covar(
                  self,
                  base_shape: torch.Size,
                  *params,
                  **kwargs,
              ) -> Tensor | LinearOperator:
                  del params
                  if len(base_shape) < 2 or int(base_shape[-1]) != self.num_tasks:
                      raise ValueError(
                          \"Multitask fixed noise expects an event shape [..., n, m] with \"
                          f\"m={self.num_tasks}; got {tuple(base_shape)}.\"
                      )

                  interleaved = bool(kwargs.pop(\"_interleaved\", True))
                  explicit_noise = kwargs.pop(\"noise\", None)
                  flat_shape = torch.Size(
                      (*base_shape[:-2], int(base_shape[-2]) * self.num_tasks)
                  )
                  if explicit_noise is not None:
                      self._validate_wide_noise(
                          explicit_noise,
                          num_tasks=self.num_tasks,
                          argument_name=\"noise\",
                      )
                      if tuple(explicit_noise.shape[-2:]) != tuple(base_shape[-2:]):
                          raise ValueError(
                              \"Explicit multitask observation noise must match the requested \"
                              f\"[n, m] event shape: {tuple(explicit_noise.shape[-2:])} != \"
                              f\"{tuple(base_shape[-2:])}.\"
                          )
                      return self.noise_covar(
                          shape=flat_shape,
                          noise=self._flatten_event(
                              explicit_noise,
                              interleaved=interleaved,
                          ),
                          **kwargs,
                      )

                  stored_noise = self.task_noise
                  if int(stored_noise.shape[-2]) == int(base_shape[-2]):
                      return self.noise_covar(
                          shape=flat_shape,
                          noise=self._flatten_event(
                              stored_noise,
                              interleaved=interleaved,
                          ),
                          **kwargs,
                      )

                  result = self.noise_covar(shape=flat_shape, **kwargs)
                  if isinstance(result, ZeroLinearOperator):
                      warnings.warn(
                          \"The requested multitask event size does not match the stored fixed \"
                          \"training noise and no explicit observation noise was supplied. \"
                          \"This is treated as a no-op.\",
                          GPInputWarning,
                          stacklevel=2,
                      )
                  return result

              def marginal(
                  self,
                  function_dist: MultitaskMultivariateNormal,
                  *params,
                  **kwargs,
              ) -> MultitaskMultivariateNormal:
                  \"\"\"Add fixed noise while preserving the multitask event ordering.\"\"\"

                  if not isinstance(function_dist, MultitaskMultivariateNormal):
                      raise TypeError(
                          \"MultitaskFixedNoiseGaussianLikelihood requires a \"
                          \"MultitaskMultivariateNormal.\"
                      )
                  mean = function_dist.mean
                  covariance = function_dist.lazy_covariance_matrix
                  noise_covar = self._shaped_noise_covar(
                      mean.shape,
                      *params,
                      _interleaved=bool(function_dist._interleaved),
                      **kwargs,
                  )
                  return MultitaskMultivariateNormal(
                      mean,
                      covariance + noise_covar,
                      interleaved=bool(function_dist._interleaved),
                  )

              def get_fantasy_likelihood(self, **kwargs):
                  \"\"\"Append wide fixed noise for fantasy observations along the data axis.\"\"\"

                  if \"noise\" not in kwargs:
                      raise RuntimeError(
                          \"MultitaskFixedNoiseGaussianLikelihood.fantasize requires a \"
                          \"wide `noise` kwarg with shape [..., q, m].\"
                      )
                  new_noise = kwargs[\"noise\"]
                  self._validate_wide_noise(
                      new_noise,
                      num_tasks=self.num_tasks,
                      argument_name=\"noise\",
                  )
                  old_noise = self.task_noise
                  batch_shape = torch.broadcast_shapes(
                      old_noise.shape[:-2],
                      new_noise.shape[:-2],
                  )
                  old_noise = old_noise.expand(
                      *batch_shape,
                      old_noise.shape[-2],
                      self.num_tasks,
                  )
                  new_noise = new_noise.expand(
                      *batch_shape,
                      new_noise.shape[-2],
                      self.num_tasks,
                  )
                  fantasy = type(self)(
                      torch.cat([old_noise, new_noise], dim=-2),
                      num_tasks=self.num_tasks,
                  )
                  fantasy.train(self.training)
                  return fantasy


          __all__ = [\"MultitaskFixedNoiseGaussianLikelihood\"]
          '''
          (deep / 'multitask_fixed_noise.py').write_text(likelihood_source, encoding='utf-8')

          family_files = [
              'mace_multitask.py',
              'chgnet_multitask.py',
              'm3gnet_multitask.py',
              'alignn_multitask.py',
              'crabnet_multitask.py',
          ]
          for name in family_files:
              path = deep / name
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              patched: list[str] = []
              removed_guard = 0
              index = 0
              while index < len(lines):
                  line = lines[index]
                  if (
                      line.strip() == 'if train_Yvar is not None:'
                      and index + 1 < len(lines)
                      and 'NotImplementedError' in lines[index + 1]
                      and 'train_Yvar' in lines[index + 1]
                  ):
                      removed_guard += 1
                      index += 2
                      continue
                  patched.append(line)
                  index += 1
              text = ''.join(patched)
              if removed_guard != 1:
                  raise RuntimeError(
                      f'{name}: expected one train_Yvar rejection guard, found {removed_guard}'
                  )
              pass_count = text.count('train_Yvar=None,')
              if pass_count < 1:
                  raise RuntimeError(f'{name}: no train_Yvar=None pass-through found')
              text = text.replace('train_Yvar=None,', 'train_Yvar=train_Yvar,')
              path.write_text(text, encoding='utf-8')

          test_path = root / 'tests/test_material_train_yvar_phase2.py'
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('match="non-negative"', 'match="strictly positive"')
          negative_case = '''    with pytest.raises(ValueError, match="strictly positive"):\n        MultitaskFixedNoiseGaussianLikelihood(\n            torch.tensor([[0.01, -0.02], [0.03, 0.04]])\n        )\n'''
          zero_case = negative_case + '''    with pytest.raises(ValueError, match="strictly positive"):\n        MultitaskFixedNoiseGaussianLikelihood(\n            torch.tensor([[0.01, 0.0], [0.03, 0.04]])\n        )\n'''
          if negative_case in test and 'torch.tensor([[0.01, 0.0]' not in test:
              test = test.replace(negative_case, zero_case, 1)

          anchor = '''def test_correlated_deepkernel_accepts_wide_train_yvar_and_exact_mll() -> None:\n'''
          noninterleaved_test = '''def test_multitask_fixed_noise_uses_noninterleaved_event_order() -> None:\n    mean = torch.zeros(2, 2, dtype=torch.double)\n    covariance = to_linear_operator(torch.eye(4, dtype=torch.double))\n    latent = MultitaskMultivariateNormal(mean, covariance, interleaved=False)\n    noise = torch.tensor(\n        [[0.01, 0.02], [0.03, 0.04]],\n        dtype=torch.double,\n    )\n    observed = MultitaskFixedNoiseGaussianLikelihood(noise)(latent)\n\n    assert observed._interleaved is False\n    torch.testing.assert_close(\n        observed.lazy_covariance_matrix.diagonal()\n        - latent.lazy_covariance_matrix.diagonal(),\n        torch.tensor([0.01, 0.03, 0.02, 0.04], dtype=torch.double),\n    )\n\n\n'''
          if noninterleaved_test not in test:
              if anchor not in test:
                  raise RuntimeError('Phase 2 test insertion anchor not found')
              test = test.replace(anchor, noninterleaved_test + anchor, 1)

          old = '''    mll_value = model.make_mll()(output, Y)\n    assert torch.isfinite(mll_value)\n\n    model.eval()\n'''
          new = '''    mll_value = model.make_mll()(output, Y)\n    assert torch.isfinite(mll_value)\n    (-mll_value).backward()\n    assert any(\n        parameter.grad is not None and torch.isfinite(parameter.grad).all()\n        for parameter in model.parameters()\n        if parameter.requires_grad\n    )\n\n    model.eval()\n'''
          if old in test:
              test = test.replace(old, new, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Install and validate shared Phase 2 contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install ruff
          python -m pytest tests/test_material_train_yvar_phase2.py -q
          ruff check \
            src/bochan/models/regression/gaussian/deep/deepkernel_configurable.py \
            src/bochan/models/regression/gaussian/deep/multitask_fixed_noise.py \
            src/bochan/models/regression/gaussian/deep/mace_multitask.py \
            src/bochan/models/regression/gaussian/deep/chgnet_multitask.py \
            src/bochan/models/regression/gaussian/deep/m3gnet_multitask.py \
            src/bochan/models/regression/gaussian/deep/alignn_multitask.py \
            src/bochan/models/regression/gaussian/deep/crabnet_multitask.py \
            tests/test_material_train_yvar_phase2.py
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bochan/models/regression/gaussian/deep/multitask_fixed_noise.py \
            src/bochan/models/regression/gaussian/deep/mace_multitask.py \
            src/bochan/models/regression/gaussian/deep/chgnet_multitask.py \
            src/bochan/models/regression/gaussian/deep/m3gnet_multitask.py \
            src/bochan/models/regression/gaussian/deep/alignn_multitask.py \
            src/bochan/models/regression/gaussian/deep/crabnet_multitask.py \
            tests/test_material_train_yvar_phase2.py
          git commit -m "Support correlated material multitask train_Yvar"
          git push origin HEAD:feat/material-train-yvar-phase2
