name: Finalize material train Yvar Phase 2

on:
  push:
    branches:
      - feat/material-train-yvar-phase2

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize Phase 2 fixed-noise implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/material-train-yvar-phase2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply validated implementation and Ruff fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          helper = Path('.github/workflows/_material-train-yvar-phase2-continue.yml').read_text(
              encoding='utf-8'
          )
          marker = "          python - <<'PY'\n"
          start = helper.index(marker) + len(marker)
          end = helper.index("\n          PY", start)
          patch_code = dedent(helper[start:end])
          exec(compile(patch_code, '<phase2-patch>', 'exec'))

          path = Path('src/bochan/models/regression/gaussian/deep/multitask_fixed_noise.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if interleaved:\n            ordered = noise\n        else:\n            ordered = noise.transpose(-1, -2)\n'''
          new = '''        ordered = noise if interleaved else noise.transpose(-1, -2)\n'''
          if old not in text:
              raise RuntimeError('Expected _flatten_event Ruff target was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install and validate Phase 2
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install ruff
          python -m pytest tests/test_material_train_yvar_phase2.py -q
          ruff check \
            src/bochan/models/regression/gaussian/deep/deepkernel_configurable.py \
            src/bochan/models/regression/gaussian/deep/multitask_fixed_noise.py \
            src/bochan/models/regression/gaussian/deep/mace_multitask.py \
            src/bochan/models/regression/gaussian/deep/chgnet_multitask.py \
            src/bochan/models/regression/gaussian/deep/m3gnet_multitask.py \
            src/bochan/models/regression/gaussian/deep/alignn_multitask.py \
            src/bochan/models/regression/gaussian/deep/crabnet_multitask.py \
            tests/test_material_train_yvar_phase2.py
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bochan/models/regression/gaussian/deep/multitask_fixed_noise.py \
            src/bochan/models/regression/gaussian/deep/mace_multitask.py \
            src/bochan/models/regression/gaussian/deep/chgnet_multitask.py \
            src/bochan/models/regression/gaussian/deep/m3gnet_multitask.py \
            src/bochan/models/regression/gaussian/deep/alignn_multitask.py \
            src/bochan/models/regression/gaussian/deep/crabnet_multitask.py \
            tests/test_material_train_yvar_phase2.py
          git commit -m "Support correlated material multitask train_Yvar"
          git push origin HEAD:feat/material-train-yvar-phase2
