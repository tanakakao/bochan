name: Material train Yvar Phase 2 family patch

on:
  push:
    branches:
      - feat/material-train-yvar-phase2

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Phase 2 family patches'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/material-train-yvar-phase2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch correlated material families
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          deep = Path("src/bochan/models/regression/gaussian/deep")
          family_files = [
              "mace_multitask.py",
              "chgnet_multitask.py",
              "m3gnet_multitask.py",
              "alignn_multitask.py",
              "crabnet_multitask.py",
          ]
          for name in family_files:
              path = deep / name
              text = path.read_text(encoding="utf-8")
              text, guard_count = re.subn(
                  r'\n    if train_Yvar is not None:\n'
                  r'        raise NotImplementedError\(f"\{model_name\} does not yet support train_Yvar\."\)\n',
                  "\n",
                  text,
              )
              if guard_count != 1:
                  raise RuntimeError(
                      f"{name}: expected one model train_Yvar guard, found {guard_count}"
                  )
              pass_count = text.count("            train_Yvar=None,\n")
              if pass_count < 1:
                  raise RuntimeError(
                      f"{name}: no correlated train_Yvar=None pass-through found"
                  )
              text = text.replace(
                  "            train_Yvar=None,\n",
                  "            train_Yvar=train_Yvar,\n",
              )
              path.write_text(text, encoding="utf-8")

          test_files = [
              "tests/test_mace_multitask.py",
              "tests/test_chgnet_multitask.py",
              "tests/test_m3gnet_multitask.py",
              "tests/test_alignn_multitask.py",
              "tests/test_crabnet_multitask.py",
          ]
          reject_pattern = re.compile(
              r'^    with pytest\.raises\(NotImplementedError, match="train_Yvar"\):\n'
              r'(?P<body>(?:        .*\n)+)',
              flags=re.MULTILINE,
          )
          for filename in test_files:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  "_rejects_single_output_and_train_yvar",
                  "_rejects_single_output_and_accepts_train_yvar",
              )

              def dedent(match: re.Match[str]) -> str:
                  return "".join(
                      line[4:] if line.startswith("    ") else line
                      for line in match.group("body").splitlines(keepends=True)
                  )

              text, _ = reject_pattern.subn(dedent, text)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Install material test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,materials]"
          python -m pip install ruff
      - name: Validate implementation
        run: |
          python -m pytest tests/test_material_train_yvar_phase2.py -q
          python -m pytest \
            tests/test_mace_multitask.py \
            tests/test_chgnet_multitask.py \
            tests/test_m3gnet_multitask.py \
            tests/test_alignn_multitask.py \
            tests/test_crabnet_multitask.py \
            -q
          ruff check \
            src/bochan/models/regression/gaussian/deep/deepkernel_configurable.py \
            src/bochan/models/regression/gaussian/deep/multitask_fixed_noise.py \
            src/bochan/models/regression/gaussian/deep/mace_multitask.py \
            src/bochan/models/regression/gaussian/deep/chgnet_multitask.py \
            src/bochan/models/regression/gaussian/deep/m3gnet_multitask.py \
            src/bochan/models/regression/gaussian/deep/alignn_multitask.py \
            src/bochan/models/regression/gaussian/deep/crabnet_multitask.py \
            tests/test_material_train_yvar_phase2.py
      - name: Commit family integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bochan/models/regression/gaussian/deep/mace_multitask.py \
            src/bochan/models/regression/gaussian/deep/chgnet_multitask.py \
            src/bochan/models/regression/gaussian/deep/m3gnet_multitask.py \
            src/bochan/models/regression/gaussian/deep/alignn_multitask.py \
            src/bochan/models/regression/gaussian/deep/crabnet_multitask.py \
            tests/test_mace_multitask.py \
            tests/test_chgnet_multitask.py \
            tests/test_m3gnet_multitask.py \
            tests/test_alignn_multitask.py \
            tests/test_crabnet_multitask.py
          git commit -m "Enable correlated material train Yvar"
          git push origin HEAD:feat/material-train-yvar-phase2
