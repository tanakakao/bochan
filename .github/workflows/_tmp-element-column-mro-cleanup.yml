name: Temporary element-column MRO cleanup

on:
  push:
    branches:
      - agent/tabular-element-column-mro-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove element-column optimizer MRO layer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tabular-element-column-mro-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Integrate element-column ordering into public optimizer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"anchor not found: {label}")
              return text.replace(old, new, 1)

          path = Path('src/bochan/tabular/public_optimizer.py')
          text = path.read_text()

          text = replace_once(
              text,
              'from .element_column_composition_optimizer import (\n'
              '    TabularBayesianOptimizer as _ElementColumnTabularBayesianOptimizer,\n'
              ')\n',
              'from .multi_site_composition_optimizer import (\n'
              '    TabularBayesianOptimizer as _FormulaMultiSiteTabularBayesianOptimizer,\n'
              ')\n',
              'public base import',
          )
          text = replace_once(
              text,
              '    _ElementColumnTabularBayesianOptimizer,\n',
              '    _FormulaMultiSiteTabularBayesianOptimizer,\n',
              'public base class',
          )

          old_normalize = '''    @classmethod
    def _normalize_composition_sites(
        cls,
        sites: Mapping[str, Mapping[str, Any]] | None,
    ) -> dict[str, dict[str, Any]]:
        """Normalize variable-total sites through the transform component."""

        return cls.composition_variable_total_transform.normalize_sites(
            sites,
            base_normalizer=(_ElementColumnTabularBayesianOptimizer._normalize_composition_sites),
        )
'''
          new_normalize = '''    @classmethod
    def _normalize_element_column_sites(
        cls,
        sites: Mapping[str, Mapping[str, Any]] | None,
    ) -> dict[str, dict[str, Any]]:
        """Normalize element-column declarations on top of formula multi-site sites."""

        return cls.composition_element_column_transform.normalize_sites(
            sites,
            base_normalizer=(
                _FormulaMultiSiteTabularBayesianOptimizer._normalize_composition_sites
            ),
        )

    @classmethod
    def _normalize_composition_sites(
        cls,
        sites: Mapping[str, Mapping[str, Any]] | None,
    ) -> dict[str, dict[str, Any]]:
        """Normalize variable totals around the element-column transform."""

        return cls.composition_variable_total_transform.normalize_sites(
            sites,
            base_normalizer=cls._normalize_element_column_sites,
        )
'''
          text = replace_once(text, old_normalize, new_normalize, 'normalize sites')
          text = replace_once(
              text,
              '            base_factory=_ElementColumnTabularBayesianOptimizer._make_site_search_space,\n',
              '            base_factory=_FormulaMultiSiteTabularBayesianOptimizer._make_site_search_space,\n',
              'search-space base',
          )

          prepare_anchor = '''    def _prepare_multi_site_frame(
        self,
        data: Any,
        *,
        fit_transformers: bool,
    ) -> Any:
        """Inject variable-total features around the element-column transform."""
'''
          prepare_helper = '''    def _prepare_element_column_frame(
        self,
        data: Any,
        *,
        fit_transformers: bool,
    ) -> Any:
        """Apply element-column conversion around the formula multi-site transform."""

        return self.composition_element_column_transform.prepare_multi_site_frame(
            data,
            fit_transformers=fit_transformers,
            composition_sites=self.composition_sites,
            composition_transformers=self.composition_transformers_,
            base_prepare=lambda frame, *, fit_transformers: (
                _FormulaMultiSiteTabularBayesianOptimizer._prepare_multi_site_frame(
                    self,
                    frame,
                    fit_transformers=fit_transformers,
                )
            ),
        )

'''
          if prepare_anchor not in text:
              raise SystemExit('anchor not found: prepare helper')
          text = text.replace(prepare_anchor, prepare_helper + prepare_anchor, 1)
          old_base_prepare = '''            base_prepare=lambda frame, *, fit_transformers: super(
                TabularBayesianOptimizer, self
            )._prepare_multi_site_frame(
                frame,
                fit_transformers=fit_transformers,
            ),
'''
          text = replace_once(
              text,
              old_base_prepare,
              '            base_prepare=self._prepare_element_column_frame,\n',
              'variable-total prepare base',
          )

          old_bounds = '''        expanded = super()._expanded_multi_site_bounds(bounds, transformed)
        expanded = self.composition_variable_total_transform.complete_bounds(
'''
          new_bounds = '''        expanded = _FormulaMultiSiteTabularBayesianOptimizer._expanded_multi_site_bounds(
            self,
            bounds,
            transformed,
        )
        expanded = self.composition_element_column_transform.clean_bounds(
            expanded,
            composition_sites=self.composition_sites,
        )
        expanded = self.composition_variable_total_transform.complete_bounds(
'''
          text = replace_once(text, old_bounds, new_bounds, 'expanded multi-site bounds')

          inverse_anchor = '''    def inverse_compositions(
        self,
        data: Any,
        *,
        repair: bool = True,
        keep_coordinates: bool = False,
    ) -> Any:
'''
          fit_method = '''    def fit(
        self,
        data: Any | None = None,
        y: Any | None = None,
        *,
        input_cols: Sequence[Any] | None = None,
        categorical_cols: Sequence[Any] | None = None,
        bounds: Any = None,
        **kwargs: Any,
    ) -> "TabularBayesianOptimizer":
        """Filter native composition columns before formula multi-site fitting."""

        if not self.multi_site_composition_enabled:
            return super().fit(
                data=data,
                y=y,
                input_cols=input_cols,
                categorical_cols=categorical_cols,
                bounds=bounds,
                **kwargs,
            )
        resolved_categorical = (
            self.composition_element_column_transform.resolve_categorical_cols(
                categorical_cols,
                default_categorical_cols=self.data_config.categorical_cols or (),
                composition_sites=self.composition_sites,
            )
        )
        return super().fit(
            data=data,
            y=y,
            input_cols=input_cols,
            categorical_cols=resolved_categorical,
            bounds=bounds,
            **kwargs,
        )

'''
          if inverse_anchor not in text:
              raise SystemExit('anchor not found: fit insertion')
          text = text.replace(inverse_anchor, fit_method + inverse_anchor, 1)

          old_inverse = '''        restored = super().inverse_compositions(
            data,
            repair=repair,
            keep_coordinates=keep_coordinates,
        )
        restored = self.composition_variable_total_transform.inverse_compositions(
'''
          new_inverse = '''        restored = _FormulaMultiSiteTabularBayesianOptimizer.inverse_compositions(
            self,
            data,
            repair=repair,
            keep_coordinates=keep_coordinates,
        )
        restored = self.composition_element_column_transform.inverse_compositions(
            restored,
            composition_sites=self.composition_sites,
            composition_transformers=self.composition_transformers_,
            enabled=self.multi_site_composition_enabled,
        )
        restored = self.composition_variable_total_transform.inverse_compositions(
'''
          text = replace_once(text, old_inverse, new_inverse, 'inverse ordering')
          path.write_text(text)

          test_path = Path('tests/test_tabular_composition_element_columns.py')
          test_text = test_path.read_text()
          old_import = '''from bochan.tabular.element_column_composition_optimizer import (
    TabularBayesianOptimizer,
)
'''
          test_text = replace_once(
              test_text,
              old_import,
              'from bochan.tabular import TabularBayesianOptimizer\n',
              'element-column test import',
          )
          test_path.write_text(test_text)
          PY
          python -m pip install ruff
          ruff format \
            src/bochan/tabular/public_optimizer.py \
            tests/test_tabular_composition_element_columns.py
          ruff check --fix \
            src/bochan/tabular/public_optimizer.py \
            tests/test_tabular_composition_element_columns.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bochan/tabular/public_optimizer.py tests/test_tabular_composition_element_columns.py
          git commit -m "Remove element-column optimizer MRO layer"
          git push origin HEAD:agent/tabular-element-column-mro-cleanup
