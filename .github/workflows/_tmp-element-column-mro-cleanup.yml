name: Temporary element-column MRO cleanup

on:
  push:
    branches:
      - agent/tabular-element-column-mro-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove element-column optimizer MRO layer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tabular-element-column-mro-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source and test cleanup
        run: |
          python .github/scripts/_tmp_element_column_mro_cleanup.py
          python -m pip install ruff
          ruff format src/bochan/tabular/public_optimizer.py tests/test_tabular_composition_element_columns.py
          ruff check --fix src/bochan/tabular/public_optimizer.py tests/test_tabular_composition_element_columns.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bochan/tabular/public_optimizer.py tests/test_tabular_composition_element_columns.py
          git commit -m "Remove element-column optimizer MRO layer"
          git push origin HEAD:agent/tabular-element-column-mro-cleanup
