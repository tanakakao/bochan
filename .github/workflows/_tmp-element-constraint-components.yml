name: Temporary element constraint component codemod

on:
  push:
    branches:
      - agent/tabular-element-constraint-components

permissions:
  contents: write

jobs:
  codemod:
    if: github.event.head_commit.message != 'Extract element constraint components'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tabular-element-constraint-components
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract resolver and projector
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/element_constraint_codemod.py
          python /tmp/element_constraint_codemod.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bochan/tabular tests/test_tabular_architecture.py
          git commit -m "Extract element constraint components"
          git push origin HEAD:agent/tabular-element-constraint-components
