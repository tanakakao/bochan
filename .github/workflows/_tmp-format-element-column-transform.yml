# temporary formatter; removed after source formatting
name: Temporary format element-column transform

on:
  push:
    branches:
      - agent/tabular-element-column-transform

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format element-column transform files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tabular-element-column-transform
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format changed Python files
        run: |
          python -m pip install ruff
          ruff format \
            src/bochan/tabular/composition_element_columns.py \
            src/bochan/tabular/element_column_composition_optimizer.py \
            src/bochan/tabular/public_optimizer.py \
            tests/test_tabular_architecture.py
          ruff check --fix \
            src/bochan/tabular/composition_element_columns.py \
            src/bochan/tabular/element_column_composition_optimizer.py \
            src/bochan/tabular/public_optimizer.py \
            tests/test_tabular_architecture.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bochan/tabular/composition_element_columns.py \
            src/bochan/tabular/element_column_composition_optimizer.py \
            src/bochan/tabular/public_optimizer.py \
            tests/test_tabular_architecture.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format element-column transform files"
          git push origin HEAD:agent/tabular-element-column-transform
