name: Temporary migrate element constraint tests

on:
  push:
    branches:
      - agent/tabular-element-constraint-mro-cleanup

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Use public optimizer in element constraint tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tabular-element-constraint-mro-cleanup
      - name: Replace internal optimizer import
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_tabular_composition_element_constraints.py')
          text = path.read_text()
          old = (
              'from bochan.tabular.element_constraint_composition_optimizer import (\n'
              '    TabularBayesianOptimizer,\n'
              ')\n'
          )
          new = 'from bochan.tabular import TabularBayesianOptimizer\n'
          if old not in text:
              raise SystemExit('element constraint test import anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_tabular_composition_element_constraints.py
          git commit -m "Use public optimizer in element constraint tests"
          git push origin HEAD:agent/tabular-element-constraint-mro-cleanup
