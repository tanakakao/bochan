name: Temporary sanitized element constraint codemod

on:
  push:
    branches:
      - agent/tabular-element-constraint-components

permissions:
  contents: write

jobs:
  codemod:
    if: github.event.head_commit.message != 'Extract element constraint components'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tabular-element-constraint-components
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover and run codemod payload
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          workflow = Path('.github/workflows/_tmp-element-constraint-components.yml').read_text()
          payload = workflow.split("echo '", 1)[1].split("' | base64", 1)[0]
          payload = ''.join(payload.split())
          Path('/tmp/element_constraint_codemod.py').write_bytes(base64.b64decode(payload))
          PY
          python /tmp/element_constraint_codemod.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bochan/tabular tests/test_tabular_architecture.py
          git commit -m "Extract element constraint components"
          git push origin HEAD:agent/tabular-element-constraint-components
