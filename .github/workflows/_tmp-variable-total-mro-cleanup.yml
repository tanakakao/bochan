name: Temporary variable-total MRO cleanup

on:
  push:
    branches:
      - agent/tabular-variable-total-mro-cleanup

permissions:
  contents: write

jobs:
  codemod:
    if: github.event.head_commit.message != 'Remove variable-total optimizer MRO layer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tabular-variable-total-mro-cleanup
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source and test cleanup
        shell: bash
        run: |
          git show HEAD^:.github/workflows/_tmp-variable-total-mro-cleanup.yml > /tmp/previous-workflow.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          raw = Path('/tmp/previous-workflow.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = raw.index(start_marker) + len(start_marker)
          end = raw.index(end_marker, start)
          script = textwrap.dedent(raw[start:end])

          workflow_start = script.index(
              '\nworkflow = ".github/workflows/api-architecture-smoke.yml"'
          )
          source_delete = script.index(
              '\nPath("src/bochan/tabular/variable_total_composition_optimizer.py").unlink()',
              workflow_start,
          )
          script = script[:workflow_start] + script[source_delete:]
          script = script.replace(
              '\nPath(".github/workflows/_tmp-variable-total-mro-cleanup.yml").unlink()',
              '',
          )
          Path('/tmp/apply_cleanup.py').write_text(script)
          PY
          python /tmp/apply_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bochan/tabular tests/test_tabular_architecture.py tests/test_tabular_composition_variable_totals.py
          git commit -m "Remove variable-total optimizer MRO layer"
          git push origin HEAD:agent/tabular-variable-total-mro-cleanup
