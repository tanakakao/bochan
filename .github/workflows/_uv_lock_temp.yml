name: Generate and validate uv lock

on:
  push:
    branches:
      - agent/adopt-uv-lock
    paths:
      - ".github/workflows/_uv_lock_temp.yml"
      - "pyproject.toml"
      - ".python-version"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Install Python
        run: uv python install 3.12
      - name: Generate lockfile
        run: uv lock
      - name: Validate lockfile
        run: uv lock --check
      - name: Sync Web environment from lockfile
        run: uv sync --locked --extra web
      - name: Smoke-test environment
        run: uv run --locked --extra web python -c "import bochan, fastapi, uvicorn; print('bochan uv environment OK')"
      - name: Commit lockfile
        shell: bash
        run: |
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add uv lockfile"
          git push
