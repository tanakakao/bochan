name: Validate locked environment

on:
  push:
    branches:
      - agent/adopt-uv-lock
    paths:
      - ".github/workflows/_uv_lock_temp.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "start_web.bat"

permissions:
  contents: write

jobs:
  environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Install Python
        run: uv python install 3.12
      - name: Validate lockfile
        run: uv lock --check
      - name: Sync Web environment from lockfile
        run: uv sync --locked --extra web
      - name: Smoke-test environment
        run: uv run --locked --extra web python -c "import bochan, fastapi, uvicorn; print('bochan uv environment OK')"

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate launcher configuration
        shell: cmd
        run: call start_web.bat check
