name: Agent align num inducing

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-model-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Align num_inducing model APIs
        run: python scripts/agent_align_num_inducing.py
      - name: Validate syntax and diff
        run: |
          python -m compileall -q src/bochan tests/test_model_contract_refactor.py
          git diff --check
      - name: Install focused test dependencies
        run: python -m pip install -e ".[test,api]"
      - name: Run model argument contract tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_model_contract_refactor.py \
            tests/test_multitask_classification_ordinal_models.py \
            tests/test_binary_multiclass_aligned_defaults.py \
            tests/test_ordinal_robust_num_classes.py
      - name: Remove one-shot tooling
        run: |
          rm scripts/agent_align_num_inducing.py
          rm .github/workflows/agent-align-num-inducing.yml
      - name: Commit inducing API alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align model inducing-point constructor contracts'
          git push origin HEAD:agent/refactor-model-contracts
