name: Agent align projected API

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-model-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Align projected model API
        run: python scripts/agent_align_projected_api.py
      - name: Validate syntax and diff
        run: |
          python -m compileall -q src/bochan tests/test_model_contract_refactor.py
          git diff --check
      - name: Install focused test dependencies
        run: python -m pip install -e ".[test,api]"
      - name: Run projected contract tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_model_contract_refactor.py \
            tests/test_projected_exact_mll_beta.py \
            tests/test_ordinal_deep_num_classes_inference.py \
            tests/test_ordinal_robust_num_classes.py
      - name: Remove one-shot tooling
        run: |
          rm scripts/agent_align_projected_api.py
          rm .github/workflows/agent-align-projected-api.yml
      - name: Commit projected API alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align projected model constructor contracts'
          git push origin HEAD:agent/refactor-model-contracts
