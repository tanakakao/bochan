name: Agent API final source cleanup

on:
  push:
    branches:
      - agent/api-root-responsibility-cleanup

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[agent-api-final-source-cleanup-v2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/api-root-responsibility-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source cleanup
        run: python .github/scripts/agent_api_final_source_cleanup.py
      - name: Lint touched source
        run: |
          python -m pip install ruff
          ruff check src/bochan/api/acquisition/service.py src/bochan/api/acquisition/defaults/information.py src/bochan/api/optimizer/support.py src/bochan/api/evaluation/cross_validation.py tests/test_api_architecture.py
      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/agent-api-final-source-cleanup.yml
          git rm -f .github/scripts/agent_api_final_source_cleanup.py
          git add -A
          git commit -m "Fix final API package cleanup regressions"
          git push origin HEAD:agent/api-root-responsibility-cleanup
