name: Agent API structural refactor retry

on:
  push:
    branches:
      - agent/api-root-responsibility-cleanup

permissions:
  contents: write

jobs:
  refactor:
    if: contains(github.event.head_commit.message, '[agent-api-structure-refactor-retry]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/api-root-responsibility-cleanup
          fetch-depth: 0
      - name: Reuse validated structural transform
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/agent-api-structure-refactor.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = '      - name: Apply responsibility moves\n'
          end_marker = '      - name: Commit structural refactor\n'
          start = text.index(start_marker)
          run_marker = '        run: |\n'
          block_start = text.index(run_marker, start) + len(run_marker)
          block_end = text.index(end_marker, block_start)
          block = textwrap.dedent(text[block_start:block_end])
          subprocess.run(['bash', '-eo', 'pipefail', '-c', block], check=True)
          PY
      - name: Commit structural refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/agent-api-structure-refactor.yml
          git rm -f .github/workflows/agent-api-structure-refactor-retry.yml
          git add -A
          git status --short
          git commit -m "Organize API responsibility packages and remove study runtime patch"
          git push origin HEAD:agent/api-root-responsibility-cleanup
