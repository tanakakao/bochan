name: Apply experiment categorical and restore improvements

on:
  push:
    branches:
      - agent/experiment-categorical-plots-restore
    paths:
      - .github/workflows/agent-apply-experiment-categorical.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/experiment-categorical-plots-restore
          fetch-depth: 0
      - name: Apply source changes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          WORKFLOW = Path('.github/workflows/agent-apply-experiment-categorical.yml')

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one exact match, found {count}: {old[:80]!r}')
              write(path, content.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              content = read(path)
              updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one regex match, found {count}: {pattern[:80]!r}')
              write(path, updated)

          # ------------------------------------------------------------------
          # Experiment entry: categorical values are select boxes and stale
          # results retain the latest fitted visualization session.
          # ------------------------------------------------------------------
          path = 'web/src/pages/ExperimentPage.tsx'
          replace_once(
              path,
              '''function markPreviousResultStale(result: RegressionResult, appendedRows: number): void {\n  delete result.visualization_run_id;\n  result.metadata = {\n    ...result.metadata,\n    stale_after_data_append: true,\n    appended_experiment_rows: appendedRows\n  };\n}''',
              '''function markPreviousResultStale(result: RegressionResult, appendedRows: number): void {\n  result.metadata = {\n    ...result.metadata,\n    stale_after_data_append: true,\n    appended_experiment_rows: appendedRows,\n    visualization_uses_latest_saved_model: Boolean(result.visualization_run_id)\n  };\n}'''
          )
          replace_once(
              path,
              '''function coerceValue(column: ColumnProfile | undefined, value: string): unknown {\n  const trimmed = value.trim();\n  if (!trimmed) return null;\n  if (column?.kind !== "numeric") return trimmed;\n  const parsed = Number(trimmed);\n  if (!Number.isFinite(parsed)) {\n    throw new Error(`${column.name}には数値を入力してください。`);\n  }\n  return parsed;\n}\n''',
              '''function coerceValue(column: ColumnProfile | undefined, value: string): unknown {\n  const trimmed = value.trim();\n  if (!trimmed) return null;\n  if (column?.kind !== "numeric") return trimmed;\n  const parsed = Number(trimmed);\n  if (!Number.isFinite(parsed)) {\n    throw new Error(`${column.name}には数値を入力してください。`);\n  }\n  return parsed;\n}\n\nfunction uniqueCategoryValues(values: unknown[]): Array<string | number> {\n  const unique = new Map<string, string | number>();\n  for (const value of values) {\n    if (typeof value !== "string" && typeof value !== "number") continue;\n    const key = `${typeof value}:${String(value)}`;\n    if (!unique.has(key)) unique.set(key, value);\n  }\n  return [...unique.values()];\n}\n'''
          )
          replace_once(
              path,
              '''  function patchRow(id: string, column: string, value: string) {\n    setRows((current) => current.map((row) => (\n      row.id === id ? { ...row, values: { ...row.values, [column]: value } } : row\n    )));\n  }\n''',
              '''  function isCategoricalColumn(column: string): boolean {\n    const targetSetting = targetSettings.find((setting) => setting.target === column);\n    const internalTask = activeResult.target_metadata?.[column]?.internal_task;\n    return variables[column]?.type === "categorical" ||\n      columnsByName[column]?.kind === "categorical" ||\n      targetSetting?.task_type === "classification" ||\n      targetSetting?.task_type === "ordinal" ||\n      internalTask === "binary" || internalTask === "multiclass" || internalTask === "ordinal";\n  }\n\n  function categoryValues(column: string): Array<string | number> {\n    if (!isCategoricalColumn(column)) return [];\n    const targetSetting = targetSettings.find((setting) => setting.target === column);\n    const metadata = activeResult.target_metadata?.[column];\n    return uniqueCategoryValues([\n      ...(variables[column]?.categories ?? []),\n      ...(metadata?.classes ?? []),\n      ...(targetSetting?.class_order ?? []),\n      ...(targetSetting?.target_classes ?? []),\n      ...(columnsByName[column]?.values ?? []),\n      ...activeDataset.preview.map((row) => row[column])\n    ]);\n  }\n\n  function patchRow(id: string, column: string, value: string) {\n    setRows((current) => current.map((row) => (\n      row.id === id ? { ...row, values: { ...row.values, [column]: value } } : row\n    )));\n  }\n\n  function experimentValueControl(\n    row: DraftRow,\n    column: string,\n    role: "condition" | "result"\n  ) {\n    const categorical = isCategoricalColumn(column);\n    const disabled = saving || Boolean(completedMessage);\n    const label = `${row.source} ${column} ${role === "condition" ? "実験条件" : "実験結果"}`;\n    const className = `experiment-cell-input${role === "result" ? " result-input" : ""}`;\n    if (categorical) {\n      return (\n        <select\n          className={className}\n          value={row.values[column] ?? ""}\n          onChange={(event) => patchRow(row.id, column, event.target.value)}\n          disabled={disabled}\n          aria-label={label}\n        >\n          <option value="">選択してください</option>\n          {categoryValues(column).map((value) => (\n            <option key={`${typeof value}:${String(value)}`} value={String(value)}>{String(value)}</option>\n          ))}\n        </select>\n      );\n    }\n    return (\n      <input\n        className={className}\n        type={columnsByName[column]?.kind === "numeric" ? "number" : "text"}\n        step={role === "condition" ? variables[column]?.step ?? "any" : "any"}\n        value={row.values[column] ?? ""}\n        onChange={(event) => patchRow(row.id, column, event.target.value)}\n        disabled={disabled}\n        placeholder={role === "result" ? "実測値" : undefined}\n        aria-label={label}\n      />\n    );\n  }\n'''
          )
          regex_once(
              path,
              r'''\{featureColumns\.map\(\(column\) => \(\n\s*<td key=\{column\}>\n\s*<input\n.*?\n\s*</td>\n\s*\)\)\}\n\s*\{targetColumns\.map\(\(column\) => \(\n\s*<td key=\{column\}>\n\s*<input\n.*?\n\s*</td>\n\s*\)\)\}''',
              '''{featureColumns.map((column) => (\n                    <td key={column}>{experimentValueControl(row, column, "condition")}</td>\n                  ))}\n                  {targetColumns.map((column) => (\n                    <td key={column}>{experimentValueControl(row, column, "result")}</td>\n                  ))}'''
          )
          replace_once(
              path,
              '''          `${appendedRows}件の実験データを追加しました。現在の変数・モデル設定を保持したまま再学習できます。`''',
              '''          `${appendedRows}件の実験データを追加しました。Resultsでは追加前の最新モデルによるグラフを確認でき、候補更新には再学習が必要です。`'''
          )

          # ------------------------------------------------------------------
          # History: replace regression-only Pareto UI with a target-to-target
          # relation plot that accepts numeric, categorical, and ordinal values.
          # ------------------------------------------------------------------
          path = 'web/src/components/ExperimentHistoryPanel.tsx'
          regex_once(path, r'''\ninterface ParetoPoint \{.*?\n\}\n''', '\n')
          regex_once(
              path,
              r'''function regressionObjectiveTargets\(history: ExperimentHistoryResponse \| null\): string\[\] \{.*?\n\}\n''',
              '''function uniqueTargetColumns(history: ExperimentHistoryResponse | null): string[] {\n  if (!history) return [];\n  const targets: string[] = [];\n  for (const cycle of history.cycles) {\n    for (const target of cycle.target_columns) {\n      if (!targets.includes(target)) targets.push(target);\n    }\n  }\n  return targets;\n}\n'''
          )
          regex_once(
              path,
              r'''function targetDirection\(history: ExperimentHistoryResponse \| null, target: string\): string \{.*?\n\}\n''',
              '''function targetTaskType(history: ExperimentHistoryResponse | null, target: string): string {\n  if (!history) return "regression";\n  for (const cycle of [...history.cycles].reverse()) {\n    const setting = cycle.target_settings.find((value) => value.target === target);\n    const taskType = setting?.task_type ?? cycle.target_summary[target]?.task_type;\n    if (taskType) return String(taskType);\n  }\n  return "regression";\n}\n'''
          )
          regex_once(
              path,
              r'''\nfunction numericValue\(value: unknown\): number \| null \{.*?\nfunction cycleParetoTraces\(.*?\n\}\n\n/\*\* Displays''',
              '\n/** Displays'
          )
          content = read(path)
          replacements = {
              'selectedParetoX': 'selectedTargetX',
              'selectedParetoY': 'selectedTargetY',
              'paretoTargets': 'relationTargets',
              'paretoData': 'targetRelationData',
              'regressionObjectiveTargets(history)': 'uniqueTargetColumns(history)',
              'cycleParetoTraces(history, selectedTargetX, selectedTargetY)': 'cycleScatterTraces(history, selectedTargetX, selectedTargetY)',
              '多目的パレート推移': '目的変数同士の関係',
              '各実験点をサイクル別に表示し、全履歴に対する累積Pareto frontを重ねます。': '回帰値・カテゴリ値・順序カテゴリを同じ関係図でサイクル別に表示します。',
              'X目的': 'X軸目的',
              'Y目的': 'Y軸目的',
              ': サイクル別Pareto履歴': ': サイクル別目的変数関係',
              '異なる2つの回帰目的を選択してください。': '異なる2つの目的変数を選択してください。'
          }
          for old, new in replacements.items():
              content = content.replace(old, new)
          content = content.replace(
              '  const targetRelationData = useMemo(\n    () => cycleScatterTraces(history, selectedTargetX, selectedTargetY),\n    [history, selectedTargetX, selectedTargetY]\n  );',
              '  const targetRelationData = useMemo(\n    () => cycleScatterTraces(history, selectedTargetX, selectedTargetY),\n    [history, selectedTargetX, selectedTargetY]\n  );\n  const selectedTargetXTask = targetTaskType(history, selectedTargetX);\n  const selectedTargetYTask = targetTaskType(history, selectedTargetY);'
          )
          content = content.replace(
              'xaxis: { title: { text: selectedTargetX } },\n                     yaxis: { title: { text: selectedTargetY } }',
              'xaxis: {\n                       title: { text: selectedTargetX },\n                       ...(selectedTargetXTask === "regression" ? {} : { type: "category" as const })\n                     },\n                     yaxis: {\n                       title: { text: selectedTargetY },\n                       ...(selectedTargetYTask === "regression" ? {} : { type: "category" as const })\n                     }'
          )
          if 'Pareto' in content or 'pareto' in content:
              raise RuntimeError('ExperimentHistoryPanel.tsx still contains Pareto-specific UI')
          write(path, content)

          # ------------------------------------------------------------------
          # Result visualization API and UI: generic target relation plot.
          # ------------------------------------------------------------------
          path = 'web/src/types.ts'
          replace_once(
              path,
              'export type VisualizationKind = "yyplot" | "pareto" | "1d" | "2d" | "ternary";',
              'export type VisualizationKind = "yyplot" | "target_relation" | "pareto" | "1d" | "2d" | "ternary";'
          )
          replace_once(
              path,
              '''  regression_targets: string[];\n  ternary_groups?: Array<{ features: string[]; sum_value: number }>;''',
              '''  regression_targets: string[];\n  target_tasks?: Record<string, string>;\n  ternary_groups?: Array<{ features: string[]; sum_value: number }>;'''
          )

          path = 'src/bochan/serving/webapp/visualization_sessions.py'
          replace_once(
              path,
              '''        "target_columns": list(session.target_columns),\n        "regression_targets": regression_targets,\n        "ternary_groups": _ternary_groups(session),''',
              '''        "target_columns": list(session.target_columns),\n        "regression_targets": regression_targets,\n        "target_tasks": {\n            target: str(session.target_metadata[target].get("internal_task") or "regression")\n            for target in session.target_columns\n        },\n        "ternary_groups": _ternary_groups(session),'''
          )
          regex_once(
              path,
              r'''def _pareto\(session: VisualizationSession, target_x: str, target_y: str\):.*?\n\n\ndef _require_features''',
              '''def _target_relation(session: VisualizationSession, target_x: str, target_y: str):\n    """Plot observed target pairs for numeric, categorical, and ordinal outputs."""\n\n    import plotly.graph_objects as go\n\n    if target_x == target_y:\n        raise ValueError("Target relation plot requires two different target variables.")\n    missing = [\n        target\n        for target in (target_x, target_y)\n        if target not in session.target_columns\n    ]\n    if missing:\n        raise ValueError(\n            f"Unsupported target variables: {missing!r}; available={session.target_columns!r}."\n        )\n\n    frame = session.data[[target_x, target_y]].dropna()\n    if frame.empty:\n        raise ValueError("The selected target variables have no paired observed values.")\n\n    task_x = str(session.target_metadata[target_x].get("internal_task") or "regression")\n    task_y = str(session.target_metadata[target_y].get("internal_task") or "regression")\n    figure = go.Figure()\n    if task_x != "regression" and task_y != "regression":\n        counts = frame.value_counts(sort=False).reset_index(name="count")\n        figure.add_trace(\n            go.Scatter(\n                x=counts[target_x],\n                y=counts[target_y],\n                mode="markers+text",\n                text=[str(value) for value in counts["count"]],\n                textposition="middle center",\n                customdata=counts["count"],\n                marker={\n                    "size": [min(46, 14 + 4 * int(value)) for value in counts["count"]],\n                    "opacity": 0.76,\n                },\n                name="observed pairs",\n                hovertemplate=(\n                    f"{target_x}: %{{x}}<br>{target_y}: %{{y}}"\n                    "<br>件数: %{customdata}<extra></extra>"\n                ),\n            )\n        )\n    else:\n        figure.add_trace(\n            go.Scatter(\n                x=frame[target_x],\n                y=frame[target_y],\n                mode="markers",\n                marker={"size": 9, "opacity": 0.72},\n                name="observed data",\n                hovertemplate=(\n                    f"{target_x}: %{{x}}<br>{target_y}: %{{y}}<extra></extra>"\n                ),\n            )\n        )\n\n    figure.update_xaxes(\n        title=target_x,\n        type="category" if task_x != "regression" else None,\n    )\n    figure.update_yaxes(\n        title=target_y,\n        type="category" if task_y != "regression" else None,\n    )\n    return figure\n\n\ndef _require_features'''
          )
          replace_once(
              path,
              '''    if kind == "pareto":\n        target_x = str(request.get("target_x") or "")\n        target_y = str(request.get("target_y") or "")\n        return _figure_payload(\n            _pareto(session, target_x, target_y),\n            figure_id=f"pareto-{target_x}-{target_y}",\n            title=f"{target_x} × {target_y}",\n            description="既存のPlotly Pareto散布図で入力データと候補を比較します。",\n        )''',
              '''    if kind in {"target_relation", "pareto"}:\n        target_x = str(request.get("target_x") or "")\n        target_y = str(request.get("target_y") or "")\n        return _figure_payload(\n            _target_relation(session, target_x, target_y),\n            figure_id=f"target-relation-{target_x}-{target_y}",\n            title=f"{target_x} × {target_y}",\n            description="実測された目的変数同士の関係を、カテゴリ値を含めて表示します。",\n        )'''
          )
          replace_once(
              path,
              '    raise ValueError("kind must be yyplot, pareto, 1d, 2d, or ternary.")',
              '    raise ValueError("kind must be yyplot, target_relation, 1d, 2d, or ternary.")'
          )

          path = 'web/src/InteractiveResultPlots.tsx'
          replace_once(
              path,
              '''  const [leftKind, setLeftKind] = useState<"yyplot" | "pareto">(\n    options.regression_targets.length >= 2 ? "pareto" : "yyplot"\n  );''',
              '''  const [leftKind, setLeftKind] = useState<"yyplot" | "target_relation">(\n    result.visualization_run_id && options.target_columns.length >= 2 ? "target_relation" : "yyplot"\n  );'''
          )
          replace_once(
              path,
              '''    if (!runId) {\n      setLeftError("可視化セッションがありません。候補を再生成してください。");\n      return;\n    }\n    if (leftKind === "pareto" && (!targetX || !targetY || targetX === targetY)) {\n      setLeftError("Pareto図には異なる2つの回帰目的変数が必要です。");\n      return;\n    }''',
              '''    if (!runId) {\n      const saved = leftKind === "yyplot"\n        ? result.visualizations.find((value) => value.id === `${leftTarget}-yyplot`)\n          ?? result.visualizations.find((value) => value.id.endsWith("-yyplot"))\n          ?? null\n        : null;\n      setLeftPlot(saved);\n      setLeftError(saved\n        ? null\n        : "最新モデルの可視化セッションがありません。モデルを信頼してプロジェクトを読み込むか、候補を再生成してください。");\n      return;\n    }\n    if (leftKind === "target_relation" && (!targetX || !targetY || targetX === targetY)) {\n      setLeftError("目的変数同士の図には異なる2つの目的変数が必要です。");\n      return;\n    }'''
          )
          replace_once(
              path,
              '''    fetchResultVisualization(runId, leftKind === "yyplot"\n      ? { kind: "yyplot", target: leftTarget }\n      : { kind: "pareto", target_x: targetX, target_y: targetY })''',
              '''    fetchResultVisualization(runId, leftKind === "yyplot"\n      ? { kind: "yyplot", target: leftTarget }\n      : { kind: "target_relation", target_x: targetX, target_y: targetY })'''
          )
          replace_once(
              path,
              '  }, [leftKind, leftTarget, runId, targetX, targetY]);',
              '  }, [leftKind, leftTarget, result.visualizations, runId, targetX, targetY]);'
          )
          replace_once(
              path,
              '''            <label>図<select value={leftKind} onChange={(event) => setLeftKind(event.target.value as "yyplot" | "pareto")}>\n              <option value="yyplot">YY plot</option>\n              <option value="pareto" disabled={options.regression_targets.length < 2}>Pareto図</option>\n            </select></label>''',
              '''            <label>図<select value={leftKind} onChange={(event) => setLeftKind(event.target.value as "yyplot" | "target_relation")}>\n              <option value="yyplot">YY plot</option>\n              <option value="target_relation" disabled={options.target_columns.length < 2}>目的変数同士</option>\n            </select></label>'''
          )
          replace_once(
              path,
              '''                  {options.regression_targets.map((target) => <option key={target} value={target}>{target}</option>)}''',
              '''                  {options.target_columns.map((target) => <option key={target} value={target}>{target}</option>)}'''
          )
          replace_once(
              path,
              '''                  {options.regression_targets.map((target) => <option key={target} value={target}>{target}</option>)}''',
              '''                  {options.target_columns.map((target) => <option key={target} value={target}>{target}</option>)}'''
          )
          content = read(path).replace(
              '  const [targetX, setTargetX] = useState(options.regression_targets[0] ?? "");\n  const [targetY, setTargetY] = useState(options.regression_targets[1] ?? options.regression_targets[0] ?? "");',
              '  const [targetX, setTargetX] = useState(options.target_columns[0] ?? "");\n  const [targetY, setTargetY] = useState(options.target_columns[1] ?? options.target_columns[0] ?? "");'
          )
          if 'Pareto図' in content:
              raise RuntimeError('InteractiveResultPlots.tsx still exposes Pareto UI')
          write(path, content)

          # ------------------------------------------------------------------
          # Keep stale latest models available for visualization, while blocking
          # model reuse and preserving correct archive dataset associations.
          # ------------------------------------------------------------------
          path = 'web/src/context/WorkbenchContext.tsx'
          replace_once(
              path,
              '''  const modelReuseAvailable = Boolean(\n    candidateSettingsValid &&\n    result?.visualization_run_id &&''',
              '''  const modelReuseAvailable = Boolean(\n    candidateSettingsValid &&\n    !result?.metadata?.stale_after_data_append &&\n    result?.visualization_run_id &&'''
          )
          replace_once(
              path,
              '''    const canReuse = Boolean(reusableRunId && lastModelSignature === modelSignature);''',
              '''    const canReuse = Boolean(\n      reusableRunId &&\n      !result?.metadata?.stale_after_data_append &&\n      lastModelSignature === modelSignature\n    );'''
          )

          path = 'web/src/pages/ResultsPage.tsx'
          replace_once(
              path,
              '''          実験データを追加したため、この候補と予測は追加前のモデル結果です。現在の設定を確認して再学習してください。''',
              '''          実験データを追加したため、この候補と予測は追加前の最新モデル結果です。グラフは引き続き確認できますが、候補更新とモデル再利用には更新データでの再学習が必要です。'''
          )

          path = 'src/bochan/serving/webapp/project_archive.py'
          replace_once(
              path,
              '''        if result_run_id:\n            add_candidate(\n                result_run_id,\n                role="latest",\n                dataset_id=request.dataset_id,\n                cycle_number=None,\n            )''',
              '''        if result_run_id:\n            matching_cycle = next(\n                (\n                    cycle\n                    for cycle in reversed(cycles)\n                    if str(cycle.get("source_run_id") or "") == str(result_run_id)\n                ),\n                None,\n            )\n            add_candidate(\n                result_run_id,\n                role="latest",\n                dataset_id=(\n                    str(matching_cycle["parent_dataset_id"])\n                    if matching_cycle is not None\n                    else request.dataset_id\n                ),\n                cycle_number=(\n                    int(matching_cycle["cycle_number"])\n                    if matching_cycle is not None\n                    else None\n                ),\n            )'''
          )
          replace_once(
              path,
              '''            if active_model_restored and latest_model is not None:\n                model_request = latest_model.get("request")\n                if isinstance(model_request, dict) and model_request:\n                    request_payload = deepcopy(model_request)\n                    request_payload["dataset_id"] = current_record.dataset_id\n                result_payload = deepcopy(latest_model["result"])\n                metadata = result_payload.get("metadata")\n                metadata = metadata if isinstance(metadata, dict) else {}\n                metadata.pop("stale_after_data_append", None)\n                result_payload["metadata"] = {\n                    **metadata,\n                    "restored_from_project_archive": True,\n                    "project_model_included": True,\n                    "project_model_restored": True,\n                }\n\n            restored_count = sum(bool(item.get("restored")) for item in restored_models)\n            restored_run_id = (\n                str(latest_model["restored_run_id"])\n                if active_model_restored and latest_model is not None\n                else f"project-{uuid4().hex}"\n            )''',
              '''            if active_model_restored and latest_model is not None:\n                model_request = latest_model.get("request")\n                if isinstance(model_request, dict) and model_request:\n                    request_payload = deepcopy(model_request)\n                    request_payload["dataset_id"] = current_record.dataset_id\n                result_payload = deepcopy(latest_model["result"])\n                metadata = result_payload.get("metadata")\n                metadata = metadata if isinstance(metadata, dict) else {}\n                metadata.pop("stale_after_data_append", None)\n                result_payload["metadata"] = {\n                    **metadata,\n                    "restored_from_project_archive": True,\n                    "project_model_included": True,\n                    "project_model_restored": True,\n                    "project_model_active": True,\n                }\n            elif latest_model is not None:\n                model_result = latest_model.get("result")\n                model_result = model_result if isinstance(model_result, dict) else {}\n                result_payload["visualization_run_id"] = str(latest_model["restored_run_id"])\n                if model_result.get("visualization_options") is not None:\n                    result_payload["visualization_options"] = deepcopy(\n                        model_result["visualization_options"]\n                    )\n                if model_result.get("visualizations"):\n                    result_payload["visualizations"] = deepcopy(model_result["visualizations"])\n                metadata = result_payload.get("metadata")\n                metadata = metadata if isinstance(metadata, dict) else {}\n                result_payload["metadata"] = {\n                    **metadata,\n                    "stale_after_data_append": True,\n                    "restored_from_project_archive": True,\n                    "project_model_included": True,\n      