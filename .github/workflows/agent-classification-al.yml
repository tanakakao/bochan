name: Agent classification AL validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/align-classification-ordinal-active-learning'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/align-classification-ordinal-active-learning
          fetch-depth: 0
      - name: Remove generated bytecode
        run: |
          find src -type d -name __pycache__ -prune -exec rm -rf {} +
          find src -type f -name '*.pyc' -delete
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src
          if ! git diff --cached --quiet; then
            git commit -m 'Remove generated bytecode artifacts'
            git push origin HEAD:agent/align-classification-ordinal-active-learning
          fi
