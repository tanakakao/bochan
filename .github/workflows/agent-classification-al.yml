name: Agent classification AL validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  focused:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/align-classification-ordinal-active-learning'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/align-classification-ordinal-active-learning
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install -e '.[test,tabular,api]'
          python -m pip install plotly
      - name: Run focused AL contracts
        run: |
          pytest -q --maxfail=1 \
            tests/test_ordinal_missing_multiobjective.py \
            tests/test_classification_ordinal_single_output_hybrid_al_e2e.py \
            tests/test_classification_ordinal_input_perturbation_distance_contract.py \
            tests/test_webapp_active_learning_task_kwargs.py \
            tests/test_ordinal_duplicate_controls_e2e.py \
            tests/test_single_output_hybrid_acquisition_routing.py \
            tests/test_webapp_single_objective_nipv.py \
            tests/test_classification_duplicate_exclusion.py \
            tests/test_binary_multiclass_duplicate_controls_e2e.py
          git diff --check
