name: Agent classification AL validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/align-classification-ordinal-active-learning'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/align-classification-ordinal-active-learning
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run Hybrid AL E2E
        run: |
          pytest -q --maxfail=1 tests/test_classification_ordinal_single_output_hybrid_al_e2e.py
          git diff --check
