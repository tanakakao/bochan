name: Agent classification AL validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-bytecode:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/align-classification-ordinal-active-learning'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/align-classification-ordinal-active-learning
          fetch-depth: 0
      - name: Restore tracked bytecode from main
        run: |
          git fetch origin main
          git ls-tree -r --name-only origin/main \
            | grep -E '(^|/)__pycache__/.*\.pyc$' \
            > /tmp/tracked-bytecode.txt || true
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            git checkout origin/main -- "$path"
          done < /tmp/tracked-bytecode.txt
          git diff --check
      - name: Commit restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src
          if ! git diff --cached --quiet; then
            git commit -m 'Restore tracked bytecode artifacts'
            git push origin HEAD:agent/align-classification-ordinal-active-learning
          fi
