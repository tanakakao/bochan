name: Agent factory modeling split

on:
  push:
    branches:
      - agent/api-factory-modeling-split

permissions:
  contents: write

jobs:
  refactor:
    if: contains(github.event.head_commit.message, '[agent-factory-modeling-split]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/api-factory-modeling-split
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Split model build and fit responsibilities
        run: |
          python .github/scripts/agent_factory_modeling_split.py
          python -m compileall -q src/bochan/api
          python -m pip install ruff
          changed=$(git diff --name-only -- '*.py')
          ruff check --fix --select I,F401 $changed
          ruff check --select I,F401 $changed
          python -m compileall -q src/bochan/api
      - name: Commit split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/agent-factory-modeling-split.yml
          git rm -f .github/scripts/agent_factory_modeling_split.py
          git add -A
          git status --short
          git commit -m "Split API model construction and fitting from factory"
          git push origin HEAD:agent/api-factory-modeling-split
