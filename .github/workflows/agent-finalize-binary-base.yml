name: Agent finalize binary base

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-model-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Finalize binary base implementation
        run: python scripts/agent_finalize_binary_base.py
      - name: Validate syntax and diff
        run: |
          python -m compileall -q src/bochan tests/test_model_contract_refactor.py
          git diff --check
      - name: Install focused test dependencies
        run: python -m pip install -e ".[test,api]"
      - name: Run focused binary contract tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_model_contract_refactor.py \
            tests/test_binary_multiclass_aligned_defaults.py
      - name: Remove one-shot tooling
        run: |
          rm scripts/agent_finalize_binary_base.py
          rm .github/workflows/agent-finalize-binary-base.yml
      - name: Commit final binary cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fold binary base defaults into canonical models'
          git push origin HEAD:agent/refactor-model-contracts
