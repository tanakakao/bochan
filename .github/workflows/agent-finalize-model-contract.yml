name: Agent finalize model contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-model-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply final model contract cleanup
        run: python scripts/agent_finalize_model_contract.py
      - name: Validate syntax and diff
        run: |
          python -m compileall -q src/bochan
          git diff --check
      - name: Install focused test dependencies
        run: python -m pip install -e ".[test,api]"
      - name: Run focused model contract tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_model_contract_refactor.py \
            tests/test_ordinal_robust_num_classes.py \
            tests/test_mixed_kronecker_model_registry.py \
            tests/test_projected_exact_mll_beta.py \
            tests/models/hybrid/test_multi_output_cat_dims.py
      - name: Remove one-shot tooling
        run: |
          rm scripts/agent_finalize_model_contract.py
          rm .github/workflows/agent-finalize-model-contract.yml
      - name: Commit final cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize canonical model contracts'
          git push origin HEAD:agent/refactor-model-contracts
