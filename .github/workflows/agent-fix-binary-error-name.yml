name: Agent fix binary error name

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-model-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Fix final binary compatibility name
        run: python scripts/agent_fix_binary_error_name.py
      - name: Validate syntax and diff
        run: |
          python -m compileall -q src/bochan tests/test_model_contract_refactor.py
          git diff --check
      - name: Install focused test dependencies
        run: python -m pip install -e ".[test,api]"
      - name: Run focused binary contract tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_model_contract_refactor.py \
            tests/test_binary_multiclass_aligned_defaults.py
      - name: Remove one-shot tooling
        run: |
          rm scripts/agent_fix_binary_error_name.py
          rm .github/workflows/agent-fix-binary-error-name.yml
      - name: Commit final naming cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove final binary compatibility name'
          git push origin HEAD:agent/refactor-model-contracts
