name: Finalize target relation schema fix

on:
  push:
    branches:
      - agent/fix-target-relation-request-schema

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-target-relation-request-schema
          fetch-depth: 0

      - name: Format test and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_webapp_advanced_controls.py")
          content = path.read_text(encoding="utf-8")
          old = '    assert request.target_y == "y_cat"\n\ndef test_web_profile_includes_low_cardinality_numeric_values() -> None:'
          new = '    assert request.target_y == "y_cat"\n\n\ndef test_web_profile_includes_low_cardinality_numeric_values() -> None:'
          if content.count(old) != 1:
              raise RuntimeError(f"Expected one formatting target, found {content.count(old)}")
          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

          rm -f .github/workflows/agent-fix-target-relation-schema.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_webapp_advanced_controls.py .github/workflows/agent-fix-target-relation-schema.yml
          git commit -m "Finalize target relation request schema fix"
          git push origin HEAD:agent/fix-target-relation-request-schema
