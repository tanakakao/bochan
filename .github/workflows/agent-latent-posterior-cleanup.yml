name: Agent latent posterior cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-model-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean mechanical latent posterior replacements
        run: python scripts/agent_fix_latent_posterior_replacements.py
      - name: Validate syntax and diff
        run: |
          python -m compileall -q src/bochan
          git diff --check
      - name: Remove one-shot tooling
        run: |
          rm scripts/agent_fix_latent_posterior_replacements.py
          rm .github/workflows/agent-latent-posterior-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean latent posterior canonical call sites'
          git push origin HEAD:agent/refactor-model-contracts
