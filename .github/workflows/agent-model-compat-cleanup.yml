name: Agent model compatibility cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-model-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove model compatibility aliases
        run: python scripts/agent_remove_model_compat.py
      - name: Validate syntax and diff
        run: |
          python -m compileall -q src/bochan/models
          git diff --check
      - name: Remove one-shot tooling
        run: |
          rm scripts/agent_remove_model_compat.py
          rm .github/workflows/agent-model-compat-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove remaining model compatibility aliases'
          git push origin HEAD:agent/refactor-model-contracts
