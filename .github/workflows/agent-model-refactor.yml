name: Agent model refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-model-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply model refactor
        run: |
          set +e
          python scripts/agent_model_refactor.py 2> /tmp/model-refactor.err
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -q '^RuntimeError: legacy model patch hooks remain:' /tmp/model-refactor.err; then
              cat /tmp/model-refactor.err
            else
              cat /tmp/model-refactor.err
              exit "$status"
            fi
          fi
          python scripts/agent_model_refactor_cleanup.py
          python scripts/agent_model_refactor_extra.py
      - name: Validate syntax and diff
        run: |
          python -m compileall -q src/bochan
          git diff --check
      - name: Remove one-shot tooling
        run: |
          rm scripts/agent_model_refactor.py
          rm scripts/agent_model_refactor_cleanup.py
          rm scripts/agent_model_refactor_extra.py
          rm .github/workflows/agent-model-refactor.yml
      - name: Commit generated refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refactor model contracts and remove monkey patches'
          git push origin HEAD:agent/refactor-model-contracts
