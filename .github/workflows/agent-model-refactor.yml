name: Agent model refactor

on:
  push:
    branches:
      - agent/refactor-model-contracts

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-model-contracts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply model refactor
        run: python scripts/agent_model_refactor.py
      - name: Validate syntax and diff
        run: |
          python -m compileall -q src/bochan
          git diff --check
      - name: Remove one-shot tooling
        run: |
          rm scripts/agent_model_refactor.py
          rm .github/workflows/agent-model-refactor.yml
      - name: Commit generated refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refactor model contracts and remove monkey patches'
          git push origin HEAD:agent/refactor-model-contracts
