name: Agent NIPV pending runner

on:
  pull_request:
    branches: [agent/nipv-pending-runner]

permissions:
  contents: read

jobs:
  focused:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/nipv-permanent-pending-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nipv-permanent-pending-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install -e '.[test,tabular,api]'
          python -m pip install ruff plotly
      - name: Validate changed contract
        run: |
          python -m py_compile src/bochan/acquisition/regression/active_learning/_integrated.py
          ruff format --check tests/test_nipv_pending_contract.py
          ruff check tests/test_nipv_pending_contract.py
          git diff --check
      - name: Test real pending contract
        run: |
          pytest -q --maxfail=1 \
            tests/test_nipv_pending_contract.py \
            tests/test_regression_final_candidate_uniqueness_e2e.py \
            tests/test_webapp_single_objective_nipv.py \
            tests/test_classification_ordinal_single_output_hybrid_al_e2e.py
