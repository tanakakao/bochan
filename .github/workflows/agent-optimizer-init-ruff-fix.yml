name: Agent optimizer init Ruff fix

on:
  push:
    branches:
      - agent/api-root-responsibility-cleanup

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[agent-optimizer-init-ruff-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/api-root-responsibility-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fix import order
        run: |
          python -m pip install ruff
          ruff check --fix src/bochan/api/optimizer/__init__.py
          ruff check src/bochan/api/optimizer/__init__.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/agent-optimizer-init-ruff-fix.yml
          git add -A
          git commit -m "Sort canonical optimizer imports"
          git push origin HEAD:agent/api-root-responsibility-cleanup
