name: Refine target relation visualization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/experiment-categorical-plots-restore
          fetch-depth: 0
      - name: Apply visualization refinements
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:100]!r}")
              write(path, content.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              content = read(path)
              updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one regex match, found {count}: {pattern[:100]!r}")
              write(path, updated)

          # Public visualization API shared by Web and non-Web users.
          path = "src/bochan/visualization/plots.py"
          replace_once(path, "from collections.abc import Sequence", "from collections.abc import Mapping, Sequence")
          relation_function = r'''

def _relation_task_type(task_type: Any, series: pd.Series) -> str:
    """Normalize one target task for relation-plot axis handling."""

    normalized = str(task_type or "").strip().lower()
    if normalized in {"binary", "multiclass", "classification", "categorical"}:
        return "categorical"
    if normalized == "ordinal":
        return "ordinal"
    if normalized in {"regression", "continuous", "numeric"}:
        return "regression"
    return "regression" if pd.api.types.is_numeric_dtype(series) else "categorical"


def show_target_relation_plot(
    y: pd.DataFrame,
    target1: str,
    target2: str,
    *,
    task_types: Mapping[str, str] | None = None,
    category_orders: Mapping[str, Sequence[Any]] | None = None,
    cycle: str | Sequence[Any] | pd.Series | None = None,
    aggregate_categorical: bool = True,
) -> Figure:
    """目的変数同士の関係を回帰・分類・順序変数に対応して描画する。

    Parameters
    ----------
    y:
        目的変数を含むデータフレーム。
    target1, target2:
        横軸・縦軸に使用する目的変数名。
    task_types:
        目的変数ごとのタスク種別。``regression``、``classification``、
        ``binary``、``multiclass``、``ordinal`` を受け付ける。省略時はdtypeから推定する。
    category_orders:
        分類・順序変数の表示順。順序回帰では低位から高位の順を指定する。
    cycle:
        サイクル列名またはサイクル系列。指定時はサイクル別にトレースを分ける。
    aggregate_categorical:
        両軸が非回帰の場合に同じカテゴリ組み合わせを件数集約するかどうか。
    """

    for column in (target1, target2):
        if column not in y.columns:
            raise ValueError(f"y に列 {column!r} が存在しません。")
    if target1 == target2:
        raise ValueError("target1 and target2 must be different target variables.")

    task_types = dict(task_types or {})
    category_orders = dict(category_orders or {})
    task1 = _relation_task_type(task_types.get(target1), y[target1])
    task2 = _relation_task_type(task_types.get(target2), y[target2])
    categorical_pair = task1 != "regression" and task2 != "regression"

    frame = y[[target1, target2]].copy()
    cyc = cycle_series(cycle, y=y, length=len(y)) if cycle is not None else None
    if cyc is not None:
        frame["__cycle__"] = cyc.to_numpy()
    frame = frame.dropna(subset=[target1, target2])
    if frame.empty:
        raise ValueError("選択した目的変数に有効な組み合わせがありません。")

    fig = go.Figure()
    cmap = cycle_color_map(cyc)

    def add_trace(values: pd.DataFrame, name: str, color: Any | None = None) -> None:
        marker: dict[str, Any] = {"opacity": 0.76}
        if color is not None:
            marker["color"] = color
        if aggregate_categorical and categorical_pair:
            counts = (
                values.groupby([target1, target2], sort=False, dropna=False)
                .size()
                .reset_index(name="count")
            )
            marker["size"] = [min(46, 14 + 4 * int(value)) for value in counts["count"]]
            fig.add_trace(
                go.Scatter(
                    x=counts[target1],
                    y=counts[target2],
                    mode="markers+text",
                    text=[str(value) for value in counts["count"]],
                    textposition="middle center",
                    customdata=counts["count"].to_numpy(),
                    marker=marker,
                    name=name,
                    hovertemplate=(
                        f"{target1}: %{{x}}<br>{target2}: %{{y}}"
                        "<br>件数: %{customdata}<extra></extra>"
                    ),
                )
            )
            return

        marker["size"] = 9
        fig.add_trace(
            go.Scatter(
                x=values[target1],
                y=values[target2],
                mode="markers",
                marker=marker,
                name=name,
                hovertemplate=f"{target1}: %{{x}}<br>{target2}: %{{y}}<extra></extra>",
            )
        )

    if cyc is None:
        add_trace(frame, "入力データ")
    else:
        for cycle_value, color in cmap.items():
            add_trace(frame.loc[frame["__cycle__"] == cycle_value], f"cycle {cycle_value}", color)

    def axis_options(target: str, task: str) -> dict[str, Any]:
        options: dict[str, Any] = {"title": target}
        if task != "regression":
            options["type"] = "category"
            order = list(category_orders.get(target) or [])
            if order:
                options["categoryorder"] = "array"
                options["categoryarray"] = order
        return options

    fig.update_xaxes(**axis_options(target1, task1))
    fig.update_yaxes(**axis_options(target2, task2))
    fig.update_layout(
        height=600,
        width=700,
        legend_title_text="系列",
        font_size=16,
    )
    return fig
'''
          content = read(path)
          marker = "\n\ndef show_target_over_cycle_study("
          if "def show_target_relation_plot(" in content:
              raise RuntimeError("show_target_relation_plot already exists")
          if marker not in content:
              raise RuntimeError("plots.py insertion marker missing")
          write(path, content.replace(marker, relation_function + marker, 1))

          path = "src/bochan/visualization/__init__.py"
          replace_once(
              path,
              "    show_target_over_cycle_study,\n    show_triscatter_with_acqf,",
              "    show_target_over_cycle_study,\n    show_target_relation_plot,\n    show_triscatter_with_acqf,",
          )
          replace_once(
              path,
              '    "show_target_over_cycle_study",\n    "show_triscatter_with_acqf",',
              '    "show_target_over_cycle_study",\n    "show_target_relation_plot",\n    "show_triscatter_with_acqf",',
          )

          # Web visualization delegates to the public function.
          path = "src/bochan/serving/webapp/visualization_sessions.py"
          regex_once(
              path,
              r"\n\ndef _target_relation\(session: VisualizationSession, target_x: str, target_y: str\):.*?\n\n\ndef _require_features",
              "\n\ndef _require_features",
          )
          replace_once(
              path,
              """    if kind in {\"target_relation\", \"pareto\"}:\n        target_x = str(request.get(\"target_x\") or \"\")\n        target_y = str(request.get(\"target_y\") or \"\")\n        return _figure_payload(\n            _target_relation(session, target_x, target_y),\n            figure_id=f\"target-relation-{target_x}-{target_y}\",\n            title=f\"{target_x} × {target_y}\",\n            description=\"実測された目的変数同士の関係を、カテゴリ値を含めて表示します。\",\n        )""",
              """    if kind in {\"target_relation\", \"pareto\"}:\n        from bochan.visualization import show_target_relation_plot\n\n        target_x = str(request.get(\"target_x\") or \"\")\n        target_y = str(request.get(\"target_y\") or \"\")\n        task_types = {\n            target: str(session.target_metadata[target].get(\"internal_task\") or \"regression\")\n            for target in session.target_columns\n        }\n        category_orders = {\n            target: list(\n                session.target_metadata[target].get(\"class_order\")\n                or session.target_metadata[target].get(\"classes\")\n                or []\n            )\n            for target in session.target_columns\n            if task_types[target] != \"regression\"\n        }\n        return _figure_payload(\n            show_target_relation_plot(\n                session.data[session.target_columns],\n                target_x,\n                target_y,\n                task_types=task_types,\n                category_orders=category_orders,\n            ),\n            figure_id=f\"target-relation-{target_x}-{target_y}\",\n            title=f\"{target_x} × {target_y}\",\n            description=\"実測された目的変数同士の関係を、カテゴリ値を含めて表示します。\",\n        )""",
          )

          # History: restore cumulative Pareto front for regression / ordinal objectives only.
          path = "web/src/components/ExperimentHistoryPanel.tsx"
          content = read(path)
          content = content.replace(
              "interface ExperimentHistoryPanelProps {\n  datasetId: string;\n  refreshKey?: number;\n}\n\n",
              """interface ExperimentHistoryPanelProps {\n  datasetId: string;\n  refreshKey?: number;\n}\n\ninterface ParetoRelationPoint {\n  x: number;\n  y: number;\n  displayX: unknown;\n  displayY: unknown;\n  cycle: ExperimentCycle;\n  row: Record<string, unknown>;\n  rowIndex: number;\n}\n\n""",
              1,
          )
          helper_marker = "\n\nfunction cycleScatterTraces("
          pareto_helpers = r'''

function targetSetting(history: ExperimentHistoryResponse | null, target: string) {
  if (!history) return undefined;
  for (const cycle of [...history.cycles].reverse()) {
    const setting = cycle.target_settings.find((value) => value.target === target);
    if (setting) return setting;
  }
  return undefined;
}

function targetDirection(history: ExperimentHistoryResponse | null, target: string): string {
  const setting = targetSetting(history, target);
  if (setting?.direction) return setting.direction;
  if (!history) return "maximize";
  for (const cycle of [...history.cycles].reverse()) {
    const direction = cycle.target_summary[target]?.direction;
    if (direction) return direction;
  }
  return "maximize";
}

function targetClassOrder(history: ExperimentHistoryResponse | null, target: string): Array<string | number> {
  const configured = targetSetting(history, target)?.class_order ?? [];
  if (configured.length) return [...configured];
  if (!history) return [];
  const values: Array<string | number> = [];
  for (const cycle of history.cycles) {
    for (const row of cycle.rows) {
      const value = row[target];
      if (typeof value !== "string" && typeof value !== "number") continue;
      if (!values.some((current) => typeof current === typeof value && String(current) === String(value))) {
        values.push(value);
      }
    }
  }
  return values;
}

function isParetoContinuousTask(task: string): boolean {
  return task === "regression" || task === "ordinal";
}

function paretoValue(
  history: ExperimentHistoryResponse | null,
  target: string,
  value: unknown
): number | null {
  const task = targetTaskType(history, target);
  if (task === "regression") {
    const converted = typeof value === "number" ? value : Number(value);
    return Number.isFinite(converted) ? converted : null;
  }
  if (task !== "ordinal") return null;
  const order = targetClassOrder(history, target);
  const index = order.findIndex((candidate) => (
    typeof candidate === typeof value && String(candidate) === String(value)
  ));
  if (index >= 0) return index;
  const converted = typeof value === "number" ? value : Number(value);
  return Number.isFinite(converted) ? converted : null;
}

function paretoRelationPoints(
  history: ExperimentHistoryResponse | null,
  xTarget: string,
  yTarget: string
): ParetoRelationPoint[] {
  if (!history || !xTarget || !yTarget || xTarget === yTarget) return [];
  const xTask = targetTaskType(history, xTarget);
  const yTask = targetTaskType(history, yTarget);
  if (!isParetoContinuousTask(xTask) || !isParetoContinuousTask(yTask)) return [];
  if (targetSetting(history, xTarget)?.optimize === false || targetSetting(history, yTarget)?.optimize === false) {
    return [];
  }
  return history.cycles.flatMap((cycle) => cycle.rows.flatMap((row, rowIndex) => {
    const x = paretoValue(history, xTarget, row[xTarget]);
    const y = paretoValue(history, yTarget, row[yTarget]);
    return x === null || y === null ? [] : [{
      x,
      y,
      displayX: row[xTarget],
      displayY: row[yTarget],
      cycle,
      row,
      rowIndex
    }];
  }));
}

function dominates(
  left: ParetoRelationPoint,
  right: ParetoRelationPoint,
  xDirection: string,
  yDirection: string
): boolean {
  const xBetterOrEqual = xDirection === "minimize" ? left.x <= right.x : left.x >= right.x;
  const yBetterOrEqual = yDirection === "minimize" ? left.y <= right.y : left.y >= right.y;
  const xStrict = xDirection === "minimize" ? left.x < right.x : left.x > right.x;
  const yStrict = yDirection === "minimize" ? left.y < right.y : left.y > right.y;
  return xBetterOrEqual && yBetterOrEqual && (xStrict || yStrict);
}

function cumulativeParetoFront(
  points: ParetoRelationPoint[],
  xDirection: string,
  yDirection: string
): ParetoRelationPoint[] {
  const front = points.filter((point, index) => !points.some((candidate, candidateIndex) => (
    index !== candidateIndex && dominates(candidate, point, xDirection, yDirection)
  )));
  const unique = new Map<string, ParetoRelationPoint>();
  for (const point of front) {
    unique.set(`${point.x}:${point.y}`, point);
  }
  return [...unique.values()].sort((left, right) => left.x - right.x);
}

function paretoFrontTraces(
  history: ExperimentHistoryResponse | null,
  xTarget: string,
  yTarget: string
): Data[] {
  const points = paretoRelationPoints(history, xTarget, yTarget);
  if (!points.length) return [];
  const front = cumulativeParetoFront(
    points,
    targetDirection(history, xTarget),
    targetDirection(history, yTarget)
  );
  if (!front.length) return [];
  return [{
    type: "scatter",
    mode: "lines+markers",
    name: "累積Pareto front",
    x: front.map((point) => point.displayX) as any,
    y: front.map((point) => point.displayY) as any,
    text: front.map((point) => cyclePointHover(point.cycle, point.row, point.rowIndex)),
    marker: { size: 10, symbol: "diamond-open" },
    line: { dash: "dash", width: 2 },
    hovertemplate: "%{text}<extra></extra>"
  } as Data];
}
'''
          if helper_marker not in content:
              raise RuntimeError("history helper insertion marker missing")
          content = content.replace(helper_marker, pareto_helpers + helper_marker, 1)
          old_block = """  const targetRelationData = useMemo(\n    () => cycleScatterTraces(history, selectedTargetX, selectedTargetY),\n    [history, selectedTargetX, selectedTargetY]\n  );\n  const selectedTargetXTask = targetTaskType(history, selectedTargetX);\n  const selectedTargetYTask = targetTaskType(history, selectedTargetY);"""
          new_block = """  const selectedTargetXTask = targetTaskType(history, selectedTargetX);\n  const selectedTargetYTask = targetTaskType(history, selectedTargetY);\n  const selectedTargetXOrder = targetClassOrder(history, selectedTargetX);\n  const selectedTargetYOrder = targetClassOrder(history, selectedTargetY);\n  const targetRelationData = useMemo(\n    () => [\n      ...cycleScatterTraces(history, selectedTargetX, selectedTargetY),\n      ...paretoFrontTraces(history, selectedTargetX, selectedTargetY)\n    ],\n    [history, selectedTargetX, selectedTargetY]\n  );"""
          if old_block not in content:
              raise RuntimeError("history relation memo block missing")
          content = content.replace(old_block, new_block, 1)
          content = content.replace(
              "回帰値・カテゴリ値・順序カテゴリを同じ関係図でサイクル別に表示します。",
              "回帰値・カテゴリ値・順序カテゴリを同じ関係図で表示し、両軸が回帰または順序目的の場合は累積Pareto frontを重ねます。",
              1,
          )
          content = content.replace(
              '...(selectedTargetXTask === "regression" ? {} : { type: "category" as const })',
              '...(selectedTargetXTask === "regression" ? {} : {\n                type: "category" as const,\n                categoryorder: "array" as const,\n                categoryarray: selectedTargetXOrder\n              })',
              1,
          )
          content = content.replace(
              '...(selectedTargetYTask === "regression" ? {} : { type: "category" as const })',
              '...(selectedTargetYTask === "regression" ? {} : {\n                type: "category" as const,\n                categoryorder: "array" as const,\n                categoryarray: selectedTargetYOrder\n              })',
              1,
          )
          write(path, content)

          # Tests now validate the public API and conditional history Pareto overlay.
          path = "tests/test_webapp_advanced_controls.py"
          content = read(path)
          content = content.replace(
              "from bochan.serving.webapp.visualization_sessions import (\n    VisualizationSession,\n    _target_relation,\n    model_details,",
              "from bochan.serving.webapp.visualization_sessions import (\n    VisualizationSession,\n    model_details,",
              1,
          )
          content = content.replace(
              "import pandas as pd\n\nfrom bochan.serving.webapp.app import",
              "import pandas as pd\n\nfrom bochan.visualization import show_target_relation_plot\nfrom bochan.serving.webapp.app import",
              1,
