              1,
          )
          write(path, content)

          # Remove this one-shot carrier from the resulting product diff.
          Path(".github/workflows/agent-refine-target-relation.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
