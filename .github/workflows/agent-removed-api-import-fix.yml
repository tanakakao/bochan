name: Agent removed API import fix

on:
  push:
    branches:
      - agent/api-root-responsibility-cleanup

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[agent-removed-api-import-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/api-root-responsibility-cleanup
          fetch-depth: 0
      - name: Fix and audit removed API imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import compileall

          path = Path('src/bochan/api/configs/acquisition.py')
          text = path.read_text(encoding='utf-8')
          old = 'from ..feasibility_defaults import build_outcome_constrained_acquisition'
          new = 'from ..acquisition.feasibility import build_outcome_constrained_acquisition'
          if old not in text:
              raise RuntimeError('expected feasibility_defaults import was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')

          forbidden_absolute = (
              'bochan.api.acquisition_config',
              'bochan.api.acquisition_registry',
              'bochan.api.acquisition_service',
              'bochan.api.automatic_best_f',
              'bochan.api.automatic_default_utils',
              'bochan.api.automatic_multiobjective',
              'bochan.api.candidate_output',
              'bochan.api.candidate_uniqueness',
              'bochan.api.classification_perturbation_defaults',
              'bochan.api.composition',
              'bochan.api.cross_validation',
              'bochan.api.engine',
              'bochan.api.engine_defaults',
              'bochan.api.experiment_failure',
              'bochan.api.feasibility_defaults',
              'bochan.api.fit_config',
              'bochan.api.hetero_ordinal_perturbation',
              'bochan.api.information_acquisition_defaults',
              'bochan.api.kronecker_input_perturbation_defaults',
              'bochan.api.llm_candidate_explanation',
              'bochan.api.llm_selected_acquisition',
              'bochan.api.llm_suggestion',
              'bochan.api.model_capabilities',
              'bochan.api.model_registry',
              'bochan.api.nan_multiobjective',
              'bochan.api.observation_engine',
              'bochan.api.observation_service',
              'bochan.api.optimizer_api',
              'bochan.api.optimizer_config',
              'bochan.api.optimizer_dispatch',
              'bochan.api.optimizer_support',
              'bochan.api.study_controls',
              'bochan.api.study_results',
          )
          forbidden_api_relative = (
              'from .engine ', 'from .engine import', 'from ..engine ', 'from ..engine import',
              'from .feasibility_defaults ', 'from .feasibility_defaults import',
              'from ..feasibility_defaults ', 'from ..feasibility_defaults import',
              'from .optimizer_api ', 'from .optimizer_api import',
              'from ..optimizer_api ', 'from ..optimizer_api import',
              'from .optimizer_dispatch ', 'from .optimizer_dispatch import',
              'from ..optimizer_dispatch ', 'from ..optimizer_dispatch import',
              'from .optimizer_support ', 'from .optimizer_support import',
              'from ..optimizer_support ', 'from ..optimizer_support import',
          )

          bad = []
          for source in Path('src/bochan').rglob('*.py'):
              for number, line in enumerate(source.read_text(encoding='utf-8').splitlines(), start=1):
                  stripped = line.strip()
                  if not (stripped.startswith('from ') or stripped.startswith('import ')):
                      continue
                  if any(name in stripped for name in forbidden_absolute):
                      bad.append(f'{source}:{number}: {stripped}')

          api_root = Path('src/bochan/api')
          for source in api_root.rglob('*.py'):
              for number, line in enumerate(source.read_text(encoding='utf-8').splitlines(), start=1):
                  stripped = line.strip()
                  if not (stripped.startswith('from ') or stripped.startswith('import ')):
                      continue
                  if any(fragment in stripped for fragment in forbidden_api_relative):
                      bad.append(f'{source}:{number}: {stripped}')

          if bad:
              raise RuntimeError('removed API imports remain:\n' + '\n'.join(sorted(set(bad))))
          if not compileall.compile_dir('src/bochan/api', quiet=1):
              raise RuntimeError('API compileall failed')
          PY
      - name: Commit canonical feasibility import
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/agent-removed-api-import-fix.yml
          git add -A
          git commit -m "Remove remaining production imports of deleted API paths"
          git push origin HEAD:agent/api-root-responsibility-cleanup
