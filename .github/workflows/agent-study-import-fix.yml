name: Agent study package import fix

on:
  push:
    branches:
      - agent/api-root-responsibility-cleanup

permissions:
  contents: write

jobs:
  refactor:
    if: contains(github.event.head_commit.message, '[agent-study-import-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/api-root-responsibility-cleanup
          fetch-depth: 0
      - name: Fix study package imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import compileall

          path = Path('src/bochan/api/study/core.py')
          text = path.read_text(encoding='utf-8')
          old_configs = 'from .configs import ('
          old_engine = 'from .engine import BayesianOptimizer'
          if old_configs not in text or old_engine not in text:
              raise RuntimeError('expected pre-refactor study imports were not found')
          text = text.replace(old_configs, 'from ..configs import (', 1)
          text = text.replace(
              old_engine,
              'from ..optimizer.core import BayesianOptimizer',
              1,
          )
          path.write_text(text, encoding='utf-8')

          for study_path in Path('src/bochan/api/study').glob('*.py'):
              current = study_path.read_text(encoding='utf-8')
              for invalid in ('from .configs', 'from .engine'):
                  if invalid in current:
                      raise RuntimeError(
                          f'invalid moved-package import remains in {study_path}: {invalid}'
                      )
          if not compileall.compile_dir('src/bochan/api/study', quiet=1):
              raise RuntimeError('study package compileall failed')
          PY
      - name: Commit study import fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/agent-study-import-fix.yml
          git add -A
          git commit -m "Fix study package relative imports"
          git push origin HEAD:agent/api-root-responsibility-cleanup
