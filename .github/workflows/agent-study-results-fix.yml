name: Generate Study best_x shape fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/study-best-results-visualization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/study-best-results-visualization
      - name: Patch best_x and create commit object
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          path = Path("src/bochan/api/study_results.py")
          text = path.read_text(encoding="utf-8")
          old = '''    return get_best_trial(
        self,
        output_index=output_index,
        direction=direction,
    ).x
'''
          new = '''    x = get_best_trial(
        self,
        output_index=output_index,
        direction=direction,
    ).x
    shape = getattr(x, "shape", None)
    if shape is not None:
        try:
            if len(shape) > 1 and int(shape[0]) == 1:
                return x[0]
        except (TypeError, ValueError):
            pass
    if isinstance(x, Sequence) and not isinstance(x, (str, bytes)):
        try:
            if len(x) == 1 and isinstance(x[0], Sequence):
                return x[0]
        except (TypeError, IndexError):
            pass
    return x
'''
          if old not in text:
              raise RuntimeError("get_best_x patch marker was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          parent = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

          def api(api_path, data=None):
              body = None if data is None else json.dumps(data).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{api_path}",
                  data=body,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="GET" if data is None else "POST",
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          parent_commit = api(f"/git/commits/{parent}")
          blob = api(
              "/git/blobs",
              {"content": path.read_text(encoding="utf-8"), "encoding": "utf-8"},
          )
          tree = api(
              "/git/trees",
              {
                  "base_tree": parent_commit["tree"]["sha"],
                  "tree": [
                      {
                          "path": str(path),
                          "mode": "100644",
                          "type": "blob",
                          "sha": blob["sha"],
                      }
                  ],
              },
          )
          commit = api(
              "/git/commits",
              {
                  "message": "Normalize Study best_x shape",
                  "tree": tree["sha"],
                  "parents": [parent],
              },
          )
          Path("generated_fix_sha.txt").write_text(commit["sha"] + "\n", encoding="utf-8")
          print(commit["sha"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: study-results-shape-fix
          path: generated_fix_sha.txt
