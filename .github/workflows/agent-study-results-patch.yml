name: Apply Study results integration

on:
  push:
    branches:
      - agent/study-best-results-visualization
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/study-best-results-visualization' || github.ref_name == 'agent/study-best-results-visualization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/study-best-results-visualization
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/agent_apply_study_results.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'text = path.read_text(encoding="utf-8")n\nmethod_marker',
              'text = path.read_text(encoding="utf-8")\nmethod_marker',
          )
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile tools/agent_apply_study_results.py
          python tools/agent_apply_study_results.py
          python -m py_compile \
            src/bochan/api/study_results.py \
            src/bochan/api/study_controls.py \
            src/bochan/visualization/study.py \
            src/bochan/visualization/__init__.py \
            tests/api/test_study_results.py \
            tests/test_study_visualization.py
      - name: Create integration commit object
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()

          def api(path, data=None):
              body = None if data is None else json.dumps(data).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  data=body,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="GET" if data is None else "POST",
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          parent_commit = api(f"/git/commits/{parent}")
          base_tree = parent_commit["tree"]["sha"]
          paths = [
              "src/bochan/api/STUDY_README.md",
              "src/bochan/api/study_controls.py",
              "src/bochan/visualization/README.md",
              "src/bochan/visualization/__init__.py",
              "src/bochan/visualization/study.py",
          ]
          entries = []
          for file_path in paths:
              blob = api(
                  "/git/blobs",
                  {
                      "content": Path(file_path).read_text(encoding="utf-8"),
                      "encoding": "utf-8",
                  },
              )
              entries.append(
                  {
                      "path": file_path,
                      "mode": "100644",
                      "type": "blob",
                      "sha": blob["sha"],
                  }
              )

          tree = api(
              "/git/trees",
              {"base_tree": base_tree, "tree": entries},
          )
          commit = api(
              "/git/commits",
              {
                  "message": "Add Study best results and visualization",
                  "tree": tree["sha"],
                  "parents": [parent],
              },
          )
          Path("generated_commit_sha.txt").write_text(
              commit["sha"] + "\n",
              encoding="utf-8",
          )
          print(commit["sha"])
          PY
      - name: Upload generated commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: study-results-generated-commit
          path: generated_commit_sha.txt
