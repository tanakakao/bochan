name: Apply Study results integration

on:
  push:
    branches:
      - agent/study-best-results-visualization
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/study-best-results-visualization' || github.ref_name == 'agent/study-best-results-visualization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/study-best-results-visualization
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/agent_apply_study_results.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'text = path.read_text(encoding="utf-8")n\nmethod_marker',
              'text = path.read_text(encoding="utf-8")\nmethod_marker',
          )
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile tools/agent_apply_study_results.py
          python tools/agent_apply_study_results.py
          python -m py_compile \
            src/bochan/api/study_results.py \
            src/bochan/api/study_controls.py \
            src/bochan/visualization/study.py \
            src/bochan/visualization/__init__.py \
            tests/api/test_study_results.py \
            tests/test_study_visualization.py
      - name: Commit integrated changes
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add \
            .github/workflows/wide-multitask-smoke.yml \
            src/bochan/api/STUDY_README.md \
            src/bochan/api/study_controls.py \
            src/bochan/visualization/README.md \
            src/bochan/visualization/__init__.py \
            src/bochan/visualization/study.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Study best results and visualization"
          git push origin HEAD:agent/study-best-results-visualization
