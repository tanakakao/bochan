name: Trigger experiment categorical patch

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/experiment-categorical-plots-restore

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/experiment-categorical-plots-restore
          fetch-depth: 0
      - name: Execute one-shot patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          import traceback

          source = Path('.github/workflows/agent-apply-experiment-categorical.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          git config"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          code = textwrap.dedent(source[start:end])
          try:
              exec(compile(code, 'agent-experiment-patch.py', 'exec'))
          except Exception:
              Path('/tmp/agent-patch-error.txt').write_text(traceback.format_exc(), encoding='utf-8')
          PY

          if [ -f /tmp/agent-patch-error.txt ]; then
            git reset --hard HEAD
            cp /tmp/agent-patch-error.txt agent-patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add agent-patch-error.txt
            git commit -m "Record experiment patch diagnostic"
            git push origin HEAD:agent/experiment-categorical-plots-restore
            exit 0
          fi

          rm -f .github/workflows/agent-trigger-experiment-categorical.yml
          rm -f agent-trigger-experiment-categorical.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support categorical experiment results and restored plots"
          git push origin HEAD:agent/experiment-categorical-plots-restore
