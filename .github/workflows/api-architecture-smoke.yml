name: API architecture smoke

on:
  push:
    branches:
      - agent/api-architecture-refactor
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -e ".[test,tabular,api]"
          python -m pip install ruff
      - name: Run focused API tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_api_architecture.py \
            tests/test_api_automatic_defaults.py \
            tests/test_api_nsgaii_strategy.py \
            tests/test_llm_selected_acquisition_config.py \
            tests/test_observation_data.py \
            tests/test_partial_observation_api.py \
            tests/test_tabular_architecture.py \
            tests/test_tabular_multi_output_categories.py \
            tests/test_tabular_ordinal_rank_string_labels.py \
            tests/test_tabular_prediction_labels.py \
            tests/test_tabular_deepgp_candidate_output.py \
            tests/test_fastapi_tabular_category_constraints.py \
            tests/test_fastapi_tabular_endpoints.py
      - name: Run Ruff
        run: |
          ruff check \
            --per-file-ignores "src/bochan/api/registry/acquisition.py:UP035" \
            src/bochan/api/__init__.py \
            src/bochan/api/acquisition/__init__.py \
            src/bochan/api/acquisition/classification.py \
            src/bochan/api/acquisition/defaults.py \
            src/bochan/api/acquisition/service.py \
            src/bochan/api/candidate/__init__.py \
            src/bochan/api/candidate/output.py \
            src/bochan/api/configs/__init__.py \
            src/bochan/api/configs/acquisition.py \
            src/bochan/api/configs/base.py \
            src/bochan/api/configs/fit.py \
            src/bochan/api/configs/optimize.py \
            src/bochan/api/llm/__init__.py \
            src/bochan/api/llm/acquisition.py \
            src/bochan/api/llm/explanation.py \
            src/bochan/api/llm/suggestion.py \
            src/bochan/api/observation/__init__.py \
            src/bochan/api/observation/state.py \
            src/bochan/api/observation/service.py \
            src/bochan/api/optimizer.py \
            src/bochan/api/registry/__init__.py \
            src/bochan/api/registry/acquisition.py \
            src/bochan/api/registry/model.py \
            src/bochan/tabular/__init__.py \
            src/bochan/tabular/composition_bounds_optimizer.py \
            src/bochan/tabular/composition_total_constraints.py \
            src/bochan/tabular/multi_output_categories.py \
            src/bochan/tabular/ordinal_rank_labels.py \
            src/bochan/tabular/prediction.py \
            src/bochan/tabular/public_optimizer.py \
            src/bochan/serving/fastapi/routers/candidates.py \
            src/bochan/serving/fastapi/routers/models.py \
            src/bochan/serving/fastapi/routers/suggestions.py \
            src/bochan/serving/fastapi/routers/tabular.py \
            src/bochan/serving/fastapi/services/__init__.py \
            src/bochan/serving/fastapi/services/candidates.py \
            src/bochan/serving/fastapi/services/tabular.py \
            src/bochan/serving/fastapi/stores/object.py \
            src/bochan/serving/fastapi/tabular_compat.py \
            tests/test_api_architecture.py \
            tests/test_fastapi_tabular_category_constraints.py \
            tests/test_llm_selected_acquisition_config.py \
            tests/test_tabular_architecture.py
