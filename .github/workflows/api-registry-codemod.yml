name: API registry workflow scan

on:
  push:
    branches:
      - agent/api-registry-layout

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/api-registry-layout
      - name: List old registry references in workflows
        shell: bash
        run: |
          git grep -n -E 'bochan\.api\.(model_registry|acquisition_registry)|src/bochan/api/(model_registry|acquisition_registry)\.py' -- '.github/workflows/*' || true
