name: Apply classification duplicate exclusion

on:
  push:
    branches:
      - agent/exclude-classification-duplicates
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exclude-classification-duplicates
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply readable patch modules
        env:
          PYTHONPATH: .github/scripts
        run: |
          python -m py_compile .github/scripts/dupfix/*.py
          python -m dupfix.main
          git diff --check

      - name: Install test dependencies
        run: python -m pip install -e '.[test,tabular,api]'

      - name: Validate changed Python files
        run: |
          python -m pip install ruff
          mapfile -t changed_python < <(
            git diff --name-only -- '*.py' \
              | grep -v '^.github/scripts/'
          )
          test "${#changed_python[@]}" -gt 0
          python -m compileall -q "${changed_python[@]}"
          ruff check --select E9,F63,F7,F82 "${changed_python[@]}"
          ruff check --fix \
            src/bochan/acquisition/_duplicate_exclusion.py \
            tests/test_classification_duplicate_exclusion.py
          ruff format \
            src/bochan/acquisition/_duplicate_exclusion.py \
            tests/test_classification_duplicate_exclusion.py
          ruff check \
            src/bochan/acquisition/_duplicate_exclusion.py \
            tests/test_classification_duplicate_exclusion.py
          git diff --check

      - name: Run focused classification tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_classification_duplicate_exclusion.py \
            tests/test_wide_multitask_classification_acquisitions.py \
            tests/test_api_candidate_uniqueness.py

      - name: Commit validated source changes
        run: |
          rm -rf src/bochan.egg-info
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'Hard-exclude classification candidate duplicates'
          git push origin HEAD:agent/exclude-classification-duplicates
