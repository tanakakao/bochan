name: Apply composition step beam patch

on:
  push:
    branches:
      - codex/composition-step-beam

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/composition-step-beam
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/scripts/apply_composition_step_beam_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src web docs tests
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: support beam search for stepped compositions"
          git push origin HEAD:codex/composition-step-beam
