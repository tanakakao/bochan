name: Apply stepped Beam regression test updates

on:
  push:
    branches:
      - codex/composition-step-beam

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/composition-step-beam
          fetch-depth: 0
      - name: Update stale regression expectations
        run: python .github/scripts/update_step_beam_regression_tests.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_composition_best_subset.py tests/test_webapp_composition_support.py
          git diff --cached --check
          git commit -m "test: align stepped Beam regression expectations"
          git push origin HEAD:codex/composition-step-beam
