name: Apply stepped Beam seed fix

on:
  push:
    branches:
      - codex/composition-step-beam

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/composition-step-beam
          fetch-depth: 0
      - run: python .github/scripts/fix_step_beam_seed_config.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "fix: preserve base optimize config in beam seeding"
          git push origin HEAD:codex/composition-step-beam
