name: Apply variable-total stepped Beam test update

on:
  push:
    branches:
      - codex/composition-step-beam

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/composition-step-beam
          fetch-depth: 0
      - name: Update stale variable-total expectation
        run: python .github/scripts/update_variable_total_step_beam_test.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_composition_variable_total_best_subset.py
          git diff --cached --check
          git commit -m "test: allow stepped Beam for variable totals"
          git push origin HEAD:codex/composition-step-beam
