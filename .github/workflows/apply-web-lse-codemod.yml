name: Apply Web LSE settings patch

on:
  push:
    branches:
      - agent/fix-web-lse-settings
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-web-lse-settings
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply source patch
        run: |
          python tools/codemod_web_lse_settings.py
          python tools/codemod_web_lse_marker_fix.py
          python tools/codemod_web_lse_followup.py
          python tools/codemod_web_lse_test_followup.py
          python tools/codemod_web_lse_lint_followup.py
          python tools/codemod_web_lse_sequential_followup.py
          python tools/codemod_web_lse_ci_followup.py
          git diff --check

      - name: Install Python dependencies
        run: python -m pip install -e ".[test,api,visualization]"

      - name: Run focused Web LSE tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_webapp_level_set_settings.py \
            tests/test_webapp_lse_web_contract.py \
            tests/test_webapp_input_perturbation_risk.py \
            tests/test_webapp_input_perturbation_prediction_shape.py

      - name: Run Ruff
        run: |
          python -m pip install ruff
          ruff check --ignore I001,SIM102,SIM108 \
            src/bochan/serving/webapp/level_set_settings.py \
            src/bochan/serving/webapp/risk_settings.py \
            src/bochan/serving/webapp/search_settings.py \
            src/bochan/serving/webapp/target_settings.py \
            src/bochan/serving/webapp/workflows.py \
            src/bochan/serving/webapp/workflows_tabular.py \
            tests/test_webapp_input_perturbation_risk.py \
            tests/test_webapp_input_perturbation_prediction_shape.py \
            tests/test_webapp_lse_web_contract.py

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build Web
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit validated source changes
        run: |
          rm -f tools/codemod_web_lse_settings.py
          rm -f tools/codemod_web_lse_marker_fix.py
          rm -f tools/codemod_web_lse_followup.py
          rm -f tools/codemod_web_lse_test_followup.py
          rm -f tools/codemod_web_lse_lint_followup.py
          rm -f tools/codemod_web_lse_sequential_followup.py
          rm -f tools/codemod_web_lse_ci_followup.py
          rm -f .github/workflows/apply-web-lse-codemod.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
            exit 0
          fi
          git commit -m "Complete Web level-set estimation settings"
          git push origin HEAD:agent/fix-web-lse-settings
