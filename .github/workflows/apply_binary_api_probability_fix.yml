name: Apply binary API probability contract

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/binary-api-probability-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply API fixes
        run: |
          python .github/scripts/update_binary_api_engine.py
          python .github/scripts/update_binary_api_modular.py
          python .github/scripts/update_binary_api_legacy.py
          python .github/scripts/update_binary_api_docs.py

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,api]'

      - name: Compile changed source
        run: |
          python -m compileall -q \
            src/bochan/api \
            src/bochan/serving/fastapi \
            tests/test_binary_api_prediction.py \
            tests/test_binary_fastapi_prediction.py

      - name: Run API contract tests
        run: |
          pytest -q \
            tests/test_binary_api_prediction.py \
            tests/test_binary_fastapi_prediction.py

      - name: Run binary likelihood regression tests
        run: pytest -q tests/test_binary_likelihood_consistency.py

      - name: Remove generated artifacts
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf src/bochan.egg-info .pytest_cache

      - name: Remove one-off files
        run: |
          rm .github/scripts/update_binary_api_engine.py
          rm .github/scripts/update_binary_api_modular.py
          rm .github/scripts/update_binary_api_legacy.py
          rm .github/scripts/update_binary_api_docs.py
          rm .github/workflows/apply_binary_api_probability_fix.yml

      - name: Commit API fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Clarify binary prediction contract in APIs'
          git push origin HEAD:fix/binary-api-probability-contract
