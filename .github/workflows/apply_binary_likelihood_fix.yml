name: Apply binary likelihood consistency fix

on:
  push:
    branches:
      - fix/binary-likelihood-consistency
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/binary-likelihood-consistency
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply likelihood-aware migration
        run: |
          set +e
          python .github/scripts/apply_binary_likelihood_fix.py > binary-migration.log 2>&1
          status=$?
          cat binary-migration.log
          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add binary-migration.log
            git commit -m 'Record binary migration failure'
            git push origin HEAD:fix/binary-likelihood-consistency
            exit "$status"
          fi
          rm -f binary-migration.log

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,tabular,evo]'
          python -m pip install ruff

      - name: Format newly generated files
        run: |
          ruff format \
            src/bochan/acquisition/binary/_likelihood.py \
            tests/test_binary_likelihood_consistency.py

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run likelihood consistency tests
        run: pytest -q tests/test_binary_likelihood_consistency.py

      - name: Run core binary acquisition tests
        run: |
          set +e
          pytest -q \
            tests/test_binary_probability_bo_pointwise.py \
            tests/test_binary_multiclass_aligned_defaults.py \
            > binary-test.log 2>&1
          status=$?
          cat binary-test.log
          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add binary-test.log
            git commit -m 'Record binary regression test failure'
            git push origin HEAD:fix/binary-likelihood-consistency
            exit "$status"
          fi
          rm -f binary-test.log

      - name: Collect all binary tests
        run: pytest --collect-only -q tests/test_binary*.py

      - name: Remove generated build artifacts
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf src/bochan.egg-info .pytest_cache

      - name: Remove one-off migration files
        run: |
          rm .github/scripts/apply_binary_likelihood_fix.py
          rm .github/workflows/apply_binary_likelihood_fix.yml

      - name: Commit generated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            src/bochan/acquisition/binary \
            src/bochan/optim/nsgaii.py \
            pyproject.toml \
            tests/__init__.py \
            tests/test_binary_likelihood_consistency.py \
            tests/test_binary_multiclass_aligned_defaults.py \
            .github/scripts \
            .github/workflows
          git diff --cached --stat
          git commit -m 'Fix binary likelihood link consistency'
          git push origin HEAD:fix/binary-likelihood-consistency
