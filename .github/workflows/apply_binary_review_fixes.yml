name: Apply final binary likelihood review fixes

on:
  push:
    branches:
      - fix/binary-likelihood-consistency
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/binary-likelihood-consistency
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply review fixes
        run: python .github/scripts/apply_binary_review_fixes.py

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,tabular,evo]'

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run likelihood consistency tests
        run: pytest -q tests/test_binary_likelihood_consistency.py

      - name: Run core binary acquisition tests
        run: |
          pytest -q \
            tests/test_binary_probability_bo_pointwise.py \
            tests/test_binary_multiclass_aligned_defaults.py

      - name: Collect full binary suite
        run: pytest --collect-only -q tests/test_binary*.py

      - name: Remove generated artifacts
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf src/bochan.egg-info .pytest_cache

      - name: Remove one-off files
        run: |
          rm -f .github/scripts/apply_binary_review_fixes.py
          rm -f .github/scripts/run_binary_review_fixes.py
          rm -f .github/scripts/sitecustomize.py
          rm -f .github/workflows/apply_binary_review_fixes.yml
          rm -f .github/workflows/debug_binary_non_slow.yml

      - name: Commit review fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            src/bochan/acquisition/binary \
            tests/test_binary_likelihood_consistency.py \
            .github/scripts \
            .github/workflows
          git diff --cached --stat
          git commit -m 'Harden likelihood-aware binary sample conversion'
          git push origin HEAD:fix/binary-likelihood-consistency
