name: Apply binary visualization probability fix

on:
  push:
    branches:
      - fix/binary-likelihood-consistency
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/binary-likelihood-consistency
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply visualization fix
        run: python .github/scripts/apply_binary_visualization_fix.py

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,tabular,evo]'

      - name: Compile changed source
        run: python -m compileall -q src/bochan/visualization tests/test_binary_visualization_probability.py

      - name: Run visualization probability tests
        run: pytest -q tests/test_binary_visualization_probability.py

      - name: Run binary likelihood regression tests
        run: pytest -q tests/test_binary_likelihood_consistency.py

      - name: Remove generated artifacts
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf src/bochan.egg-info .pytest_cache

      - name: Remove one-off files
        run: |
          rm .github/scripts/apply_binary_visualization_fix.py
          rm .github/workflows/apply_binary_visualization_fix.yml

      - name: Commit visualization fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            src/bochan/visualization/utils.py \
            tests/test_binary_visualization_probability.py \
            .github/scripts \
            .github/workflows
          git diff --cached --stat
          git commit -m 'Use probability posterior in binary visualization'
          git push origin HEAD:fix/binary-likelihood-consistency
