name: Apply epistemic patch asset
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/binary-epistemic-uncertainty
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Extract patch
        run: |
          cp .github/assets/binary_epistemic_patch.dat /tmp/binary_epistemic_patch.zip
          unzip -o /tmp/binary_epistemic_patch.zip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,tabular,evo,visualization]'
      - name: Compile
        run: python -m compileall -q src/bochan/acquisition/binary src/bochan/visualization tests/test_binary_epistemic_uncertainty.py tests/test_binary_visualization_probability.py
      - name: Test epistemic behavior
        run: pytest -q tests/test_binary_epistemic_uncertainty.py tests/test_binary_visualization_probability.py
      - name: Test binary regressions
        run: pytest -q tests/test_binary_probability_bo_pointwise.py tests/test_binary_likelihood_consistency.py tests/test_binary_multiclass_aligned_defaults.py
      - name: Collect suite
        run: pytest --collect-only -q tests/test_binary*.py
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bochan/acquisition/binary src/bochan/visualization tests/test_binary_epistemic_uncertainty.py tests/test_binary_visualization_probability.py
          git commit -m 'Use epistemic uncertainty for binary optimization'
          git push origin HEAD:fix/binary-epistemic-uncertainty
