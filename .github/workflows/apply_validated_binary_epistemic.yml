name: Apply validated binary epistemic implementation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/binary-epistemic-uncertainty
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Download validated base workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/epistemic-workspace
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/tanakakao/bochan/actions/artifacts/7763361993/zip" \
            --output /tmp/epistemic-workspace.zip
          unzip -q /tmp/epistemic-workspace.zip -d /tmp/epistemic-workspace

      - name: Restore implementation files from workspace
        run: |
          files=(
            src/bochan/acquisition/binary/active_learning/hetero_multi_output.py
            src/bochan/acquisition/binary/active_learning/hetero_single_output.py
            src/bochan/acquisition/binary/active_learning/integrated_posterior_variance.py
            src/bochan/acquisition/binary/active_learning/multi_output.py
            src/bochan/acquisition/binary/active_learning/single_output.py
            src/bochan/acquisition/binary/bayesian_optimization/_utils.py
            src/bochan/acquisition/binary/bayesian_optimization/hetero_multi_output.py
            src/bochan/acquisition/binary/bayesian_optimization/hetero_single_output.py
            src/bochan/acquisition/binary/bayesian_optimization/multi_output.py
            src/bochan/acquisition/binary/bayesian_optimization/single_output.py
            src/bochan/acquisition/binary/epistemic.py
            src/bochan/visualization/data.py
            src/bochan/visualization/utils.py
            tests/test_binary_epistemic_uncertainty.py
            tests/test_binary_visualization_probability.py
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "${path}")"
            cp "/tmp/epistemic-workspace/${path}" "${path}"
          done

      - name: Apply locally validated delta
        run: |
          base64 --decode .github/validated/artifact_to_validated.patch.xz.b64 \
            | xz --decompress --stdout \
            > /tmp/artifact-to-validated.patch
          git apply --check /tmp/artifact-to-validated.patch
          git apply /tmp/artifact-to-validated.patch

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,tabular,evo,visualization]'

      - name: Compile changed modules
        run: |
          python -m compileall -q \
            src/bochan/acquisition/binary \
            src/bochan/visualization \
            tests/test_binary_epistemic_uncertainty.py \
            tests/test_binary_visualization_probability.py

      - name: Run epistemic behavior tests
        run: |
          pytest -q \
            tests/test_binary_epistemic_uncertainty.py \
            tests/test_binary_visualization_probability.py

      - name: Run existing binary regression tests
        run: |
          pytest -q \
            tests/test_binary_probability_bo_pointwise.py \
            tests/test_binary_likelihood_consistency.py \
            tests/test_binary_multiclass_aligned_defaults.py

      - name: Collect complete binary test suite
        run: pytest --collect-only -q tests/test_binary*.py

      - name: Remove generated and temporary files
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf src/bochan.egg-info .pytest_cache
          rm -rf .github/validated
          rm -f .github/workflows/apply_validated_binary_epistemic.yml

      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Use epistemic uncertainty for binary optimization'
          git push origin HEAD:fix/binary-epistemic-uncertainty
