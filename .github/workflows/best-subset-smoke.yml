name: Best Subset smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/bochan/api/support/best_subset.py"
      - "src/bochan/api/support/multi_group_best_subset.py"
      - "src/bochan/tabular/composition/multi_support.py"
      - "src/bochan/tabular/composition/multi_raw_support.py"
      - "src/bochan/tabular/composition/support.py"
      - "tests/test_k_sparse_best_subset.py"
      - "tests/test_k_sparse_best_subset_beam.py"
      - "tests/test_k_sparse_best_subset_cardinality.py"
      - "tests/test_k_sparse_best_subset_groups.py"
      - "tests/test_composition_multi_best_subset.py"
      - "tests/test_composition_multi_raw_best_subset.py"
      - ".github/workflows/best-subset-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,tabular]"
      - name: Test support search
        run: |
          pytest -q --maxfail=1 \
            tests/test_k_sparse_best_subset.py \
            tests/test_k_sparse_best_subset_beam.py \
            tests/test_k_sparse_best_subset_cardinality.py \
            tests/test_k_sparse_best_subset_groups.py \
            tests/test_composition_multi_best_subset.py \
            tests/test_composition_multi_raw_best_subset.py
      - name: Lint support search
        run: |
          python -m pip install ruff
          ruff check --ignore SIM108 \
            src/bochan/api/support/best_subset.py \
            src/bochan/api/support/multi_group_best_subset.py \
            src/bochan/tabular/composition/multi_support.py \
            src/bochan/tabular/composition/multi_raw_support.py \
            src/bochan/tabular/composition/support.py \
            tests/test_k_sparse_best_subset.py \
            tests/test_k_sparse_best_subset_beam.py \
            tests/test_k_sparse_best_subset_cardinality.py \
            tests/test_k_sparse_best_subset_groups.py \
            tests/test_composition_multi_best_subset.py \
            tests/test_composition_multi_raw_best_subset.py
