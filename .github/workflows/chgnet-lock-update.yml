name: Update CHGNet lockfile

on:
  push:
    branches:
      - feat/chgnet-phase2-encoder

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chgnet-phase2-encoder
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Install project Python
        run: uv python install 3.12
      - name: Resolve lockfile
        run: uv lock
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Update uv lock for CHGNet"
          git push origin HEAD:feat/chgnet-phase2-encoder
