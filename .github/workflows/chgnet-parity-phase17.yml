name: CHGNet parity Phase 17 smoke

on:
  pull_request:
    paths:
      - "src/bochan/models/regression/gaussian/materials/structure/chgnet_tensor_residual.py"
      - "src/bochan/models/regression/gaussian/materials/structure/chgnet_relaxation.py"
      - "src/bochan/models/regression/gaussian/materials/structure/chgnet_relax_rank.py"
      - "src/bochan/models/regression/gaussian/materials/structure/chgnet_relax_acquisition.py"
      - "src/bochan/models/regression/gaussian/materials/structure/__init__.py"
      - "tests/models/materials/test_chgnet_tensor_residual_phase17.py"
      - "tests/models/materials/test_chgnet_relaxation_phase17.py"
      - ".github/workflows/chgnet-parity-phase17.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,materials]"
          python -m pip install ruff
      - name: Run CHGNet parity tests
        run: |
          python -m pytest \
            tests/models/materials/test_chgnet_tensor_residual_phase17.py \
            tests/models/materials/test_chgnet_relaxation_phase17.py \
            -q
      - name: Ruff
        run: |
          ruff check \
            src/bochan/models/regression/gaussian/materials/structure/chgnet_tensor_residual.py \
            src/bochan/models/regression/gaussian/materials/structure/chgnet_relaxation.py \
            src/bochan/models/regression/gaussian/materials/structure/chgnet_relax_rank.py \
            src/bochan/models/regression/gaussian/materials/structure/chgnet_relax_acquisition.py \
            src/bochan/models/regression/gaussian/materials/structure/__init__.py \
            tests/models/materials/test_chgnet_tensor_residual_phase17.py \
            tests/models/materials/test_chgnet_relaxation_phase17.py
