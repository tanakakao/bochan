name: Codex optimizer config refactor

on:
  push:
    branches: [codex/refactor-optimizer-config]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/refactor-optimizer-config
          fetch-depth: 0
      - name: Apply refactor and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one occurrence, found {count}")
              return text.replace(old, new, 1)

          configs_path = Path("src/bochan/api/configs.py")
          configs = configs_path.read_text(encoding="utf-8")
          configs = replace_once(
              configs,
              dedent('''\
              OptimizerName = Literal[
                  "optimize_acqf",
                  "optimize_acqf_mixed",
                  "evo",
                  "optimize_acqf_evo",
                  "evo_mixed",
                  "optimize_acqf_evo_mixed",
                  "torch",
                  "optimize_acqf_torch",
                  "torch_mixed",
                  "optimize_acqf_torch_mixed",
                  "nsgaii",
                  "optimize_acqf_nsgaii",
              ]'''),
              dedent('''\
              EvolutionaryMethod = Literal["ga", "pso", "sa", "cmaes"]
              OptimizerName = Literal[
                  "optimize_acqf",
                  "evo",
                  "ga",
                  "pso",
                  "sa",
                  "cmaes",
                  "torch",
                  "nsgaii",
                  "thompson_sampling",
              ]'''),
              "OptimizerName",
          )
          configs = replace_once(
              configs,
              dedent('''\
                  optimizer: OptimizerName | Callable[..., Any] = "optimize_acqf"
                  optimizer_kwargs: dict[str, Any] = field(default_factory=dict)

                  post_processing_func: Callable[..., Any] | None = None'''),
              dedent('''\
                  optimizer: OptimizerName | str | Callable[..., Any] = "optimize_acqf"
                  evo_method: EvolutionaryMethod = "ga"
                  optimizer_kwargs: dict[str, Any] = field(default_factory=dict)

                  post_processing_func: Callable[..., Any] | None = None'''),
              "OptimizeConfig fields",
          )
          configs = replace_once(
              configs,
              dedent('''\
                  return_best_only: bool = True


              @dataclass
              class ModelBundle:'''),
              dedent('''\
                  return_best_only: bool = True

                  def __post_init__(self) -> None:
                      if callable(self.optimizer) and not isinstance(self.optimizer, str):
                          return

                      name = str(self.optimizer).replace("-", "_").lower()
                      aliases = {
                          "optimize_acqf_mixed": "optimize_acqf",
                          "optimize_acqf_evo": "evo",
                          "evo_mixed": "evo",
                          "optimize_acqf_evo_mixed": "evo",
                          "optimize_acqf_torch": "torch",
                          "torch_mixed": "torch",
                          "optimize_acqf_torch_mixed": "torch",
                          "optimize_acqf_nsgaii": "nsgaii",
                          "optimize_thompson_sampling": "thompson_sampling",
                          "optimize_thompson_sampling_mixed": "thompson_sampling",
                          "thompson": "thompson_sampling",
                      }
                      name = aliases.get(name, name)

                      evolutionary_methods = {"ga", "pso", "sa", "cmaes"}
                      if name in evolutionary_methods:
                          self.evo_method = name  # type: ignore[assignment]
                          name = "evo"

                      valid = {"optimize_acqf", "evo", "torch", "nsgaii", "thompson_sampling"}
                      if name not in valid:
                          raise ValueError(
                              f"Unknown optimizer: {self.optimizer!r}. "
                              f"Expected one of {sorted(valid | evolutionary_methods)}."
                          )

                      self.optimizer = name
                      self.optimizer_kwargs = dict(self.optimizer_kwargs)
                      if name == "evo":
                          self.optimizer_kwargs.setdefault("method", self.evo_method)


              @dataclass
              class ModelBundle:'''),
              "OptimizeConfig post-init",
          )
          configs_path.write_text(configs, encoding="utf-8")

          engine_path = Path("src/bochan/api/engine.py")
          engine = engine_path.read_text(encoding="utf-8")
          engine = replace_once(
              engine,
              dedent('''\
                      "torch": "torch_mixed",
                      "optimize_acqf_torch": "optimize_acqf_torch_mixed",
                  }'''),
              dedent('''\
                      "torch": "torch_mixed",
                      "optimize_acqf_torch": "optimize_acqf_torch_mixed",
                      "thompson_sampling": "thompson_sampling_mixed",
                  }'''),
              "mixed optimizer mapping",
          )
          engine = replace_once(
              engine,
              dedent('''\
                      "torch_mixed",
                      "optimize_acqf_torch_mixed",
                  }'''),
              dedent('''\
                      "torch_mixed",
                      "optimize_acqf_torch_mixed",
                      "thompson_sampling_mixed",
                  }'''),
              "mixed fixed-feature detection",
          )
          engine_path.write_text(engine, encoding="utf-8")

          factory_path = Path("src/bochan/api/factory.py")
          factory = factory_path.read_text(encoding="utf-8")
          factory = replace_once(
              factory,
              dedent('''\
                  if optimizer_name in {"torch_mixed", "optimize_acqf_torch_mixed"}:
                      from bochan.optim import optimize_acqf_torch_mixed

                      kwargs = _with_sequential(common_kwargs, config)
                      if config.fixed_features_list is not None:
                          kwargs["fixed_features_list"] = config.fixed_features_list
                      kwargs = _filter_kwargs_for_callable(optimize_acqf_torch_mixed, kwargs)
                      return optimize_acqf_torch_mixed(**kwargs)

                  raise ValueError(f"Unknown optimizer: {optimizer}")'''),
              dedent('''\
                  if optimizer_name in {"torch_mixed", "optimize_acqf_torch_mixed"}:
                      from bochan.optim import optimize_acqf_torch_mixed

                      kwargs = _with_sequential(common_kwargs, config)
                      if config.fixed_features_list is not None:
                          kwargs["fixed_features_list"] = config.fixed_features_list
                      kwargs = _filter_kwargs_for_callable(optimize_acqf_torch_mixed, kwargs)
                      return optimize_acqf_torch_mixed(**kwargs)

                  if optimizer_name in {"nsgaii", "optimize_acqf_nsgaii"}:
                      from bochan.optim import optimize_acqf_nsgaii

                      kwargs = _with_sequential(common_kwargs, config)
                      kwargs = _filter_kwargs_for_callable(optimize_acqf_nsgaii, kwargs)
                      return optimize_acqf_nsgaii(**kwargs)

                  if optimizer_name in {"thompson_sampling", "optimize_thompson_sampling"}:
                      from bochan.optim import optimize_thompson_sampling

                      kwargs = _with_sequential(common_kwargs, config)
                      kwargs = _filter_kwargs_for_callable(optimize_thompson_sampling, kwargs)
                      return optimize_thompson_sampling(**kwargs)

                  if optimizer_name in {"thompson_sampling_mixed", "optimize_thompson_sampling_mixed"}:
                      from bochan.optim import optimize_thompson_sampling_mixed

                      kwargs = _with_sequential(common_kwargs, config)
                      merged_fixed_features_list = _merge_fixed_features_list(
                          config.fixed_features,
                          config.fixed_features_list,
                      )
                      if merged_fixed_features_list is None:
                          raise ValueError(
                              "OptimizeConfig.fixed_features_list or OptimizeConfig.fixed_features "
                              "is required for mixed Thompson sampling."
                          )
                      kwargs.pop("fixed_features", None)
                      kwargs["fixed_features_list"] = merged_fixed_features_list
                      kwargs = _filter_kwargs_for_callable(optimize_thompson_sampling_mixed, kwargs)
                      return optimize_thompson_sampling_mixed(**kwargs)

                  raise ValueError(f"Unknown optimizer: {optimizer}")'''),
              "optimizer dispatch tail",
          )
          factory_path.write_text(factory, encoding="utf-8")

          Path("tests/test_api_optimizer_config.py").write_text(
              dedent('''\
              from __future__ import annotations

              import pytest

              from bochan.api.configs import OptimizeConfig
              from bochan.api.engine import _resolve_optimizer_from_cat_dims


              @pytest.mark.parametrize("method", ["ga", "pso", "sa", "cmaes"])
              def test_evolutionary_shorthand_is_normalized(method: str) -> None:
                  config = OptimizeConfig(optimizer=method)
                  assert config.optimizer == "evo"
                  assert config.evo_method == method
                  assert config.optimizer_kwargs["method"] == method


              def test_explicit_evo_method_is_forwarded() -> None:
                  config = OptimizeConfig(optimizer="evo", evo_method="pso")
                  assert config.optimizer == "evo"
                  assert config.optimizer_kwargs["method"] == "pso"


              def test_optimizer_kwargs_method_has_priority() -> None:
                  config = OptimizeConfig(
                      optimizer="evo",
                      evo_method="ga",
                      optimizer_kwargs={"method": "sa"},
                  )
                  assert config.optimizer_kwargs["method"] == "sa"


              @pytest.mark.parametrize(
                  ("legacy", "canonical"),
                  [
                      ("optimize_acqf_mixed", "optimize_acqf"),
                      ("optimize_acqf_evo_mixed", "evo"),
                      ("optimize_acqf_torch_mixed", "torch"),
                      ("optimize_acqf_nsgaii", "nsgaii"),
                      ("optimize_thompson_sampling_mixed", "thompson_sampling"),
                  ],
              )
              def test_legacy_optimizer_names_are_normalized(legacy: str, canonical: str) -> None:
                  config = OptimizeConfig(optimizer=legacy)
                  assert config.optimizer == canonical


              @pytest.mark.parametrize(
                  ("optimizer", "mixed_optimizer"),
                  [
                      ("optimize_acqf", "optimize_acqf_mixed"),
                      ("evo", "evo_mixed"),
                      ("torch", "torch_mixed"),
                      ("thompson_sampling", "thompson_sampling_mixed"),
                  ],
              )
              def test_mixed_backend_is_selected_from_cat_dims(
                  optimizer: str,
                  mixed_optimizer: str,
              ) -> None:
                  config = OptimizeConfig(optimizer=optimizer)
                  resolved = _resolve_optimizer_from_cat_dims(opt_config=config, cat_dims=[1])
                  assert resolved.optimizer == mixed_optimizer
                  assert config.optimizer == optimizer


              def test_unknown_optimizer_is_rejected() -> None:
                  with pytest.raises(ValueError, match="Unknown optimizer"):
                      OptimizeConfig(optimizer="unknown")
              '''),
              encoding="utf-8",
          )
          PY

          python -m compileall -q src/bochan/api tests/test_api_optimizer_config.py
          python -m pytest -q tests/test_api_optimizer_config.py

          rm .github/workflows/codex-optimize-config-refactor.yml
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add src/bochan/api/configs.py src/bochan/api/engine.py src/bochan/api/factory.py tests/test_api_optimizer_config.py .github/workflows/codex-optimize-config-refactor.yml
          git commit -m "Refactor optimizer configuration"
          git push origin HEAD:codex/refactor-optimizer-config
