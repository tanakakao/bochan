name: Composition cardinality smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/bochan/api/support/best_subset.py"
      - "src/bochan/tabular/composition/cardinality.py"
      - "src/bochan/tabular/composition/support.py"
      - "src/bochan/tabular/composition/logratio_support.py"
      - "src/bochan/tabular/composition/variable_total_support.py"
      - "src/bochan/serving/webapp/composition/support.py"
      - "web/src/components/CompositionBestSubsetSettings.tsx"
      - "web/src/context/workbenchValidation.ts"
      - "tests/test_composition_best_subset_cardinality.py"
      - "tests/test_webapp_composition_cardinality.py"
      - ".github/workflows/composition-cardinality-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python package
        run: python -m pip install -e ".[test,api,tabular]"
      - name: Test composition cardinality
        run: |
          pytest -q --maxfail=1 \
            tests/test_k_sparse_best_subset.py \
            tests/test_k_sparse_best_subset_beam.py \
            tests/test_k_sparse_best_subset_cardinality.py \
            tests/test_composition_best_subset.py \
            tests/test_composition_best_subset_cardinality.py \
            tests/test_composition_logratio_best_subset.py \
            tests/test_composition_variable_total_best_subset.py \
            tests/test_webapp_composition_cardinality.py
      - name: Lint cardinality changes
        run: |
          python -m pip install ruff
          ruff check --ignore SIM108 \
            src/bochan/tabular/composition/cardinality.py \
            src/bochan/tabular/composition/support.py \
            src/bochan/tabular/composition/variable_total_support.py \
            src/bochan/serving/webapp/composition/support.py \
            tests/test_composition_best_subset_cardinality.py \
            tests/test_webapp_composition_cardinality.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install React dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build React workbench
        working-directory: web
        run: pnpm build
