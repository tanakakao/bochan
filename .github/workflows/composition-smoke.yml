name: Composition API smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,tabular,api]"
      - name: Test composition APIs
        run: |
          pytest -q --maxfail=1 \
            tests/test_tabular_composition_sites.py \
            tests/test_tabular_composition_sites_public.py \
            tests/test_tabular_composition_element_columns.py \
            tests/test_tabular_composition_variable_totals.py
      - name: Lint composition APIs
        run: |
          python -m pip install ruff
          ruff check \
            --per-file-ignores "src/bochan/tabular/multi_site_composition_optimizer.py:I001" \
            --per-file-ignores "src/bochan/tabular/multi_site_composition_optimizer.py:UP037" \
            --per-file-ignores "src/bochan/tabular/element_column_composition_optimizer.py:I001" \
            --per-file-ignores "src/bochan/tabular/element_column_composition_optimizer.py:UP037" \
            src/bochan/tabular/__init__.py \
            src/bochan/tabular/multi_site_composition_optimizer.py \
            src/bochan/tabular/element_column_composition_optimizer.py \
            src/bochan/tabular/variable_total_composition_optimizer.py \
            tests/test_tabular_composition_sites.py \
            tests/test_tabular_composition_sites_public.py \
            tests/test_tabular_composition_element_columns.py \
            tests/test_tabular_composition_variable_totals.py
