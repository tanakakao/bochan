name: Composition API smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,tabular,api]"
      - name: Test composition APIs
        run: |
          pytest -q --maxfail=1 \
            tests/test_tabular_composition_sites.py \
            tests/test_tabular_composition_sites_public.py \
            tests/test_tabular_composition_element_columns.py \
            tests/test_tabular_composition_variable_totals.py \
            tests/test_tabular_composition_element_constraints.py \
            tests/test_tabular_composition_passthrough_bounds.py
      - name: Lint composition APIs
        run: |
          python -m pip install ruff
          ruff check \
            src/bochan/tabular/__init__.py \
            src/bochan/tabular/composition/__init__.py \
            src/bochan/tabular/composition/adapter.py \
            src/bochan/tabular/composition/bounds.py \
            src/bochan/tabular/composition/columns.py \
            src/bochan/tabular/composition/constraints/__init__.py \
            src/bochan/tabular/composition/constraints/projector.py \
            src/bochan/tabular/composition/constraints/reranker.py \
            src/bochan/tabular/composition/constraints/resolver.py \
            src/bochan/tabular/composition/totals.py \
            src/bochan/tabular/composition/variable_total.py \
            tests/test_tabular_composition_sites.py \
            tests/test_tabular_composition_sites_public.py \
            tests/test_tabular_composition_element_columns.py \
            tests/test_tabular_composition_variable_totals.py \
            tests/test_tabular_composition_element_constraints.py \
            tests/test_tabular_composition_passthrough_bounds.py
