name: Composition API smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -e ".[test,tabular,api,materials]"
          python -m pip install "alignn==2026.8.11"
      - name: Test composition APIs
        run: |
          pytest -q --maxfail=1 \
            tests/test_alignn_gp.py \
            tests/test_alignn_mixed_gp.py \
            tests/test_alignn_mixed_dkl.py \
            tests/test_alignn_pure_integration.py \
            tests/test_alignn_phase6_scaling.py \
            tests/test_alignn_phase6_cache_pickle.py \
            tests/test_structure_alignn.py \
            tests/test_tabular_alignn_models.py \
            tests/test_tabular_alignn_mixed.py \
            tests/test_tabular_alignn_multioutput.py \
            tests/test_tabular_alignn_array_multioutput.py \
            tests/test_tabular_alignn_multitask.py \
            tests/test_fastapi_alignn_tabular.py \
            tests/test_fastapi_alignn_mixed.py \
            tests/test_fastapi_alignn_multioutput.py \
            tests/test_fastapi_alignn_multitask.py \
            tests/test_fastapi_alignn_artifacts.py \
            tests/test_fastapi_alignn_multioutput_artifacts.py \
            tests/test_common_model_artifact_api.py \
            tests/test_crabnet_encoder.py \
            tests/test_crabnet_gp.py \
            tests/test_crabnet_integration_closure.py \
            tests/test_material_encoder_fusion.py \
            tests/test_material_gp_feature_extractor.py \
            tests/test_tabular_composition.py \
            tests/test_tabular_architecture.py \
            tests/test_tabular_composition_sites.py \
            tests/test_tabular_composition_sites_public.py \
            tests/test_tabular_composition_element_columns.py \
            tests/test_tabular_composition_variable_totals.py \
            tests/test_tabular_composition_element_constraints.py \
            tests/test_tabular_composition_passthrough_bounds.py \
            tests/test_tabular_crabnet_models.py
      - name: Lint composition APIs
        run: |
          python -m pip install ruff
          ruff check \
            src/bochan/composition/__init__.py \
            src/bochan/composition/encoders/__init__.py \
            src/bochan/composition/encoders/alignn.py \
            src/bochan/composition/encoders/base.py \
            src/bochan/composition/encoders/crabnet.py \
            src/bochan/composition/encoders/fusion.py \
            src/bochan/composition/simplex.py \
            src/bochan/composition/transformer.py \
            src/bochan/structure/__init__.py \
            src/bochan/structure/adapter.py \
            src/bochan/structure/alignn.py \
            src/bochan/models/regression/gaussian/deep/__init__.py \
            src/bochan/models/regression/gaussian/deep/alignn.py \
            src/bochan/models/regression/gaussian/deep/alignn_mixed.py \
            src/bochan/models/regression/gaussian/deep/alignn_multitask.py \
            src/bochan/models/regression/gaussian/deep/crabnet.py \
            src/bochan/models/regression/gaussian/deep/material.py \
            src/bochan/api/modeling/fit.py \
            src/bochan/api/registry/model.py \
            src/bochan/tabular/__init__.py \
            src/bochan/tabular/composition/__init__.py \
            src/bochan/tabular/composition/adapter.py \
            src/bochan/tabular/composition/bounds.py \
            src/bochan/tabular/composition/columns.py \
            src/bochan/tabular/composition/constraints/__init__.py \
            src/bochan/tabular/composition/constraints/reranker.py \
            src/bochan/tabular/composition/constraints/resolver.py \
            src/bochan/tabular/composition/totals.py \
            src/bochan/tabular/composition/transformer.py \
            src/bochan/tabular/composition/variable_total.py \
            src/bochan/tabular/structure/__init__.py \
            src/bochan/tabular/structure/adapter.py \
            src/bochan/tabular/structure/candidates.py \
            src/bochan/tabular/structure/scaling.py \
            src/bochan/tabular/structure/fitting.py \
            src/bochan/tabular/structure/multioutput.py \
            src/bochan/tabular/structure/observation.py \
            src/bochan/tabular/optimizer/configuration.py \
            src/bochan/tabular/optimizer/fitting.py \
            src/bochan/serving/fastapi/schemas/alignn_tabular.py \
            src/bochan/serving/fastapi/services/alignn_tabular.py \
            src/bochan/serving/fastapi/services/tabular_artifacts.py \
            src/bochan/serving/fastapi/routers/alignn_tabular.py \
            src/bochan/serving/fastapi/routers/tabular_artifacts.py \
            src/bochan/serving/fastapi/routers/__init__.py \
            examples/alignn_fastapi_client.py \
            examples/alignn_artifact_client.py \
            tests/test_alignn_gp.py \
            tests/test_alignn_mixed_gp.py \
            tests/test_alignn_mixed_dkl.py \
            tests/test_alignn_pure_integration.py \
            tests/test_alignn_phase6_scaling.py \
            tests/test_alignn_phase6_cache_pickle.py \
            tests/test_structure_alignn.py \
            tests/test_tabular_alignn_models.py \
            tests/test_tabular_alignn_mixed.py \
            tests/test_tabular_alignn_multioutput.py \
            tests/test_tabular_alignn_array_multioutput.py \
            tests/test_tabular_alignn_multitask.py \
            tests/test_fastapi_alignn_tabular.py \
            tests/test_fastapi_alignn_mixed.py \
            tests/test_fastapi_alignn_multioutput.py \
            tests/test_fastapi_alignn_multitask.py \
            tests/test_fastapi_alignn_artifacts.py \
            tests/test_fastapi_alignn_multioutput_artifacts.py \
            tests/test_common_model_artifact_api.py \
            tests/test_material_encoder_fusion.py \
            tests/test_material_gp_feature_extractor.py \
            tests/test_crabnet_encoder.py \
            tests/test_crabnet_gp.py \
            tests/test_crabnet_integration_closure.py \
            tests/test_tabular_architecture.py \
            tests/test_tabular_composition.py \
            tests/test_tabular_composition_sites.py \
            tests/test_tabular_composition_sites_public.py \
            tests/test_tabular_composition_element_columns.py \
            tests/test_tabular_composition_variable_totals.py \
            tests/test_tabular_composition_element_constraints.py \
            tests/test_tabular_composition_passthrough_bounds.py \
            tests/test_tabular_crabnet_models.py
