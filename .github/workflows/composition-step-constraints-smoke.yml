name: Composition step constraints smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/bochan/api/support/best_subset.py"
      - "src/bochan/tabular/composition/grid.py"
      - "src/bochan/tabular/composition/support.py"
      - "src/bochan/tabular/composition/logratio_support.py"
      - "src/bochan/tabular/composition/variable_total_support.py"
      - "tests/test_best_subset_infeasible_supports.py"
      - "tests/test_composition_best_subset.py"
      - "tests/test_composition_best_subset_steps.py"
      - "tests/test_composition_step_linear_constraints.py"
      - ".github/workflows/composition-step-constraints-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python package
        run: python -m pip install -e ".[test,api,tabular]"
      - name: Test stepped composition constraints
        run: |
          pytest -q --maxfail=1 \
            tests/test_k_sparse_best_subset.py \
            tests/test_k_sparse_best_subset_beam.py \
            tests/test_k_sparse_best_subset_cardinality.py \
            tests/test_best_subset_infeasible_supports.py \
            tests/test_composition_best_subset.py \
            tests/test_composition_best_subset_steps.py \
            tests/test_composition_logratio_best_subset.py \
            tests/test_composition_variable_total_best_subset.py \
            tests/test_composition_step_linear_constraints.py
      - name: Lint stepped composition constraints
        run: |
          python -m pip install ruff
          ruff check --ignore SIM108 \
            src/bochan/api/support/best_subset.py \
            src/bochan/tabular/composition/grid.py \
            src/bochan/tabular/composition/support.py \
            src/bochan/tabular/composition/variable_total_support.py \
            tests/test_best_subset_infeasible_supports.py \
            tests/test_composition_best_subset.py \
            tests/test_composition_best_subset_steps.py \
            tests/test_composition_step_linear_constraints.py
