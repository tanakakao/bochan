name: Debug binary test collection

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/binary-likelihood-consistency
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,tabular,evo]'

      - name: Collect binary tests
        run: |
          set +e
          pytest --collect-only -q tests/test_binary*.py > binary-collection.log 2>&1
          echo $? > binary-collection-status.txt
          cat binary-collection.log
          exit 0

      - name: Upload collection diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: binary-collection-diagnostics
          path: |
            binary-collection.log
            binary-collection-status.txt
