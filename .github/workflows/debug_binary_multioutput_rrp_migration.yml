name: Debug binary multi-output and RRP migration

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/binary-multioutput-rrp-compatibility

      - name: Run migration and capture failure
        continue-on-error: true
        run: |
          python .github/scripts/apply_binary_multioutput_rrp_compatibility.py > migration.log 2>&1

      - name: Show migration log
        if: always()
        run: cat migration.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binary-model-compat-migration-log
          path: migration.log
