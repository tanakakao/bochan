name: Debug non-slow binary tests

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/binary-likelihood-consistency
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply review fixes
        run: python .github/scripts/apply_binary_review_fixes.py
      - name: Install
        run: python -m pip install -e '.[test,tabular,evo]'
      - name: Run and capture
        run: |
          set +e
          pytest -q -m 'not slow' tests/test_binary*.py > binary-non-slow.log 2>&1
          echo $? > binary-non-slow-status.txt
          cat binary-non-slow.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: binary-non-slow-diagnostics
          path: |
            binary-non-slow.log
            binary-non-slow-status.txt
