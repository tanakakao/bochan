name: Deep Ensemble classification ordinal smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/bochan/models/classification/common/**"
      - "src/bochan/models/classification/binary/neural/**"
      - "src/bochan/models/classification/multiclass/neural/**"
      - "src/bochan/models/ordinal/neural/**"
      - "src/bochan/models/ordinal/posterior.py"
      - "src/bochan/api/registry/model.py"
      - "tests/test_deep_ensemble_classification_ordinal.py"
      - "tests/test_ordinal_bald_ensemble.py"
      - "tests/test_model_package_layout.py"
      - ".github/workflows/deep-ensemble-classification-ordinal-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run focused tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_deep_ensemble_classification_ordinal.py \
            tests/test_ordinal_bald_ensemble.py \
            tests/test_model_package_layout.py
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check --ignore I001 \
            src/bochan/models/classification/common \
            src/bochan/models/classification/binary/neural \
            src/bochan/models/classification/multiclass/neural \
            src/bochan/models/ordinal/neural \
            src/bochan/models/ordinal/posterior.py \
            tests/test_deep_ensemble_classification_ordinal.py \
            tests/test_ordinal_bald_ensemble.py \
            tests/test_model_package_layout.py
