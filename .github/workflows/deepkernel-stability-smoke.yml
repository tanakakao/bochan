name: Deep Kernel stability smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/bochan/fit/deep/common.py"
      - "src/bochan/fit/deep/deepkernel.py"
      - "src/bochan/likelihoods/regression.py"
      - "src/bochan/models/components/layers/kernel_layers.py"
      - "src/bochan/models/regression/gaussian/deep/deepkernel.py"
      - "tests/test_deepkernel_stability.py"
      - "tests/test_tabular_noise_alpha.py"
      - ".github/workflows/deepkernel-stability-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run Deep Kernel stability tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_deepkernel_stability.py \
            tests/test_tabular_noise_alpha.py
      - name: Run lint
        run: |
          python -m pip install ruff
          ruff check --ignore I001 \
            src/bochan/fit/deep/common.py \
            src/bochan/fit/deep/deepkernel.py \
            src/bochan/likelihoods/regression.py \
            src/bochan/models/components/layers/kernel_layers.py \
            tests/test_deepkernel_stability.py \
            tests/test_tabular_noise_alpha.py
