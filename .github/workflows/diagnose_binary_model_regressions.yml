name: Diagnose binary model regressions

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/binary-multioutput-rrp-compatibility

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply scoped source changes
        run: |
          python .github/scripts/isolate_binary_dense_delta_migration.py hide
          python .github/scripts/apply_binary_multioutput_rrp_compatibility.py
          python .github/scripts/isolate_binary_dense_delta_migration.py restore

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,tabular,evo]'

      - name: Run multi-output tests
        continue-on-error: true
        run: |
          pytest -q tests/test_binary_classification_base_multi_output.py -k 'not slow' > multioutput.log 2>&1

      - name: Run RRP tests
        continue-on-error: true
        run: |
          pytest -q tests/test_binary_classification_rrp_single_output.py -k 'basic_behavior' > rrp.log 2>&1

      - name: Show logs
        if: always()
        run: |
          echo '=== MULTI-OUTPUT ==='
          cat multioutput.log
          echo '=== RRP ==='
          cat rrp.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binary-model-regression-logs
          path: |
            multioutput.log
            rrp.log
