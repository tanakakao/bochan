name: Experiment observation smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,tabular,api,visualization]"
      - name: Core observation state
        run: |
          pytest -q --maxfail=1 \
            tests/test_observation_data.py \
            tests/test_observation_tell_state.py
      - name: Partial objective models
        run: |
          pytest -q --maxfail=1 \
            tests/test_partial_observation_api.py \
            tests/test_wide_mixed_multitask.py
      - name: Success-aware acquisition
        run: pytest -q --maxfail=1 tests/test_experiment_success_acquisition.py
      - name: Tabular observation state
        run: pytest -q --maxfail=1 tests/test_tabular_observation_states.py
      - name: FastAPI observation state
        run: pytest -q --maxfail=1 tests/test_fastapi_tabular_observation_states.py
      - name: Web observation state
        run: |
          pytest -q --maxfail=1 \
            tests/test_webapp_target_missing_policy.py \
            tests/test_webapp_tabular_backend.py
      - name: Run lint
        run: |
          python -m pip install ruff
          ruff check \
            src/bochan/api/registry/model.py \
            src/bochan/api/observation/__init__.py \
            src/bochan/api/observation/state.py \
            src/bochan/api/observation/service.py \
            src/bochan/api/observation/failure.py \
            src/bochan/acquisition/feasible/experiment_success.py \
            src/bochan/acquisition/feasible/__init__.py \
            src/bochan/models/hybrid/partial_observation.py \
            src/bochan/models/multitask/mixed.py \
            src/bochan/tabular/config/__init__.py \
            src/bochan/tabular/config/data.py \
            src/bochan/tabular/observation/__init__.py \
            src/bochan/tabular/observation/data.py \
            src/bochan/tabular/observation/adapter.py \
            src/bochan/tabular/__init__.py \
            src/bochan/serving/fastapi/schemas/tabular.py \
            src/bochan/serving/fastapi/routers/tabular.py \
            src/bochan/serving/webapp/targets/missing.py \
            src/bochan/serving/webapp/settings/targets.py \
            src/bochan/serving/webapp/tabular_backend.py \
            src/bochan/serving/webapp/workflows/__init__.py \
            src/bochan/serving/webapp/workflows/tabular.py \
            tests/test_observation_data.py \
            tests/test_observation_tell_state.py \
            tests/test_partial_observation_api.py \
            tests/test_wide_mixed_multitask.py \
            tests/test_experiment_success_acquisition.py \
            tests/test_tabular_observation_states.py \
            tests/test_fastapi_tabular_observation_states.py \
            tests/test_webapp_target_missing_policy.py \
            tests/test_webapp_tabular_backend.py
