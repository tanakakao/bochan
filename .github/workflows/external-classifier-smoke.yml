name: External classifier smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/bochan/models/external/**"
      - "src/bochan/models/regression/external/**"
      - "src/bochan/models/classification/common/**"
      - "src/bochan/models/classification/binary/external/**"
      - "src/bochan/models/classification/multiclass/external/**"
      - "src/bochan/models/classification/common/posterior.py"
      - "src/bochan/fit/classification/binary.py"
      - "src/bochan/fit/classification/multiclass.py"
      - "src/bochan/api/registry/model.py"
      - "tests/test_external_regression_models.py"
      - "tests/test_external_binary_classification_models.py"
      - "tests/test_external_multiclass_classification_models.py"
      - "tests/test_external_classifier_optional_smoke.py"
      - "tests/test_model_package_layout.py"
      - ".github/workflows/external-classifier-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,api,ngboost,tabular]"
      - name: Run external model tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_external_regression_models.py \
            tests/test_external_binary_classification_models.py \
            tests/test_external_multiclass_classification_models.py \
            tests/test_external_classifier_optional_smoke.py \
            tests/test_model_package_layout.py
      - name: Lint external model modules
        run: |
          python -m pip install ruff
          ruff check --ignore I001 \
            src/bochan/models/external \
            src/bochan/models/regression/external \
            src/bochan/models/classification/common \
            src/bochan/models/classification/binary/external \
            src/bochan/models/classification/multiclass/external \
            src/bochan/models/classification/common/posterior.py \
            tests/test_external_regression_models.py \
            tests/test_external_binary_classification_models.py \
            tests/test_external_multiclass_classification_models.py \
            tests/test_external_classifier_optional_smoke.py \
            tests/test_model_package_layout.py
