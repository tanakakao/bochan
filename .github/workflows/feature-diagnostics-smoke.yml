name: Feature diagnostics smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/bochan/inspection/diagnostics.py"
      - "src/bochan/serving/webapp/feature_importance_outputs.py"
      - "src/bochan/serving/webapp/tabular_backend.py"
      - "src/bochan/serving/webapp/workflows.py"
      - "tests/test_feature_importance.py"
      - "tests/test_hybrid_model_diagnostics.py"
      - "tests/test_saas_diagnostics.py"
      - "tests/test_web_feature_importance_output_names.py"
      - "tests/test_webapp_final_model_diagnostics.py"
      - ".github/workflows/feature-diagnostics-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,web]"
      - name: Run feature diagnostic tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_feature_importance.py \
            tests/test_hybrid_model_diagnostics.py \
            tests/test_saas_diagnostics.py \
            tests/test_web_feature_importance_output_names.py \
            tests/test_webapp_final_model_diagnostics.py
      - name: Run lint
        run: |
          python -m pip install ruff
          ruff check --ignore I001,SIM102,SIM108 \
            src/bochan/inspection/diagnostics.py \
            src/bochan/serving/webapp/feature_importance_outputs.py \
            src/bochan/serving/webapp/tabular_backend.py \
            src/bochan/serving/webapp/workflows.py \
            tests/test_hybrid_model_diagnostics.py \
            tests/test_saas_diagnostics.py \
            tests/test_web_feature_importance_output_names.py \
            tests/test_webapp_final_model_diagnostics.py
