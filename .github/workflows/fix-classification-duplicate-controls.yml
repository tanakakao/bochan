name: Fix classification duplicate controls

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: classification-duplicate-controls-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-and-test:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fix-classification-duplicate-controls' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone, patch, validate, and publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git clone --branch "${HEAD_REF}" --single-branch "https://github.com/${HEAD_REPO}.git" repo
          cd repo

          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[test]" ruff
          python3 scripts/run_fix_classification_duplicate_controls.py

          python3 -m ruff format \
            src/bochan/acquisition/_duplicate_exclusion.py \
            src/bochan/acquisition/binary/base.py \
            src/bochan/acquisition/binary/active_learning/single_output.py \
            src/bochan/acquisition/binary/active_learning/multi_output.py \
            src/bochan/acquisition/binary/bayesian_optimization/multi_output.py \
            src/bochan/acquisition/ordinal/active_learning/single_output.py \
            src/bochan/acquisition/ordinal/active_learning/multi_output.py \
            src/bochan/acquisition/ordinal/active_learning/hetero_single_output.py \
            src/bochan/acquisition/ordinal/active_learning/hetero_multi_output.py \
            src/bochan/acquisition/multiclass/bayesian_optimization/single_output.py \
            src/bochan/acquisition/multiclass/active_learning/multi_output.py \
            tests/test_classification_duplicate_controls_e2e.py

          set +e
          {
            python3 -m ruff check \
              src/bochan/acquisition/_duplicate_exclusion.py \
              src/bochan/acquisition/binary/base.py \
              src/bochan/acquisition/binary/active_learning/single_output.py \
              src/bochan/acquisition/binary/active_learning/multi_output.py \
              src/bochan/acquisition/binary/bayesian_optimization/multi_output.py \
              src/bochan/acquisition/ordinal/active_learning/single_output.py \
              src/bochan/acquisition/ordinal/active_learning/multi_output.py \
              src/bochan/acquisition/ordinal/active_learning/hetero_single_output.py \
              src/bochan/acquisition/ordinal/active_learning/hetero_multi_output.py \
              src/bochan/acquisition/multiclass/bayesian_optimization/single_output.py \
              src/bochan/acquisition/multiclass/active_learning/multi_output.py \
              tests/test_classification_duplicate_exclusion.py \
              tests/test_classification_duplicate_controls_e2e.py
            python3 -m pytest -q \
              tests/test_classification_duplicate_exclusion.py \
              tests/test_classification_duplicate_controls_e2e.py
          } 2>&1 | tee /tmp/classification-duplicate-validation.log
          validation_status=${PIPESTATUS[0]}
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${validation_status}" -eq 0 ]; then
            git rm -f --ignore-unmatch classification_duplicate_validation_failure.log
            git add \
              src/bochan/acquisition/_duplicate_exclusion.py \
              src/bochan/acquisition/binary/base.py \
              src/bochan/acquisition/binary/active_learning/single_output.py \
              src/bochan/acquisition/binary/active_learning/multi_output.py \
              src/bochan/acquisition/binary/bayesian_optimization/multi_output.py \
              src/bochan/acquisition/ordinal/active_learning/single_output.py \
              src/bochan/acquisition/ordinal/active_learning/multi_output.py \
              src/bochan/acquisition/ordinal/active_learning/hetero_single_output.py \
              src/bochan/acquisition/ordinal/active_learning/hetero_multi_output.py \
              src/bochan/acquisition/multiclass/bayesian_optimization/single_output.py \
              src/bochan/acquisition/multiclass/active_learning/multi_output.py \
              tests/test_classification_duplicate_controls_e2e.py
            if ! git diff --cached --quiet; then
              git commit -m "Unify classification duplicate controls"
              git push origin "HEAD:${HEAD_REF}"
            fi
            exit 0
          fi

          cp /tmp/classification-duplicate-validation.log classification_duplicate_validation_failure.log
          git add classification_duplicate_validation_failure.log
          git commit -m "Record duplicate control validation failure" || true
          git push origin "HEAD:${HEAD_REF}"
          exit 1
