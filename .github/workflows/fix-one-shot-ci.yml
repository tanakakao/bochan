name: Fix one-shot CI

on:
  push:
    branches:
      - codex/composition-one-shot-best-subset

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/composition-one-shot-best-subset
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in (
              "src/bochan/tabular/composition/logratio_support.py",
              "src/bochan/tabular/composition/multi_raw_support.py",
              "src/bochan/tabular/composition/variable_total_support.py",
          ):
              p = Path(path)
              text = p.read_text()
              old = '''    if is_one_shot_acquisition(base_acqf):\n        final_value = raw_value\n    else:\n        final_value = base_acqf(model_candidates)\n'''
              new = '''    final_value = (\n        raw_value\n        if is_one_shot_acquisition(base_acqf)\n        else base_acqf(model_candidates)\n    )\n'''
              if old not in text:
                  raise SystemExit(f"final value block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          p = Path("tests/test_k_sparse_best_subset_one_shot.py")
          text = p.read_text()
          old = 'with pytest.raises(ValueError, match="mixed fixed_features_list"):'
          new = 'with pytest.raises(ValueError, match="fixed_features_list"):'
          if old not in text:
              raise SystemExit("mixed fixed_features_list assertion not found")
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Install test tools
        run: |
          python -m pip install -e ".[test,tabular]"
          python -m pip install ruff
      - name: Test fixes
        run: |
          pytest -q --maxfail=1 \
            tests/test_k_sparse_best_subset_one_shot.py \
            tests/test_composition_one_shot_best_subset.py \
            tests/test_k_sparse_best_subset.py \
            tests/test_k_sparse_best_subset_groups.py \
            tests/test_composition_logratio_best_subset.py \
            tests/test_composition_variable_total_best_subset.py \
            tests/test_composition_multi_raw_best_subset.py
      - name: Lint fixes
        run: |
          ruff check \
            src/bochan/api/support/one_shot.py \
            src/bochan/api/support/best_subset.py \
            src/bochan/api/support/multi_group_best_subset.py \
            src/bochan/tabular/composition/logratio_support.py \
            src/bochan/tabular/composition/variable_total_support.py \
            src/bochan/tabular/composition/multi_raw_support.py \
            tests/test_k_sparse_best_subset_one_shot.py \
            tests/test_composition_one_shot_best_subset.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bochan/tabular/composition/logratio_support.py \
            src/bochan/tabular/composition/multi_raw_support.py \
            src/bochan/tabular/composition/variable_total_support.py \
            tests/test_k_sparse_best_subset_one_shot.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix one-shot Best Subset CI failures"
          git push origin HEAD:codex/composition-one-shot-best-subset
