name: Fix Phase 1 stale material tests

on:
  push:
    branches:
      - feat/material-train-yvar-phase1

permissions:
  contents: write

jobs:
  patch-tests:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/material-train-yvar-phase1
          fetch-depth: 0
      - name: Update stale tests
        run: python .github/scripts/fix_phase1_stale_tests.py
      - name: Commit test updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_crabnet_gp.py tests/test_roost_gp.py
          if ! git diff --cached --quiet; then
            git commit -m "test: update material fixed-noise expectations"
            git push origin HEAD:feat/material-train-yvar-phase1
          fi
