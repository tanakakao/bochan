name: Fix single-output hybrid acquisition routing

on:
  push:
    branches:
      - agent/fix-single-output-hybrid-acquisition-routing

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-single-output-hybrid-acquisition-routing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply source patch
        run: python scripts/apply_single_output_hybrid_acquisition_routing.py
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff
      - name: Ruff
        run: |
          python -m ruff format --check src/bochan/api/engine.py tests/test_single_output_hybrid_acquisition_routing.py
          python -m ruff check src/bochan/api/engine.py tests/test_single_output_hybrid_acquisition_routing.py
      - name: Focused routing tests
        run: python -m pytest -q tests/test_single_output_hybrid_acquisition_routing.py
      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet -- src/bochan/api/engine.py; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bochan/api/engine.py
          git commit -m "Fix single-output hybrid acquisition routing"
          git push
