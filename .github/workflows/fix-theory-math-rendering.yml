name: Fix theory math rendering

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  fix-math:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Convert math delimiters for GitHub Markdown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          theory_dir = Path('docs/theory')
          changed = []

          for path in sorted(theory_dir.glob('*.md')):
              original = path.read_text(encoding='utf-8')
              lines = original.splitlines(keepends=True)
              converted = []
              in_fence = False

              for line in lines:
                  stripped = line.strip()
                  if stripped.startswith('```'):
                      in_fence = not in_fence
                      converted.append(line)
                      continue

                  if not in_fence and stripped in {r'\[', r'\]'}:
                      newline = '\n' if line.endswith('\n') else ''
                      converted.append('$$' + newline)
                  else:
                      converted.append(line)

              updated = ''.join(converted)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Converted display-math delimiters in {len(changed)} files:')
          for path in changed:
              print(f'  - {path}')
          PY

      - name: Remove one-shot workflow
        run: git rm .github/workflows/fix-theory-math-rendering.yml

      - name: Commit converted documentation
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/theory .github/workflows/fix-theory-math-rendering.yml
          git commit -m 'docs: use GitHub-compatible display math delimiters'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
