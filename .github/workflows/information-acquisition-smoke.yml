name: Information acquisition smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,api]"
      - name: Run KG MES JES HVKG tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_knowledge_gradient_defaults.py \
            tests/test_information_acquisition_defaults.py \
            tests/test_information_acquisition_precedence.py
      - name: Lint information acquisition modules
        run: |
          python -m pip install ruff
          ruff check \
            --per-file-ignores "src/bochan/api/acquisition_registry.py:UP035" \
            src/bochan/api/acquisition_registry.py \
            src/bochan/api/engine_defaults.py \
            src/bochan/api/information_acquisition_defaults.py \
            tests/test_knowledge_gradient_defaults.py \
            tests/test_information_acquisition_defaults.py \
            tests/test_information_acquisition_precedence.py
