name: LLM smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/bochan/llm/**"
      - "src/bochan/api/acquisition_config.py"
      - "src/bochan/api/llm_selected_acquisition.py"
      - "src/bochan/api/llm_suggestion.py"
      - "src/bochan/api/model_registry.py"
      - "tests/test_llm_client_tls.py"
      - "tests/test_llm_candidate_optimizer.py"
      - "tests/test_llm_selected_acquisition_config.py"
      - "README_LLM.md"
      - "docs/llm_selected_acquisition.md"
      - ".github/workflows/llm-client-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -e ".[test]"
          python -m pip install ruff
      - name: Run focused tests
        run: |
          set -o pipefail
          pytest -q --maxfail=1 \
            tests/test_llm_client_tls.py \
            tests/test_llm_candidate_optimizer.py \
            tests/test_llm_selected_acquisition_config.py \
            2>&1 | tee pytest-llm-smoke.log
      - name: Run lint
        if: success()
        run: |
          set -o pipefail
          ruff check \
            src/bochan/api/acquisition_config.py \
            src/bochan/api/llm_selected_acquisition.py \
            src/bochan/api/llm_suggestion.py \
            src/bochan/api/model_registry.py \
            src/bochan/llm/__init__.py \
            src/bochan/llm/client.py \
            src/bochan/llm/configs.py \
            src/bochan/llm/planner.py \
            tests/test_llm_client_tls.py \
            tests/test_llm_candidate_optimizer.py \
            tests/test_llm_selected_acquisition_config.py \
            2>&1 | tee ruff-llm-smoke.log
      - name: Upload focused logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-smoke-logs
          path: |
            pytest-llm-smoke.log
            ruff-llm-smoke.log
          if-no-files-found: ignore
