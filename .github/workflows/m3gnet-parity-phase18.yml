name: M3GNet parity Phase 18 smoke

on:
  pull_request:
    paths:
      - "src/bochan/models/regression/gaussian/materials/structure/m3gnet_tensor_residual.py"
      - "src/bochan/models/regression/gaussian/materials/structure/m3gnet_relaxation.py"
      - "src/bochan/models/regression/gaussian/materials/structure/m3gnet_relax_rank.py"
      - "src/bochan/models/regression/gaussian/materials/structure/m3gnet_relax_acquisition.py"
      - "src/bochan/models/regression/gaussian/materials/structure/__init__.py"
      - "tests/models/materials/test_m3gnet_tensor_residual_phase18.py"
      - "tests/models/materials/test_m3gnet_relaxation_phase18.py"
      - ".github/workflows/m3gnet-parity-phase18.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,materials]"
          python -m pip install "matgl==4.0.3" ruff
      - name: Run M3GNet parity tests
        run: |
          python -m pytest \
            tests/models/materials/test_m3gnet_tensor_residual_phase18.py \
            tests/models/materials/test_m3gnet_relaxation_phase18.py \
            -q
      - name: Ruff
        run: |
          ruff check \
            src/bochan/models/regression/gaussian/materials/structure/m3gnet_tensor_residual.py \
            src/bochan/models/regression/gaussian/materials/structure/m3gnet_relaxation.py \
            src/bochan/models/regression/gaussian/materials/structure/m3gnet_relax_rank.py \
            src/bochan/models/regression/gaussian/materials/structure/m3gnet_relax_acquisition.py \
            src/bochan/models/regression/gaussian/materials/structure/__init__.py \
            tests/models/materials/test_m3gnet_tensor_residual_phase18.py \
            tests/models/materials/test_m3gnet_relaxation_phase18.py
