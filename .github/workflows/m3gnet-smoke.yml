name: M3GNet integration smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: m3gnet-matpes-pbe-2025-2-v1
      - name: Install
        run: |
          python -m pip install -e ".[test,tabular,api]"
          python -m pip install "matgl==4.0.3"
      - name: Test deterministic M3GNet integration matrix
        run: |
          pytest -q --maxfail=1 -k "not real_pretrained" \
            tests/test_m3gnet_encoder.py \
            tests/test_m3gnet_gp.py \
            tests/test_m3gnet_mixed.py \
            tests/test_m3gnet_multitask.py \
            tests/test_tabular_m3gnet_models.py \
            tests/test_tabular_m3gnet_multioutput.py \
            tests/test_tabular_m3gnet_multitask.py \
            tests/test_fastapi_m3gnet_tabular.py \
            tests/test_fastapi_m3gnet_artifacts.py \
            tests/test_m3gnet_phase6_integration.py \
            tests/test_m3gnet_phase7_integration.py \
            tests/test_observation_tell_state.py
      - name: Probe real pretrained M3GNet integration
        continue-on-error: true
        run: |
          pytest -q --maxfail=1 -k "real_pretrained" \
            tests/test_m3gnet_encoder.py \
            tests/test_m3gnet_gp.py \
            tests/test_m3gnet_phase6_integration.py
      - name: Lint M3GNet integration surface
        run: |
          python -m pip install ruff
          ruff check \
            src/bochan/composition/__init__.py \
            src/bochan/composition/encoders/__init__.py \
            src/bochan/composition/encoders/m3gnet.py \
            src/bochan/models/regression/gaussian/deep/__init__.py \
            src/bochan/models/regression/gaussian/deep/m3gnet.py \
            src/bochan/models/regression/gaussian/deep/m3gnet_multitask.py \
            src/bochan/models/regression/gaussian/deep/structure.py \
            src/bochan/api/acquisition/defaults/resolver.py \
            src/bochan/api/observation/state.py \
            src/bochan/api/optimizer/__init__.py \
            src/bochan/tabular/structure/candidates.py \
            src/bochan/tabular/structure/scaling.py \
            src/bochan/tabular/structure/m3gnet.py \
            src/bochan/tabular/structure/observation.py \
            src/bochan/serving/fastapi/schemas/m3gnet_tabular.py \
            src/bochan/serving/fastapi/services/m3gnet_tabular.py \
            src/bochan/serving/fastapi/services/tabular.py \
            src/bochan/serving/fastapi/services/tabular_artifacts.py \
            src/bochan/serving/fastapi/routers/m3gnet_tabular.py \
            src/bochan/serving/fastapi/routers/__init__.py \
            examples/m3gnet_fastapi_client.py \
            tests/test_m3gnet_encoder.py \
            tests/test_m3gnet_gp.py \
            tests/test_m3gnet_mixed.py \
            tests/test_m3gnet_multitask.py \
            tests/test_tabular_m3gnet_models.py \
            tests/test_tabular_m3gnet_multioutput.py \
            tests/test_tabular_m3gnet_multitask.py \
            tests/test_fastapi_m3gnet_tabular.py \
            tests/test_fastapi_m3gnet_artifacts.py \
            tests/test_m3gnet_phase6_integration.py \
            tests/test_m3gnet_phase7_integration.py \
            tests/test_observation_tell_state.py
