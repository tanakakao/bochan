name: MACE Phase 5 smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache MACE foundation models
        uses: actions/cache@v4
        with:
          path: ~/.cache/mace
          key: mace-mpa-0-medium-v1
      - name: Install
        run: |
          python -m pip install -e ".[test]"
          python -m pip install "mace-torch==0.3.16"
          python -m pip install pandas
      - name: Test MACE tabular routing and candidate contracts
        run: |
          pytest -q --maxfail=1 tests/test_tabular_mace_models.py
      - name: Recheck direct MACE model contracts
        run: |
          pytest -q --maxfail=1 -k "not real_pretrained" \
            tests/test_mace_gp.py \
            tests/test_mace_mixed.py \
            tests/test_mace_multitask.py
      - name: Lint MACE Phase 5 surface
        run: |
          python -m pip install ruff
          ruff check \
            src/bochan/api/acquisition/defaults/__init__.py \
            src/bochan/tabular/structure/candidates.py \
            src/bochan/tabular/structure/mace.py \
            src/bochan/tabular/structure/observation.py \
            tests/test_tabular_mace_models.py
