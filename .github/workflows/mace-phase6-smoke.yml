name: MACE Phase 6 smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/bochan/composition/encoders/mace.py"
      - "src/bochan/models/regression/gaussian/deep/mace*.py"
      - "src/bochan/models/regression/gaussian/deep/structure.py"
      - "src/bochan/tabular/structure/mace.py"
      - "src/bochan/serving/fastapi/**/*mace*"
      - "src/bochan/structure/adapter.py"
      - "tests/*mace*.py"
      - "tests/**/*mace*.py"
      - "examples/*mace*.py"
      - "examples/**/*mace*.py"
      - ".github/workflows/mace-phase6-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache MACE foundation models
        uses: actions/cache@v4
        with:
          path: ~/.cache/mace
          key: mace-mpa-0-medium-v1
      - name: Install
        run: |
          python -m pip install -e ".[test,tabular,api]"
          python -m pip install "mace-torch==0.3.16"
      - name: Test MACE FastAPI and artifact contracts
        run: |
          pytest -q --maxfail=1 \
            tests/test_fastapi_mace_tabular.py \
            tests/test_fastapi_mace_artifacts.py
      - name: Recheck MACE tabular routing
        run: |
          pytest -q --maxfail=1 tests/test_tabular_mace_models.py
      - name: Probe real pretrained MACE FastAPI path
        run: |
          pytest -q --maxfail=1 -k "real_pretrained" tests/test_mace_phase6_integration.py
      - name: Lint MACE Phase 6 surface
        run: |
          python -m pip install ruff
          ruff check \
            src/bochan/serving/fastapi/schemas/mace_tabular.py \
            src/bochan/serving/fastapi/services/mace_tabular.py \
            src/bochan/serving/fastapi/routers/mace_tabular.py \
            src/bochan/serving/fastapi/routers/__init__.py \
            examples/mace_fastapi_client.py \
            tests/test_fastapi_mace_tabular.py \
            tests/test_fastapi_mace_artifacts.py \
            tests/test_mace_phase6_integration.py
