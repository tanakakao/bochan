name: MACE Phase 7 smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache MACE foundation models
        uses: actions/cache@v4
        with:
          path: ~/.cache/mace
          key: mace-mpa-0-medium-v1
      - name: Install
        run: |
          python -m pip install -e ".[test,tabular,api]"
          python -m pip install "mace-torch==0.3.16"
      - name: Test MACE Phase 7 optimization matrix
        run: |
          pytest -q --maxfail=1 tests/test_mace_phase7_integration.py
      - name: Recheck MACE FastAPI and tabular integration
        run: |
          pytest -q --maxfail=1 \
            tests/test_tabular_mace_models.py \
            tests/test_fastapi_mace_tabular.py \
            tests/test_fastapi_mace_artifacts.py
      - name: Lint MACE Phase 7 surface
        run: |
          python -m pip install ruff
          ruff check \
            src/bochan/models/regression/gaussian/deep/mace.py \
            src/bochan/models/regression/gaussian/deep/mace_mixed.py \
            src/bochan/models/regression/gaussian/deep/mace_multitask.py \
            src/bochan/models/regression/gaussian/deep/structure.py \
            src/bochan/tabular/structure/candidates.py \
            src/bochan/tabular/structure/scaling.py \
            src/bochan/tabular/structure/mace.py \
            tests/test_mace_phase7_integration.py
