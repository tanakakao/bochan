name: MACE Phase 9 smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/bochan/composition/encoders/mace.py"
      - "src/bochan/models/regression/gaussian/deep/mace*.py"
      - "src/bochan/models/regression/gaussian/deep/structure.py"
      - "src/bochan/tabular/structure/mace.py"
      - "src/bochan/serving/fastapi/**/*mace*"
      - "src/bochan/structure/adapter.py"
      - "tests/*mace*.py"
      - "tests/**/*mace*.py"
      - "examples/*mace*.py"
      - "examples/**/*mace*.py"
      - ".github/workflows/mace-phase9-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache MACE foundation models
        uses: actions/cache@v4
        with:
          path: ~/.cache/mace
          key: mace-mpa-0-medium-v1
      - name: Install
        run: |
          python -m pip install -e ".[test,tabular,api]"
          python -m pip install "mace-torch==0.3.16"
      - name: Test MACE Phase 9 performance contract
        run: |
          pytest -q --maxfail=1 tests/test_mace_phase9_performance.py
      - name: Recheck optimization and artifact contracts
        run: |
          pytest -q --maxfail=1 \
            tests/test_mace_phase7_integration.py \
            tests/test_mace_phase8_log_acquisitions.py \
            tests/test_fastapi_mace_artifacts.py \
            tests/test_fastapi_mace_tabular.py
      - name: Lint MACE Phase 9 surface
        run: |
          python -m pip install ruff
          ruff check \
            src/bochan/composition/encoders/mace.py \
            src/bochan/models/regression/gaussian/deep/structure.py \
            src/bochan/serving/fastapi/services/mace_tabular.py \
            src/bochan/serving/fastapi/routers/mace_tabular.py \
            tests/test_mace_phase9_performance.py
