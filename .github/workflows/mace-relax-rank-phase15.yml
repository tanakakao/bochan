name: MACE relax rank Phase 15 smoke

on:
  pull_request:
    paths:
      - "src/bochan/models/regression/gaussian/materials/structure/mace_relax_rank.py"
      - "src/bochan/models/regression/gaussian/materials/structure/mace_relax_acquisition.py"
      - "src/bochan/models/regression/gaussian/materials/structure/__init__.py"
      - "tests/models/materials/test_mace_relax_rank_phase15.py"
      - "tests/models/materials/test_mace_relax_acquisition_phase15.py"
      - ".github/workflows/mace-relax-rank-phase15.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,mace]"
          python -m pip install ruff
      - name: Run relax, BO, and active-learning selection tests
        run: |
          python -m pytest \
            tests/models/materials/test_mace_relax_rank_phase15.py \
            tests/models/materials/test_mace_relax_acquisition_phase15.py \
            -q
      - name: Ruff
        run: |
          ruff check \
            src/bochan/models/regression/gaussian/materials/structure/mace_relax_rank.py \
            src/bochan/models/regression/gaussian/materials/structure/mace_relax_acquisition.py \
            src/bochan/models/regression/gaussian/materials/structure/__init__.py \
            tests/models/materials/test_mace_relax_rank_phase15.py \
            tests/models/materials/test_mace_relax_acquisition_phase15.py
