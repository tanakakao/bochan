name: MACE structure relaxation Phase 14 smoke

on:
  pull_request:
    paths:
      - "src/bochan/models/regression/gaussian/materials/common/relaxation.py"
      - "src/bochan/models/regression/gaussian/materials/common/__init__.py"
      - "src/bochan/models/regression/gaussian/materials/structure/mace_relaxation.py"
      - "src/bochan/models/regression/gaussian/materials/structure/__init__.py"
      - "src/bochan/structure/adapter.py"
      - "tests/models/materials/test_mace_structure_relaxation_phase14.py"
      - "tests/models/materials/test_mace_structure_relaxation_real_phase14.py"
      - ".github/workflows/mace-structure-relaxation-phase14-smoke.yml"

jobs:
  mace-structure-relaxation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MACE test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,mace]"
          python -m pip install ruff
      - name: Run lightweight relaxation contract tests
        run: |
          python -m pytest tests/models/materials/test_mace_structure_relaxation_phase14.py -q
      - name: Run real pretrained MACE relaxation smoke
        run: |
          python -m pytest tests/models/materials/test_mace_structure_relaxation_real_phase14.py -q
      - name: Ruff
        run: |
          ruff check \
            src/bochan/models/regression/gaussian/materials/common/relaxation.py \
            src/bochan/models/regression/gaussian/materials/common/__init__.py \
            src/bochan/models/regression/gaussian/materials/structure/mace_relaxation.py \
            src/bochan/models/regression/gaussian/materials/structure/__init__.py \
            tests/models/materials/test_mace_structure_relaxation_phase14.py \
            tests/models/materials/test_mace_structure_relaxation_real_phase14.py
