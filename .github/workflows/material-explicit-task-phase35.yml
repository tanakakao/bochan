name: Material explicit task Phase 35

on:
  pull_request:
    paths:
      - "src/bochan/models/regression/gaussian/materials/**"
      - "tests/test_material_explicit_task_phase35.py"
      - ".github/workflows/material-explicit-task-phase35.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff
      - name: Explicit task contract tests
        run: pytest -q tests/test_material_explicit_task_phase35.py
      - name: Ruff
        run: |
          ruff check \
            src/bochan/models/regression/gaussian/materials/common/explicit_task.py \
            src/bochan/models/regression/gaussian/materials/common/__init__.py \
            src/bochan/models/regression/gaussian/materials/__init__.py \
            tests/test_material_explicit_task_phase35.py
