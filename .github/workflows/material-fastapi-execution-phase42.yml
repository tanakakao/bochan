name: Material FastAPI execution Phase 42

on:
  pull_request:
    paths:
      - "src/bochan/serving/fastapi/routers/material_model_axes.py"
      - "src/bochan/serving/fastapi/services/material_models.py"
      - "src/bochan/serving/fastapi/services/candidates.py"
      - "src/bochan/serving/fastapi/schemas/material_model_axes.py"
      - "src/bochan/serving/fastapi/schemas/requests.py"
      - "tests/test_material_fastapi_execution_phase42.py"
      - ".github/workflows/material-fastapi-execution-phase42.yml"

jobs:
  phase42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,api]"
      - run: python -m pip install ruff
      - name: Test material FastAPI execution
        run: |
          pytest -q \
            tests/test_material_fastapi_execution_phase42.py \
            tests/test_material_fastapi_axes_phase41.py \
            tests/test_material_api_bo_phase40.py
      - name: Ruff
        run: |
          ruff check \
            src/bochan/serving/fastapi/routers/material_model_axes.py \
            src/bochan/serving/fastapi/services/material_models.py \
            src/bochan/serving/fastapi/services/candidates.py \
            src/bochan/serving/fastapi/schemas/material_model_axes.py \
            src/bochan/serving/fastapi/schemas/requests.py \
            tests/test_material_fastapi_execution_phase42.py
