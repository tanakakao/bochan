name: Material independent multi-output Phase 34

on:
  pull_request:
    paths:
      - "src/bochan/models/regression/gaussian/materials/**"
      - "tests/test_material_surrogate_factory.py"
      - "tests/test_material_independent_multioutput_phase34.py"
      - "tests/test_roost_surrogate_phase33.py"
      - ".github/workflows/material-independent-multioutput-phase34.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff
      - name: Run independent multi-output tests
        run: |
          pytest -q \
            tests/test_material_independent_multioutput_phase34.py \
            tests/test_material_surrogate_factory.py \
            tests/test_roost_surrogate_phase33.py
      - name: Ruff
        run: |
          ruff check \
            src/bochan/models/regression/gaussian/materials/surrogate_factory.py \
            tests/test_material_independent_multioutput_phase34.py \
            tests/test_material_surrogate_factory.py \
            tests/test_roost_surrogate_phase33.py
