name: Material mixed explicit task Phase 38

on:
  pull_request:
    paths:
      - "src/bochan/models/regression/gaussian/materials/explicit_task_factory.py"
      - "src/bochan/models/regression/gaussian/materials/__init__.py"
      - "tests/test_material_mixed_explicit_task_phase38.py"
      - "tests/test_material_explicit_task_factory_phase37.py"
      - ".github/workflows/material-mixed-explicit-task-phase38.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff
      - name: Test Phase 35-38 explicit-task contracts
        run: |
          pytest -q \
            tests/test_material_explicit_task_phase35.py \
            tests/test_material_explicit_task_model_phase36.py \
            tests/test_material_explicit_task_factory_phase37.py \
            tests/test_material_mixed_explicit_task_phase38.py
      - name: Ruff
        run: |
          ruff check \
            src/bochan/models/regression/gaussian/materials/explicit_task_factory.py \
            src/bochan/models/regression/gaussian/materials/__init__.py \
            tests/test_material_explicit_task_factory_phase37.py \
            tests/test_material_mixed_explicit_task_phase38.py
