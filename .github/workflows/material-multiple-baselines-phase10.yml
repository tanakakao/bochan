name: Material multiple baselines Phase 10 smoke

on:
  pull_request:
    paths:
      - "src/bochan/models/regression/gaussian/materials/common/**"
      - "tests/models/regression/gaussian/materials/test_multiple_baselines_phase10.py"
      - ".github/workflows/material-multiple-baselines-phase10.yml"

jobs:
  multiple-baseline-model-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install ruff
      - name: Run focused tests
        run: python -m pytest tests/models/regression/gaussian/materials/test_multiple_baselines_phase10.py -q
      - name: Ruff
        run: |
          ruff check \
            src/bochan/models/regression/gaussian/materials/common/multi_baseline.py \
            src/bochan/models/regression/gaussian/materials/common/__init__.py \
            tests/models/regression/gaussian/materials/test_multiple_baselines_phase10.py
