name: Material residual multi-output Phase 8 smoke

on:
  pull_request:
    paths:
      - "src/bochan/models/regression/gaussian/materials/common/residual.py"
      - "src/bochan/tabular/structure/material_residual.py"
      - "src/bochan/tabular/structure/candidates.py"
      - "src/bochan/serving/fastapi/schemas/material_residual.py"
      - "src/bochan/serving/fastapi/services/material_residual.py"
      - "src/bochan/serving/fastapi/routers/material_residual.py"
      - "tests/models/regression/gaussian/materials/test_independent_multioutput_residual_phase8.py"
      - "tests/serving/fastapi/test_material_residual_multioutput_phase8.py"
      - "docs/material_residual_multioutput_phase8.md"
      - ".github/workflows/material-residual-multioutput-phase8-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-residual-model-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install ruff
      - name: Run focused tests
        run: |
          python -m pytest \
            tests/models/regression/gaussian/materials/test_independent_multioutput_residual_phase8.py \
            tests/serving/fastapi/test_material_residual_multioutput_phase8.py \
            -q
      - name: Ruff
        run: |
          ruff check \
            src/bochan/models/regression/gaussian/materials/common/residual.py \
            src/bochan/tabular/structure/material_residual.py \
            src/bochan/tabular/structure/candidates.py \
            src/bochan/serving/fastapi/schemas/material_residual.py \
            src/bochan/serving/fastapi/services/material_residual.py \
            src/bochan/serving/fastapi/routers/material_residual.py \
            tests/models/regression/gaussian/materials/test_independent_multioutput_residual_phase8.py \
            tests/serving/fastapi/test_material_residual_multioutput_phase8.py
