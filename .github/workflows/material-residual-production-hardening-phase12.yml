name: Material residual production hardening Phase 12

on:
  pull_request:
    paths:
      - "src/bochan/models/regression/gaussian/materials/**"
      - "src/bochan/tabular/structure/*material*"
      - "src/bochan/serving/fastapi/**/*material*"
      - "tests/_material_residual_hardening_utils.py"
      - "tests/models/materials/test_residual_production_hardening.py"
      - "tests/serving/fastapi/test_material_residual_artifact_roundtrip_phase12.py"
      - "tests/serving/fastapi/test_material_residual_e2e_phase12.py"
      - ".github/workflows/material-residual-production-hardening-phase12.yml"
  workflow_dispatch:

jobs:
  production-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,tabular,api]"
          python -m pip install ruff
      - name: Run production hardening tests
        run: |
          python -m pytest \
            tests/models/materials/test_residual_production_hardening.py \
            tests/serving/fastapi/test_material_residual_artifact_roundtrip_phase12.py \
            tests/serving/fastapi/test_material_residual_e2e_phase12.py \
            -q
      - name: Ruff
        run: |
          ruff check \
            src/bochan/models/regression/gaussian/materials/common/hardening.py \
            src/bochan/models/regression/gaussian/materials/common/__init__.py \
            tests/_material_residual_hardening_utils.py \
            tests/models/materials/test_residual_production_hardening.py \
            tests/serving/fastapi/test_material_residual_artifact_roundtrip_phase12.py \
            tests/serving/fastapi/test_material_residual_e2e_phase12.py
