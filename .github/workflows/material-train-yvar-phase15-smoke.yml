name: Material train Yvar Phase 15 smoke

on:
  pull_request:
    paths:
      - "src/bochan/api/acquisition/diagnostics.py"
      - "tests/test_acquisition_observation_diagnostics.py"
      - "tests/test_material_train_yvar_phase15_e2e.py"
      - "docs/material_train_yvar_phase15.md"
      - ".github/workflows/material-train-yvar-phase15-smoke.yml"
  workflow_dispatch:

jobs:
  observation-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,api]"
          python -m pip install ruff
      - name: Run Phase 15 E2E
        run: python -m pytest tests/test_material_train_yvar_phase15_e2e.py -q
      - name: Run acquisition observation regressions
        run: |
          python -m pytest \
            tests/test_acquisition_observation_diagnostics.py \
            tests/test_acquisition_history_provenance.py \
            tests/test_fastapi_compare_acquisition_diagnostics.py \
            -q
      - name: Ruff
        run: |
          ruff check \
            src/bochan/api/acquisition/diagnostics.py \
            tests/test_acquisition_observation_diagnostics.py \
            tests/test_material_train_yvar_phase15_e2e.py
