name: Material train Yvar Phase 2 smoke

on:
  pull_request:
    paths:
      - "src/bochan/models/regression/gaussian/deep/**"
      - "tests/test_material_train_yvar_phase2.py"
      - "tests/test_mace_multitask.py"
      - "tests/test_chgnet_multitask.py"
      - "tests/test_m3gnet_multitask.py"
      - "tests/test_alignn_multitask.py"
      - "tests/test_crabnet_multitask.py"
      - "docs/material_train_yvar_phase2.md"
      - ".github/workflows/material-train-yvar-phase2-smoke.yml"
  workflow_dispatch:

jobs:
  correlated-fixed-noise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install material test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,materials]"
          python -m pip install ruff
      - name: Run Phase 2 fixed-noise tests
        run: python -m pytest tests/test_material_train_yvar_phase2.py -q
      - name: Run correlated material multitask regressions
        run: |
          python -m pytest \
            tests/test_mace_multitask.py \
            tests/test_chgnet_multitask.py \
            tests/test_m3gnet_multitask.py \
            tests/test_alignn_multitask.py \
            tests/test_crabnet_multitask.py \
            -q
      - name: Ruff
        run: |
          ruff check \
            src/bochan/models/regression/gaussian/deep/deepkernel_configurable.py \
            src/bochan/models/regression/gaussian/deep/multitask_fixed_noise.py \
            src/bochan/models/regression/gaussian/deep/mace_multitask.py \
            src/bochan/models/regression/gaussian/deep/chgnet_multitask.py \
            src/bochan/models/regression/gaussian/deep/m3gnet_multitask.py \
            src/bochan/models/regression/gaussian/deep/alignn_multitask.py \
            src/bochan/models/regression/gaussian/deep/crabnet_multitask.py \
            tests/test_material_train_yvar_phase2.py
