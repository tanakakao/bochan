name: Material train Yvar Phase 4 implementation helper

on:
  push:
    branches:
      - feat/material-train-yvar-phase4
    paths:
      - .github/workflows/material-train-yvar-phase4-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/material-train-yvar-phase4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Phase 4 patches
        run: |
          python .github/scripts/material_train_yvar_phase4_patch.py
          python .github/scripts/material_train_yvar_phase4_lint_patch.py
          python .github/scripts/material_train_yvar_phase4_test_patch.py
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Ruff
        run: |
          ruff check \
            src/bochan/api/observation/state.py \
            src/bochan/api/observation/service.py \
            src/bochan/api/optimizer/__init__.py \
            src/bochan/models/multitask/wide.py \
            src/bochan/tabular/observation/data.py \
            src/bochan/tabular/optimizer/fitting.py \
            tests/test_material_train_yvar_phase4.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,tabular,api]"
      - name: Focused Phase 4 tests
        run: python -m pytest tests/test_material_train_yvar_phase4.py -q
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bochan/api/observation/state.py \
            src/bochan/api/observation/service.py \
            src/bochan/api/optimizer/__init__.py \
            src/bochan/models/multitask/wide.py \
            src/bochan/tabular/observation/data.py \
            src/bochan/tabular/optimizer/fitting.py \
            tests/test_material_train_yvar_phase4.py \
            docs/material_train_yvar_phase4.md
          git commit -m "feat: combine known observation variance with experiment state"
          git push origin HEAD:feat/material-train-yvar-phase4
