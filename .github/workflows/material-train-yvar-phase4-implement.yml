name: Material train Yvar Phase 4 regression helper

on:
  push:
    branches:
      - feat/material-train-yvar-phase4
    paths:
      - .github/workflows/material-train-yvar-phase4-implement.yml

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/material-train-yvar-phase4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,tabular,api,visualization]"
      - name: Phase 3 and Phase 4 known-noise tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_material_train_yvar_phase3.py \
            tests/test_material_train_yvar_phase4.py
      - name: Core observation state
        run: |
          pytest -q --maxfail=1 \
            tests/test_observation_data.py \
            tests/test_observation_tell_state.py
      - name: Partial objective and multitask models
        run: |
          pytest -q --maxfail=1 \
            tests/test_partial_observation_api.py \
            tests/test_wide_mixed_multitask.py
      - name: Success-aware acquisition
        run: pytest -q --maxfail=1 tests/test_experiment_success_acquisition.py
      - name: Tabular observation state
        run: pytest -q --maxfail=1 tests/test_tabular_observation_states.py
      - name: FastAPI observation state
        run: pytest -q --maxfail=1 tests/test_fastapi_tabular_observation_states.py
      - name: Web observation state
        run: |
          pytest -q --maxfail=1 \
            tests/test_webapp_target_missing_policy.py \
            tests/test_webapp_tabular_backend.py
      - name: Ruff
        run: |
          python -m pip install ruff
          ruff check \
            src/bochan/api/observation/state.py \
            src/bochan/api/observation/service.py \
            src/bochan/api/optimizer/__init__.py \
            src/bochan/models/multitask/wide.py \
            src/bochan/tabular/observation/data.py \
            src/bochan/tabular/optimizer/fitting.py \
            tests/test_material_train_yvar_phase3.py \
            tests/test_material_train_yvar_phase4.py
