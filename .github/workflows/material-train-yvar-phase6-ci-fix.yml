name: Material train Yvar Phase 6 CI compatibility fix

on:
  push:
    branches:
      - feat/material-train-yvar-phase6
    paths:
      - .github/scripts/material_train_yvar_phase6_ci_fix.py
      - .github/workflows/material-train-yvar-phase6-ci-fix.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/material-train-yvar-phase6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply compatibility fix
        run: python .github/scripts/material_train_yvar_phase6_ci_fix.py
      - name: Install
        run: |
          python -m pip install -e ".[test,tabular,api]"
          python -m pip install "mace-torch==0.3.16" ruff
      - name: Recheck Phase 6 core
        run: pytest -q tests/test_material_train_yvar_phase6.py
      - name: Recheck failing public metadata contracts
        run: |
          pytest -q \
            tests/test_fastapi_mace_tabular.py::test_mace_multitask_fit_endpoint_reports_correlated_contract \
            tests/test_fastapi_alignn_multitask.py::test_alignn_multitask_fastapi_tell_save_load_predict_roundtrip
      - name: Ruff
        run: ruff check src/bochan/models/components/layers/kernel_layers.py
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bochan/models/components/layers/kernel_layers.py
          git diff --cached --quiet || git commit -m "Preserve public multitask kernel metadata"
          git push origin HEAD:feat/material-train-yvar-phase6
