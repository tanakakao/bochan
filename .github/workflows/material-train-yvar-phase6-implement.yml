name: Material train Yvar Phase 6 implementation

on:
  push:
    branches:
      - feat/material-train-yvar-phase6
    paths:
      - .github/scripts/material_train_yvar_phase6_patch.py
      - .github/scripts/material_train_yvar_phase6_fix1.py
      - .github/scripts/material_train_yvar_phase6_fix2.py
      - .github/workflows/material-train-yvar-phase6-implement.yml

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/material-train-yvar-phase6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply Phase 6 patch
        run: |
          python .github/scripts/material_train_yvar_phase6_patch.py
          python .github/scripts/material_train_yvar_phase6_fix1.py
          python .github/scripts/material_train_yvar_phase6_fix2.py
      - name: Install
        run: |
          python -m pip install -e ".[test,tabular,api]"
          python -m pip install ruff
      - name: Phase 6 focused tests
        run: pytest -q tests/test_material_train_yvar_phase6.py
      - name: Phase 2 correlated known-noise regression
        run: pytest -q tests/test_material_train_yvar_phase2.py
      - name: Phase 3 through Phase 5 regression
        run: |
          pytest -q \
            tests/test_material_train_yvar_phase3.py \
            tests/test_material_train_yvar_phase4.py \
            tests/test_material_train_yvar_phase5.py
      - name: Observation and API regression
        run: |
          pytest -q \
            tests/test_observation_data.py \
            tests/test_partial_observation_api.py \
            tests/test_api_automatic_defaults.py \
            tests/test_tabular_observation_states.py
      - name: Ruff
        run: |
          ruff check \
            src/bochan/models/components/layers/kernel_layers.py \
            src/bochan/models/regression/gaussian/deep/deepkernel.py \
            src/bochan/models/regression/gaussian/deep/deepkernel_configurable.py \
            src/bochan/models/regression/gaussian/deep/multitask_fixed_noise.py \
            src/bochan/api/observation/service.py \
            tests/test_material_train_yvar_phase6.py
      - name: Commit Phase 6 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bochan/models/components/layers/kernel_layers.py \
            src/bochan/models/regression/gaussian/deep/deepkernel.py \
            src/bochan/models/regression/gaussian/deep/deepkernel_configurable.py \
            src/bochan/models/regression/gaussian/deep/multitask_fixed_noise.py \
            src/bochan/api/observation/service.py \
            tests/test_material_train_yvar_phase6.py \
            docs/material_train_yvar_phase6.md
          git diff --cached --quiet || git commit -m "Support partial known noise in correlated material multitask GPs"
          git push origin HEAD:feat/material-train-yvar-phase6
