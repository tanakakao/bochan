name: Material train Yvar Phase 7 implementation

on:
  push:
    branches:
      - feat/material-train-yvar-phase7
    paths:
      - .github/scripts/material_train_yvar_phase7_patch.py
      - .github/workflows/material-train-yvar-phase7-implement.yml

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/material-train-yvar-phase7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply Phase 7 patch
        run: python .github/scripts/material_train_yvar_phase7_patch.py
      - name: Install
        run: |
          python -m pip install -e ".[test,tabular,api]"
          python -m pip install ruff
      - name: Phase 7 focused tests
        run: pytest -q tests/test_material_train_yvar_phase7.py
      - name: Phase 5 observation CV regression
        run: pytest -q tests/test_material_train_yvar_phase5.py
      - name: Observation and tabular regression
        run: |
          pytest -q \
            tests/test_observation_data.py \
            tests/test_partial_observation_api.py \
            tests/test_tabular_observation_states.py
      - name: Ruff
        run: |
          ruff check \
            src/bochan/api/evaluation/cross_validation.py \
            src/bochan/api/optimizer/__init__.py \
            src/bochan/tabular/optimizer/fitting.py \
            tests/test_material_train_yvar_phase7.py
      - name: Commit Phase 7 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bochan/api/evaluation/cross_validation.py \
            src/bochan/api/optimizer/__init__.py \
            src/bochan/tabular/optimizer/fitting.py \
            tests/test_material_train_yvar_phase7.py \
            docs/material_train_yvar_phase7.md
          git diff --cached --quiet || git commit -m "Cross-validate experiment failure models with observations"
          git push origin HEAD:feat/material-train-yvar-phase7
