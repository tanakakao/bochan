name: Material train Yvar Phase 8 implementation

on:
  push:
    branches:
      - feat/material-train-yvar-phase8

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,web]"
      - name: Apply Phase 8 patch
        run: python .github/scripts/material_train_yvar_phase8_patch.py
      - name: Run Phase 8 focused tests
        run: pytest -q --maxfail=1 tests/test_material_train_yvar_phase8.py
      - name: Run Phase 7 and Phase 5 regression
        run: |
          pytest -q --maxfail=1 \
            tests/test_material_train_yvar_phase7.py \
            tests/test_material_train_yvar_phase5.py
      - name: Run existing feature importance regression
        run: pytest -q --maxfail=1 tests/test_feature_importance.py
      - name: Run Ruff
        run: |
          python -m pip install ruff
          ruff check \
            src/bochan/api/evaluation/cross_validation.py \
            tests/test_material_train_yvar_phase8.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/material_train_yvar_phase8_patch.py
          git rm .github/workflows/material-train-yvar-phase8-implement.yml
          git add \
            src/bochan/api/evaluation/cross_validation.py \
            tests/test_material_train_yvar_phase8.py \
            docs/material_train_yvar_phase8.md
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "Support observation-aware cross-validated feature importance"
            git push
          fi
