name: MLIP capabilities Phase 24 smoke

on:
  pull_request:
    paths:
      - "src/bochan/models/regression/gaussian/materials/structure/capabilities.py"
      - "src/bochan/models/regression/gaussian/materials/structure/__init__.py"
      - "tests/models/materials/test_mlip_capabilities_phase24.py"
      - ".github/workflows/mlip-capabilities-phase24.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install ruff
      - name: Test Phase 24 capabilities
        run: python -m pytest tests/models/materials/test_mlip_capabilities_phase24.py -q
      - name: Ruff
        run: |
          ruff check src/bochan/models/regression/gaussian/materials/structure/capabilities.py \
            src/bochan/models/regression/gaussian/materials/structure/__init__.py \
            tests/models/materials/test_mlip_capabilities_phase24.py
