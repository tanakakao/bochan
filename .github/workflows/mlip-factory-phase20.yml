name: MLIP factory Phase 20 smoke

on:
  pull_request:
    paths:
      - "src/bochan/models/regression/gaussian/materials/structure/factory.py"
      - "src/bochan/models/regression/gaussian/materials/structure/__init__.py"
      - "tests/models/materials/test_mlip_factory_phase20.py"
      - ".github/workflows/mlip-factory-phase20.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install ruff
      - name: Run Phase 20 factory tests
        run: python -m pytest tests/models/materials/test_mlip_factory_phase20.py -q
      - name: Ruff
        run: |
          ruff check \
            src/bochan/models/regression/gaussian/materials/structure/factory.py \
            tests/models/materials/test_mlip_factory_phase20.py
