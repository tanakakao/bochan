name: MLIP property factory Phase 21 smoke

on:
  pull_request:
    paths:
      - "src/bochan/models/regression/gaussian/materials/structure/property_factory.py"
      - "src/bochan/models/regression/gaussian/materials/structure/__init__.py"
      - "tests/models/materials/test_mlip_property_factory_phase21.py"
      - ".github/workflows/mlip-property-factory-phase21.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install ruff
      - name: Run Phase 21 tests
        run: |
          python -m pytest tests/models/materials/test_mlip_property_factory_phase21.py -q
      - name: Ruff
        run: |
          ruff check \
            src/bochan/models/regression/gaussian/materials/structure/property_factory.py \
            src/bochan/models/regression/gaussian/materials/structure/__init__.py \
            tests/models/materials/test_mlip_property_factory_phase21.py
