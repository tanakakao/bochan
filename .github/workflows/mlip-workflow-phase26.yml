name: MLIP workflow Phase 26 smoke

on:
  pull_request:
    paths:
      - "src/bochan/serving/fastapi/routers/material_workflow.py"
      - "src/bochan/serving/fastapi/routers/__init__.py"
      - "src/bochan/serving/fastapi/schemas/material_workflow.py"
      - "src/bochan/serving/fastapi/schemas/__init__.py"
      - "tests/serving/fastapi/test_material_workflow_phase26.py"
      - ".github/workflows/mlip-workflow-phase26.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,api]"
          python -m pip install ruff
      - name: Run Phase 26 tests
        run: python -m pytest tests/serving/fastapi/test_material_workflow_phase26.py -q
      - name: Ruff
        run: |
          ruff check \
            src/bochan/serving/fastapi/routers/material_workflow.py \
            src/bochan/serving/fastapi/routers/__init__.py \
            src/bochan/serving/fastapi/schemas/material_workflow.py \
            src/bochan/serving/fastapi/schemas/__init__.py \
            tests/serving/fastapi/test_material_workflow_phase26.py
