name: Model component layout refactor PR trigger

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Execute canonical refactor script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          legacy = Path("src/bochan/posteriors/bernoulli.py")
          canonical = Path(
              "src/bochan/models/classification/binary/base/posterior.py"
          )
          if legacy.exists():
              workflow = Path(
                  ".github/workflows/model-component-layout-refactor.yml"
              ).read_text(encoding="utf-8")
              start_marker = "          python - <<'PY'\n"
              end_marker = "\n          PY\n      - name: Install test dependencies"
              start = workflow.index(start_marker) + len(start_marker)
              end = workflow.index(end_marker, start)
              raw = workflow[start:end]
              code = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in raw.splitlines()
              )
              exec(compile(code, "model_component_layout_refactor", "exec"))
          elif canonical.exists():
              print("Canonical model component layout already applied; validation only.")
          else:
              raise RuntimeError("Unexpected model component layout state.")
          PY
      - name: Install test dependencies
        run: |
          python -m pip install -e ".[test,api]"
          python -m pip install ruff
      - name: Normalize changed Python imports
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR -- '*.py')
          if [ ${#files[@]} -gt 0 ]; then
            ruff check --fix --select I "${files[@]}"
          fi
      - name: Validate model component layout
        shell: bash
        run: |
          pytest -q --maxfail=1 \
            tests/test_model_package_layout.py \
            tests/test_ordinal_bald_ensemble.py \
            tests/test_ordinal_probability_utility_api.py \
            tests/test_binary_uncertainty_display_integration.py \
            tests/test_external_binary_classification_models.py \
            tests/test_external_multiclass_classification_models.py \
            tests/test_external_ordinal_models.py \
            tests/test_lightgbm_models.py
          python -m compileall -q src/bochan/models
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR -- '*.py')
          if [ ${#files[@]} -gt 0 ]; then
            ruff check --select F "${files[@]}"
          fi
          git diff --check
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No refactor changes to commit."
            exit 0
          fi
          git commit -m "Reorganize model kernels and posteriors"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
