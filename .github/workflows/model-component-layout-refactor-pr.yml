name: Model component layout refactor PR trigger

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Execute canonical refactor script
        run: python .github/scripts/model_component_layout_refactor.py
      - name: Install test dependencies
        run: |
          python -m pip install -e ".[test,api]"
          python -m pip install ruff
      - name: Normalize changed Python imports
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR -- '*.py')
          files+=(
            src/bochan/models/classification/binary/base/kernel.py
            src/bochan/models/classification/binary/base/posterior.py
            src/bochan/models/classification/common/posterior.py
            src/bochan/models/classification/multiclass/base/posterior.py
            src/bochan/models/ordinal/base/kernel.py
            src/bochan/models/ordinal/base/models.py
            src/bochan/models/ordinal/posterior.py
            tests/test_model_package_layout.py
          )
          mapfile -t files < <(printf '%s\n' "${files[@]}" | awk 'NF && !seen[$0]++' | while read -r path; do [ -f "$path" ] && echo "$path"; done)
          if [ ${#files[@]} -gt 0 ]; then
            ruff check --fix --select I "${files[@]}"
          fi
      - name: Validate model component layout
        shell: bash
        run: |
          pytest -q --maxfail=1 \
            tests/test_model_package_layout.py \
            tests/test_ordinal_bald_ensemble.py \
            tests/test_ordinal_probability_utility_api.py \
            tests/test_binary_uncertainty_display_integration.py \
            tests/test_external_binary_classification_models.py \
            tests/test_external_multiclass_classification_models.py \
            tests/test_external_ordinal_models.py \
            tests/test_lightgbm_models.py
          python -m compileall -q src/bochan/models
          ruff check --select F \
            src/bochan/models/classification/binary/base/kernel.py \
            src/bochan/models/classification/binary/base/posterior.py \
            src/bochan/models/classification/common/posterior.py \
            src/bochan/models/classification/multiclass/base/posterior.py \
            src/bochan/models/ordinal/base/kernel.py \
            src/bochan/models/ordinal/base/models.py \
            src/bochan/models/ordinal/posterior.py \
            tests/test_model_package_layout.py
          git diff --check
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No refactor changes to commit."
            exit 0
          fi
          git commit -m "Reorganize model kernels and posteriors"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
