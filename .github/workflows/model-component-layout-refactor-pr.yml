name: Model component layout refactor PR trigger

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Execute canonical refactor script
        shell: bash
        run: |
          python .github/scripts/model_component_layout_refactor.py
          python - <<'PY'
          from pathlib import Path

          ordinal_path = Path("src/bochan/models/ordinal/base/models.py")
          source = ordinal_path.read_text(encoding="utf-8")
          unindented = "\nif covar_module is None:\n"
          canonical = "\n        if covar_module is None:\n"
          start = source.find(unindented)
          if start >= 0:
              start += 1
              end_token = "        latent_model = _OrdinalLatentGP("
              end = source.find(end_token, start)
              if end < 0:
                  raise RuntimeError(
                      "Ordinal latent model marker not found after Matern block."
                  )
              block = source[start:end]
              fixed = "".join(
                  f"        {line}" if line.strip() else line
                  for line in block.splitlines(keepends=True)
              )
              ordinal_path.write_text(
                  source[:start] + fixed + source[end:],
                  encoding="utf-8",
              )
          elif canonical not in source:
              raise RuntimeError("Ordinal Matern block is in an unexpected state.")

          multiclass_init = Path(
              "src/bochan/models/classification/multiclass/base/__init__.py"
          )
          source = multiclass_init.read_text(encoding="utf-8")
          old = "from . import posteriors as _posterior_sampler_registration"
          new = "from . import posterior as _posterior_sampler_registration"
          if old in source:
              source = source.replace(old, new, 1)
              multiclass_init.write_text(source, encoding="utf-8")
          elif new not in source:
              raise RuntimeError(
                  "Multiclass posterior sampler registration import is unexpected."
              )
          PY
      - name: Install test dependencies
        run: |
          python -m pip install -e ".[test,api,visualization]"
          python -m pip install ruff lightgbm
      - name: Normalize changed Python imports
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR -- '*.py')
          files+=(
            src/bochan/models/classification/binary/base/kernel.py
            src/bochan/models/classification/binary/base/posterior.py
            src/bochan/models/classification/common/posterior.py
            src/bochan/models/classification/multiclass/base/__init__.py
            src/bochan/models/classification/multiclass/base/posterior.py
            src/bochan/models/ordinal/base/kernel.py
            src/bochan/models/ordinal/base/models.py
            src/bochan/models/ordinal/posterior.py
            tests/test_model_package_layout.py
          )
          mapfile -t files < <(printf '%s\n' "${files[@]}" | awk 'NF && !seen[$0]++' | while read -r path; do [ -f "$path" ] && echo "$path"; done)
          if [ ${#files[@]} -gt 0 ]; then
            ruff check --fix --select I "${files[@]}"
          fi
      - name: Validate model component layout
        shell: bash
        run: |
          pytest -q --maxfail=1 \
            tests/test_model_package_layout.py \
            tests/test_ordinal_bald_ensemble.py \
            tests/test_ordinal_probability_utility_api.py \
            tests/test_binary_uncertainty_display_integration.py \
            tests/test_external_binary_classification_models.py \
            tests/test_external_multiclass_classification_models.py \
            tests/test_external_ordinal_models.py \
            tests/test_lightgbm_models.py
          python -m compileall -q src/bochan/models
          ruff check --select F \
            src/bochan/models/classification/binary/base/kernel.py \
            src/bochan/models/classification/binary/base/posterior.py \
            src/bochan/models/classification/common/posterior.py \
            src/bochan/models/classification/multiclass/base/__init__.py \
            src/bochan/models/classification/multiclass/base/posterior.py \
            src/bochan/models/ordinal/base/kernel.py \
            src/bochan/models/ordinal/base/models.py \
            src/bochan/models/ordinal/posterior.py \
            tests/test_model_package_layout.py
          git diff --check
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No refactor changes to commit."
            exit 0
          fi
          git commit -m "Reorganize model kernels and posteriors"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
