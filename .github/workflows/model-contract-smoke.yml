name: Model contract smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot repository for structural refactor
        run: |
          git rev-parse HEAD > snapshot-commit.txt
          git rev-parse HEAD^{tree} > snapshot-tree.txt
          git archive --format=tar.gz -o bochan-snapshot.tgz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: model-layout-source-snapshot
          path: |
            bochan-snapshot.tgz
            snapshot-commit.txt
            snapshot-tree.txt
          retention-days: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,api]"
      - name: Run model contract tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_model_contract_refactor.py \
            tests/test_model_contract_followup.py \
            tests/test_mixed_kronecker_model_registry.py \
            tests/test_ordinal_deep_num_classes_inference.py \
            tests/test_ordinal_robust_num_classes.py \
            tests/test_projected_exact_mll_beta.py \
            tests/models/hybrid/test_multi_output_cat_dims.py
      - name: Compile model package
        run: python -m compileall -q src/bochan/models
