name: Model contract smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply model package reorganization
        shell: bash
        run: |
          set -euo pipefail

          cat .github/model-layout.patch.part-* > /tmp/model-layout.patch.gz.b64
          echo "09bd70a750c22bf2b861264a23d4d87e461e164ec2a6074e333a316c000db48b  /tmp/model-layout.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/model-layout.patch.gz.b64 | gzip -dc > /tmp/model-layout.patch
          echo "c73a84bfa72f4b0551b948bcd52c47cdfc36cf0af936360eddacf0ac628227e7  /tmp/model-layout.patch" | sha256sum -c -

          git apply --check -p2 /tmp/model-layout.patch
          git apply -p2 /tmp/model-layout.patch

          git ls-files | grep -E '(^|/)__pycache__/|\.pyc$|^src/bochan\.egg-info/' > /tmp/generated-files.txt || true
          if [ -s /tmp/generated-files.txt ]; then
            xargs -d '\n' git rm -f < /tmp/generated-files.txt
          fi

          rm -f .github/model-layout.patch.part-*

          cat > .github/workflows/model-contract-smoke.yml <<'YAML'
          name: Model contract smoke

          on:
            pull_request:
              branches:
                - main
            workflow_dispatch:

          jobs:
            test:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"
                    cache: pip
                - name: Install
                  run: python -m pip install -e ".[test,api]"
                - name: Run model contract tests
                  run: |
                    pytest -q --maxfail=1 \
                      tests/test_model_contract_refactor.py \
                      tests/test_model_contract_followup.py \
                      tests/test_model_package_layout.py \
                      tests/test_mixed_kronecker_model_registry.py \
                      tests/test_ordinal_deep_num_classes_inference.py \
                      tests/test_ordinal_robust_num_classes.py \
                      tests/test_projected_exact_mll_beta.py \
                      tests/models/hybrid/test_multi_output_cat_dims.py
                - name: Compile model package
                  run: python -m compileall -q src/bochan/models
          YAML

          python -m compileall -q src/bochan tests
          git diff --check
      - name: Install
        run: python -m pip install -e ".[test,api]"
      - name: Run model contract tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_model_contract_refactor.py \
            tests/test_model_contract_followup.py \
            tests/test_model_package_layout.py \
            tests/test_mixed_kronecker_model_registry.py \
            tests/test_ordinal_deep_num_classes_inference.py \
            tests/test_ordinal_robust_num_classes.py \
            tests/test_projected_exact_mll_beta.py \
            tests/models/hybrid/test_multi_output_cat_dims.py
      - name: Commit structural refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reorganize model package layout"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
