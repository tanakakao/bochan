name: Model contract smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Verify staged structural patch
        shell: bash
        run: |
          set -euo pipefail
          wc -c .github/model-layout.patch.part-*
          sha256sum .github/model-layout.patch.part-*
          cat .github/model-layout.patch.part-* > /tmp/model-layout.patch.gz.b64
          wc -c /tmp/model-layout.patch.gz.b64
          sha256sum /tmp/model-layout.patch.gz.b64
          echo "09bd70a750c22bf2b861264a23d4d87e461e164ec2a6074e333a316c000db48b  /tmp/model-layout.patch.gz.b64" | sha256sum -c -
