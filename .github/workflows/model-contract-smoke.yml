name: Model contract smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply PR 549 sampling hotfix
        run: python .github/pr549_hotfix.py
      - name: Install
        run: python -m pip install -e ".[test,api]"
      - name: Run focused regression tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_non_gaussian_acquisition_stats.py \
            tests/test_non_gaussian_posterior_base_samples.py \
            tests/test_model_package_layout.py
      - name: Run focused lint
        run: |
          python -m pip install ruff
          ruff check \
            tests/test_ordinal_nehvi_repeated_backward.py \
            tests/test_non_gaussian_posterior_base_samples.py
      - name: Compile model package
        run: python -m compileall -q src/bochan/models
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bochan/models/regression/beta/_components.py \
            src/bochan/models/regression/gamma/_components.py \
            src/bochan/models/regression/count/poisson/_components.py \
            src/bochan/models/regression/count/negative_binomial/_components.py \
            tests/test_ordinal_nehvi_repeated_backward.py \
            tests/test_non_gaussian_posterior_base_samples.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Hotfix already applied."
            exit 0
          fi
          git commit -m "Fix non-Gaussian posterior base sampling"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
