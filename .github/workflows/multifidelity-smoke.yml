name: Multi-Fidelity smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "src/bochan/models/multifidelity/**"
      - "src/bochan/models/regression/gaussian/*multifidelity*"
      - "src/bochan/api/acquisition/multifidelity.py"
      - "src/bochan/api/optimizer/dispatch.py"
      - "src/bochan/serving/fastapi/**"
      - "tests/**/test_*multifidelity*.py"
      - ".github/workflows/multifidelity-smoke.yml"
  workflow_dispatch:

jobs:
  multifidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,api]"
      - name: Run multi-fidelity tests
        shell: bash
        run: |
          mapfile -t tests < <(find tests -type f -name 'test_*multifidelity*.py' | sort)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No multi-fidelity tests found" >&2
            exit 1
          fi
          pytest -q --maxfail=1 "${tests[@]}"
      - name: Lint multi-fidelity files
        run: |
          python -m pip install ruff
          ruff check \
            src/bochan/models/multifidelity \
            src/bochan/api/acquisition/multifidelity.py \
            tests/api/test_multifidelity_hardening.py
