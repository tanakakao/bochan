name: Non-Gaussian acquisition smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,api]"
      - name: Run focused acquisition tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_non_gaussian_acquisition_stats.py \
            tests/test_non_gaussian_acquisition_alignment.py \
            tests/test_gamma_fantasize.py \
            tests/test_poisson_heteroscedastic_init.py \
            tests/test_negative_binomial_heteroscedastic_init.py \
            tests/test_api_candidate_uniqueness.py \
            tests/test_regression_active_learning_duplicate_exclusion.py
      - name: Lint changed modules
        run: |
          python -m pip install ruff
          ruff check \
            --per-file-ignores "src/bochan/api/registry/acquisition.py:UP035" \
            --per-file-ignores "src/bochan/models/regression/count/poisson/robust/heteroscedastic.py:UP035" \
            --per-file-ignores "src/bochan/models/regression/count/poisson/robust/heteroscedastic.py:UP045" \
            --per-file-ignores "src/bochan/models/regression/count/negative_binomial/robust/heteroscedastic.py:I001" \
            --per-file-ignores "src/bochan/models/regression/count/negative_binomial/robust/heteroscedastic.py:UP035" \
            --per-file-ignores "src/bochan/models/regression/count/negative_binomial/robust/heteroscedastic.py:UP045" \
            src/bochan/acquisition/non_gaussian/active_learning/single_output.py \
            src/bochan/acquisition/non_gaussian/active_learning/multi_output.py \
            src/bochan/acquisition/non_gaussian/active_learning/hetero_single_output.py \
            src/bochan/acquisition/non_gaussian/active_learning/hetero_multi_output.py \
            src/bochan/acquisition/regression/active_learning/_base.py \
            src/bochan/acquisition/regression/active_learning/_base_common.py \
            src/bochan/acquisition/regression/active_learning/_base_objective.py \
            src/bochan/acquisition/regression/active_learning/_base_reference.py \
            src/bochan/acquisition/regression/active_learning/_base_scoring.py \
            src/bochan/acquisition/regression/active_learning/_integrated.py \
            src/bochan/acquisition/regression/active_learning/_pointwise.py \
            src/bochan/acquisition/regression/active_learning/single_output.py \
            src/bochan/api/candidate_uniqueness.py \
            src/bochan/api/optimizer_api.py \
            src/bochan/api/configs/optimize.py \
            src/bochan/api/optimizer_dispatch.py \
            src/bochan/api/optimizer_support.py \
            src/bochan/models/regression/count/poisson/robust/heteroscedastic.py \
            src/bochan/models/regression/count/negative_binomial/robust/heteroscedastic.py \
            src/bochan/api/registry/acquisition.py \
            tests/test_non_gaussian_acquisition_alignment.py \
            tests/test_poisson_heteroscedastic_init.py \
            tests/test_negative_binomial_heteroscedastic_init.py \
            tests/test_api_candidate_uniqueness.py \
            tests/test_regression_active_learning_duplicate_exclusion.py
