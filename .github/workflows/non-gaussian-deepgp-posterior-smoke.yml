name: Beta DeepGP posterior smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run Beta DeepGP posterior contract tests
        run: pytest -q --maxfail=1 tests/test_beta_deepgp_posterior_contract.py
      - name: Lint changed modules
        run: |
          python -m pip install ruff
          ruff check \
            src/bochan/models/regression/non_gaussian/beta/deep/beta_deepgp.py \
            tests/test_beta_deepgp_posterior_contract.py
