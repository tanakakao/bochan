name: Normalize classification theory doc

on:
  push:
    branches:
      - agent/model-component-layout

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/model-component-layout
          fetch-depth: 0
      - name: Restore main doc and apply only canonical path updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path("docs/theory/en/11_classification_models.md")
          base = subprocess.check_output(
              ["git", "show", "origin/main:docs/theory/en/11_classification_models.md"],
              text=True,
          )
          old = "src/bochan/posteriors/bernoulli.py"
          new = "src/bochan/models/classification/binary/base/posterior.py"
          count = base.count(old)
          if count != 2:
              raise RuntimeError(f"Expected two Bernoulli posterior path references, found {count}")
          normalized = base.replace(old, new)
          path.write_text(normalized, encoding="utf-8")
          PY
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No normalization needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/theory/en/11_classification_models.md
          git commit -m "Normalize classification theory doc"
          git push origin HEAD:agent/model-component-layout
