name: Normalize regression line endings

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Clone pull request branch
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git clone --branch "${{ github.head_ref }}" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo

      - name: Restore repository LF line endings
        shell: pwsh
        working-directory: repo
        run: |
          @'
          from pathlib import Path

          paths = [
              "src/bochan/api/candidate_uniqueness.py",
              "src/bochan/api/optimizer_config.py",
              "src/bochan/serving/webapp/app.py",
              "src/bochan/serving/webapp/target_results.py",
              "src/bochan/serving/webapp/workflows_tabular.py",
              "web/src/api.ts",
              "web/src/context/WorkbenchContext.tsx",
              "web/src/modelArtifactRestore.ts",
              "web/src/pages/OptimizePage.tsx",
              "web/src/pages/ResultsPage.tsx",
              "web/src/types.ts",
          ]
          for value in paths:
              path = Path(value)
              text = path.read_bytes().decode("utf-8").replace("\r\n", "\n").replace("\r", "\n")
              path.write_bytes(text.encode("utf-8"))
          '@ | py -3.12 -

      - name: Commit normalized files
        shell: pwsh
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bochan/api/candidate_uniqueness.py
          git add src/bochan/api/optimizer_config.py
          git add src/bochan/serving/webapp/app.py
          git add src/bochan/serving/webapp/target_results.py
          git add src/bochan/serving/webapp/workflows_tabular.py
          git add web/src/api.ts
          git add web/src/context/WorkbenchContext.tsx
          git add web/src/modelArtifactRestore.ts
          git add web/src/pages/OptimizePage.tsx
          git add web/src/pages/ResultsPage.tsx
          git add web/src/types.ts
          if (git diff --cached --quiet) {
            Write-Host "Line endings already match."
          } else {
            git commit -m "Restore repository line endings"
            git push origin "HEAD:${{ github.head_ref }}"
          }
