name: Ordinal KG smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "src/bochan/acquisition/ordinal/bayesian_optimization/**"
      - "tests/test_ordinal_knowledge_gradient.py"
      - ".github/workflows/ordinal-kg-smoke.yml"
  workflow_dispatch:

jobs:
  ordinal-kg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,api]"
      - name: Run ordinal KG tests
        run: pytest -q --maxfail=1 tests/test_ordinal_knowledge_gradient.py
      - name: Lint ordinal KG
        run: |
          python -m pip install ruff
          ruff check \
            src/bochan/acquisition/ordinal/bayesian_optimization/knowledge_gradient.py \
            tests/test_ordinal_knowledge_gradient.py
