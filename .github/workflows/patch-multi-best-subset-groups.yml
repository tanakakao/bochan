name: Patch multi Best Subset groups

on:
  push:
    branches:
      - codex/composition-multi-best-subset-groups

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Wire multiple composition Best Subset groups'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/composition-multi-best-subset-groups
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply grouped Best Subset wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected patch anchor not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/bochan/api/optimizer/dispatch.py",
              'from ..support.best_subset import optimize_best_subset_candidates, uses_best_subset\n',
              'from ..support.best_subset import optimize_best_subset_candidates, uses_best_subset\n'
              'from ..support.multi_group_best_subset import (\n'
              '    optimize_grouped_best_subset_candidates,\n'
              '    uses_grouped_best_subset,\n'
              ')\n',
          )
          replace_once(
              "src/bochan/api/optimizer/dispatch.py",
              '    if uses_best_subset(config):\n'
              '        return optimize_best_subset_candidates(\n',
              '    if uses_grouped_best_subset(config):\n'
              '        return optimize_grouped_best_subset_candidates(\n'
              '            acqf=acqf,\n'
              '            bounds=bounds,\n'
              '            config=config,\n'
              '            optimize_one=lambda *, acqf, bounds, config: optimize_candidates(\n'
              '                acqf=acqf,\n'
              '                bounds=bounds,\n'
              '                config=config,\n'
              '                base_optimize_candidates=base_optimize_candidates,\n'
              '            ),\n'
              '        )\n\n'
              '    if uses_best_subset(config):\n'
              '        return optimize_best_subset_candidates(\n',
          )

          replace_once(
              "src/bochan/tabular/composition/support.py",
              '    if len(selected_sites) > 1:\n'
              '        raise ValueError(\n'
              '            "Composition best_subset currently supports one composition site per "\n'
              '            "candidate optimization because CandidateRepairConfig has one sparse group."\n'
              '        )\n',
              '    if len(selected_sites) > 1:\n'
              '        from .multi_support import resolve_multiple_composition_best_subset\n\n'
              '        return resolve_multiple_composition_best_subset(\n'
              '            opt_config,\n'
              '            selected_sites=selected_sites,\n'
              '            composition_sites=composition_sites,\n'
              '            composition_transformers=composition_transformers,\n'
              '            feature_names=feature_names,\n'
              '        )\n',
          )

          docs = Path("docs/composition_best_subset.md")
          text = docs.read_text()
          anchor = "## Variable-total compositions\n"
          section = '''## Multiple composition Best Subset groups\n\nMultiple fixed-total sites using `representation="fractions"` can participate in one candidate optimization. Each site's optional elements form an independent sparse group with its own `min_components` / `max_components` range. Required and forbidden elements remain site-local.\n\nFor Exact search, the total number of grouped supports is the Cartesian-product size:\n\n```text\nN_supports = product(N_supports_for_each_site)\n```\n\n`best_subset_max_combinations` is applied to this product, not to each site independently. Auto uses the same product when choosing Exact versus Beam. Grouped Beam seeds every allowed cardinality combination and changes one composition group at a time with swap/add/drop moves. One complete grouped support is shared by the whole joint q-batch.\n\nIndependent step grids are chained through the existing final-candidate MILP projectors. A linear constraint may still couple one stepped composition site to ordinary process variables. A constraint that directly couples **two stepped composition sites** is rejected because sequential projection would make feasibility depend on projector order.\n\nThis phase covers simultaneous fixed-total Fraction sites. CLR / ALR / ILR and variable-total Best Subset sites still use a single raw-decision bridge and therefore remain single-site until the grouped raw-bridge extension.\n\n'''
          if anchor not in text:
              raise SystemExit("Documentation insertion anchor not found")
          text = text.replace(anchor, section + anchor, 1)
          text = text.replace(
              '- one Best Subset composition site per candidate optimization;\n',
              '- multiple simultaneous fixed-total Fraction Best Subset composition sites in Python/tabular candidate optimization;\n'
              '- single-site raw-decision Best Subset bridges for CLR / ALR / ILR and variable-total compositions;\n',
              1,
          )
          old_future = 'Still explicit future extensions:\n\n- multiple simultaneous composition Best Subset groups;\n- one-shot acquisition functions that introduce augmented optimization variables.\n'
          new_future = 'Still explicit future extensions:\n\n- multiple simultaneous raw-decision Best Subset bridges (CLR / ALR / ILR and variable-total groups);\n- linear step-grid constraints that directly couple two stepped composition sites;\n- one-shot acquisition functions that introduce augmented optimization variables.\n'
          if old_future not in text:
              raise SystemExit("Documentation future-scope anchor not found")
          docs.write_text(text.replace(old_future, new_future, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bochan/api/optimizer/dispatch.py \
                  src/bochan/tabular/composition/support.py \
                  docs/composition_best_subset.md
          git diff --cached --check
          git commit -m "Wire multiple composition Best Subset groups"
          git push origin HEAD:codex/composition-multi-best-subset-groups
