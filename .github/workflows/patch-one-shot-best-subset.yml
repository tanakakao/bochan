name: Patch one-shot Best Subset

on:
  push:
    branches:
      - codex/composition-one-shot-best-subset

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/composition-one-shot-best-subset
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply source patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Generic single-group Best Subset.
          path = "src/bochan/api/support/best_subset.py"
          replace_once(
              path,
              "from ..configs import OptimizeConfig\n",
              "from ..configs import OptimizeConfig\nfrom .one_shot import (\n"
              "    is_one_shot_acquisition,\n"
              "    one_shot_support_config,\n"
              "    validate_one_shot_best_subset,\n"
              ")\n",
          )
          old = '''def _config_for_support(config: OptimizeConfig, support: Sequence[int]) -> OptimizeConfig:\n    \"\"\"Build an inner optimization config with one shared support fixed.\"\"\"\n    repair = config.repair_config\n    if repair is None:\n        raise ValueError(\"best_subset requires repair_config.\")\n\n    comp_idx = tuple(int(index) for index in (repair.comp_idx or ()))\n    support_tuple = tuple(int(index) for index in support)\n    support_set = set(support_tuple)\n    inactive = [index for index in comp_idx if index not in support_set]\n\n    fixed = _merged_fixed_features(config)\n    for index in inactive:\n        fixed[index] = 0.0\n\n    inner_repair = replace(\n        repair,\n        comp_idx=support_tuple,\n        k=len(support_tuple),\n        support_selection=\"topk\",\n        fixed_features=fixed,\n    )\n    return replace(\n        config,\n        repair_config=inner_repair,\n        fixed_features=fixed,\n        optimizer_kwargs=_inner_optimizer_kwargs(config),\n    )\n'''
          new = '''def _config_for_support(\n    config: OptimizeConfig,\n    support: Sequence[int],\n    *,\n    acqf: Any,\n    bounds: Any,\n) -> OptimizeConfig:\n    \"\"\"Build an inner optimization config with one shared support fixed.\"\"\"\n    repair = config.repair_config\n    if repair is None:\n        raise ValueError(\"best_subset requires repair_config.\")\n\n    comp_idx = tuple(int(index) for index in (repair.comp_idx or ()))\n    support_tuple = tuple(int(index) for index in support)\n    optimizer_kwargs = _inner_optimizer_kwargs(config)\n    if is_one_shot_acquisition(acqf):\n        validate_one_shot_best_subset(acqf, config)\n        return one_shot_support_config(\n            config,\n            sparse_indices=comp_idx,\n            support=support_tuple,\n            bounds=bounds,\n            optimizer_kwargs=optimizer_kwargs,\n        )\n\n    support_set = set(support_tuple)\n    inactive = [index for index in comp_idx if index not in support_set]\n    fixed = _merged_fixed_features(config)\n    for index in inactive:\n        fixed[index] = 0.0\n\n    inner_repair = replace(\n        repair,\n        comp_idx=support_tuple,\n        k=len(support_tuple),\n        support_selection=\"topk\",\n        fixed_features=fixed,\n    )\n    return replace(\n        config,\n        repair_config=inner_repair,\n        fixed_features=fixed,\n        optimizer_kwargs=optimizer_kwargs,\n    )\n'''
          replace_once(path, old, new)
          old = '''    inner_config = _config_for_support(config, support)\n    candidates, _ = optimize_one(\n        acqf=acqf,\n        bounds=bounds,\n        config=inner_config,\n    )\n    acq_value = _evaluate_acquisition(acqf, candidates)\n    return candidates, acq_value, _scalar_acquisition_value(acq_value)\n'''
          new = '''    inner_config = _config_for_support(\n        config,\n        support,\n        acqf=acqf,\n        bounds=bounds,\n    )\n    candidates, optimized_value = optimize_one(\n        acqf=acqf,\n        bounds=bounds,\n        config=inner_config,\n    )\n    acq_value = (\n        optimized_value\n        if is_one_shot_acquisition(acqf)\n        else _evaluate_acquisition(acqf, candidates)\n    )\n    if hasattr(acq_value, \"detach\"):\n        acq_value = acq_value.detach()\n    return candidates, acq_value, _scalar_acquisition_value(acq_value)\n'''
          replace_once(path, old, new)

          # Grouped Best Subset.
          path = "src/bochan/api/support/multi_group_best_subset.py"
          replace_once(
              path,
              "from ..configs import OptimizeConfig\n",
              "from ..configs import OptimizeConfig\nfrom .one_shot import (\n"
              "    is_one_shot_acquisition,\n"
              "    one_shot_support_config,\n"
              "    validate_one_shot_best_subset,\n"
              ")\n",
          )
          old = '''def _config_for_support(\n    config: OptimizeConfig,\n    problem: _GroupedProblem,\n    support: Sequence[int],\n) -> OptimizeConfig:\n    repair = config.repair_config\n    if repair is None:\n        raise ValueError(\"grouped best_subset requires repair_config.\")\n    support_tuple = tuple(int(index) for index in support)\n    support_set = set(support_tuple)\n    fixed = _merged_fixed_features(config)\n    for index in problem.sparse_indices:\n        if index not in support_set:\n            fixed[index] = 0.0\n    inner_repair = replace(\n        repair,\n        comp_idx=support_tuple,\n        k=len(support_tuple),\n        support_selection=\"topk\",\n        fixed_features=fixed,\n    )\n    return replace(\n        config,\n        repair_config=inner_repair,\n        fixed_features=fixed,\n        optimizer_kwargs=_inner_optimizer_kwargs(config),\n    )\n'''
          new = '''def _config_for_support(\n    config: OptimizeConfig,\n    problem: _GroupedProblem,\n    support: Sequence[int],\n    *,\n    acqf: Any,\n    bounds: Any,\n) -> OptimizeConfig:\n    repair = config.repair_config\n    if repair is None:\n        raise ValueError(\"grouped best_subset requires repair_config.\")\n    support_tuple = tuple(int(index) for index in support)\n    optimizer_kwargs = _inner_optimizer_kwargs(config)\n    if is_one_shot_acquisition(acqf):\n        validate_one_shot_best_subset(acqf, config)\n        return one_shot_support_config(\n            config,\n            sparse_indices=problem.sparse_indices,\n            support=support_tuple,\n            bounds=bounds,\n            optimizer_kwargs=optimizer_kwargs,\n        )\n\n    support_set = set(support_tuple)\n    fixed = _merged_fixed_features(config)\n    for index in problem.sparse_indices:\n        if index not in support_set:\n            fixed[index] = 0.0\n    inner_repair = replace(\n        repair,\n        comp_idx=support_tuple,\n        k=len(support_tuple),\n        support_selection=\"topk\",\n        fixed_features=fixed,\n    )\n    return replace(\n        config,\n        repair_config=inner_repair,\n        fixed_features=fixed,\n        optimizer_kwargs=optimizer_kwargs,\n    )\n'''
          replace_once(path, old, new)
          old = '''    inner_config = _config_for_support(config, problem, support)\n    candidates, _ = optimize_one(acqf=acqf, bounds=bounds, config=inner_config)\n    value = acqf(candidates)\n    if hasattr(value, \"detach\"):\n        value = value.detach()\n    return candidates, value, _scalar_acquisition_value(value)\n'''
          new = '''    inner_config = _config_for_support(\n        config,\n        problem,\n        support,\n        acqf=acqf,\n        bounds=bounds,\n    )\n    candidates, optimized_value = optimize_one(\n        acqf=acqf,\n        bounds=bounds,\n        config=inner_config,\n    )\n    value = optimized_value if is_one_shot_acquisition(acqf) else acqf(candidates)\n    if hasattr(value, \"detach\"):\n        value = value.detach()\n    return candidates, value, _scalar_acquisition_value(value)\n'''
          replace_once(path, old, new)

          # Raw-decision acquisition bridge.
          path = "src/bochan/tabular/composition/logratio_support.py"
          replace_once(
              path,
              "from bochan.tabular.data import resolve_optimize_config_columns\n",
              "from bochan.api.support.one_shot import is_one_shot_acquisition\n"
              "from bochan.tabular.data import resolve_optimize_config_columns\n",
          )
          marker = '''\n\n@dataclass(frozen=True)\nclass LogRatioBestSubsetResult:'''
          insertion = '''\n\nclass RawDecisionOneShotAcquisition(\n    __import__(\"botorch.acquisition.acquisition\", fromlist=[\"OneShotAcquisitionFunction\"]).OneShotAcquisitionFunction\n):\n    \"\"\"Preserve BoTorch one-shot semantics while evaluating through a raw bridge.\"\"\"\n\n    def __init__(self, base_acqf: Any, bridge: Any) -> None:\n        super().__init__(model=base_acqf.model)\n        self.base_acqf = base_acqf\n        self.bridge = bridge\n        self._bochan_one_shot_base = base_acqf\n\n    @property\n    def X_pending(self) -> Tensor | None:\n        pending = getattr(self.base_acqf, \"X_pending\", None)\n        return None if pending is None else self.bridge.model_to_decision(pending)\n\n    def set_X_pending(self, X_pending: Tensor | None = None) -> RawDecisionOneShotAcquisition:\n        setter = getattr(self.base_acqf, \"set_X_pending\", None)\n        if callable(setter):\n            setter(None if X_pending is None else self.bridge.decision_to_model(X_pending))\n        elif X_pending is not None:\n            raise AttributeError(\"The wrapped acquisition does not support pending points.\")\n        return self\n\n    def forward(self, values: Tensor) -> Tensor:\n        return self.base_acqf(self.bridge.decision_to_model(values))\n\n    def get_augmented_q_batch_size(self, q: int) -> int:\n        return int(self.base_acqf.get_augmented_q_batch_size(int(q)))\n\n    def extract_candidates(self, X_full: Tensor) -> Tensor:\n        model_full = self.bridge.decision_to_model(X_full)\n        model_candidates = self.base_acqf.extract_candidates(model_full)\n        q = int(model_candidates.shape[-2])\n        return X_full[..., :q, :]\n\n\ndef wrap_raw_decision_acquisition(base_acqf: Any, bridge: Any) -> Any:\n    \"\"\"Wrap a normal or one-shot acquisition without hiding its optimizer contract.\"\"\"\n\n    if is_one_shot_acquisition(base_acqf):\n        return RawDecisionOneShotAcquisition(base_acqf, bridge)\n    return RawDecisionAcquisition(base_acqf, bridge)\n'''
          replace_once(path, marker, insertion + marker)
          start = text = Path(path).read_text()
          reject_start = text.index("\ndef _reject_one_shot_acquisition(acqf: Any) -> None:\n")
          optimize_start = text.index("\ndef optimize_logratio_best_subset(\n", reject_start)
          text = text[:reject_start] + text[optimize_start:]
          text = text.replace("    _reject_one_shot_acquisition(base_acqf)\n", "", 1)
          text = text.replace(
              "    wrapped = RawDecisionAcquisition(base_acqf, bridge)\n",
              "    wrapped = wrap_raw_decision_acquisition(base_acqf, bridge)\n",
              1,
          )
          text = text.replace(
              "    raw_candidates, _raw_value = optimize_fn(\n",
              "    raw_candidates, raw_value = optimize_fn(\n",
              1,
          )
          text = text.replace(
              "    final_value = base_acqf(model_candidates)\n    if hasattr(final_value, \"detach\"):\n        final_value = final_value.detach()\n",
              "    if is_one_shot_acquisition(base_acqf):\n        final_value = raw_value\n    else:\n        final_value = base_acqf(model_candidates)\n    if hasattr(final_value, \"detach\"):\n        final_value = final_value.detach()\n",
              1,
          )
          text = text.replace(
              '    "RawDecisionAcquisition",\n',
              '    "RawDecisionAcquisition",\n    "RawDecisionOneShotAcquisition",\n    "wrap_raw_decision_acquisition",\n',
              1,
          )
          Path(path).write_text(text)

          # Variable-total raw bridge.
          path = "src/bochan/tabular/composition/variable_total_support.py"
          text = Path(path).read_text()
          text = text.replace(
              "from .logratio_support import RawDecisionAcquisition\n",
              "from .logratio_support import wrap_raw_decision_acquisition\n",
              1,
          )
          reject_start = text.index("\ndef _reject_one_shot_acquisition(acqf: Any) -> None:\n")
          optimize_start = text.index("\ndef optimize_variable_total_best_subset(\n", reject_start)
          text = text[:reject_start] + text[optimize_start:]
          text = text.replace("    _reject_one_shot_acquisition(base_acqf)\n", "", 1)
          text = text.replace(
              "    wrapped = RawDecisionAcquisition(base_acqf, bridge)  # type: ignore[arg-type]\n",
              "    wrapped = wrap_raw_decision_acquisition(base_acqf, bridge)\n",
              1,
          )
          text = text.replace(
              "    raw_candidates, _raw_value = optimize_fn(\n",
              "    raw_candidates, raw_value = optimize_fn(\n",
              1,
          )
          text = text.replace(
              "    final_value = base_acqf(model_candidates)\n    if hasattr(final_value, \"detach\"):\n        final_value = final_value.detach()\n",
              "    if is_one_shot_acquisition(base_acqf):\n        final_value = raw_value\n    else:\n        final_value = base_acqf(model_candidates)\n    if hasattr(final_value, \"detach\"):\n        final_value = final_value.detach()\n",
              1,
          )
          text = text.replace(
              "from bochan.api.support.best_subset import InfeasibleBestSubsetSupportError\n",
              "from bochan.api.support.best_subset import InfeasibleBestSubsetSupportError\nfrom bochan.api.support.one_shot import is_one_shot_acquisition\n",
              1,
          )
          Path(path).write_text(text)

          # Composite multi-raw bridge.
          path = "src/bochan/tabular/composition/multi_raw_support.py"
          text = Path(path).read_text()
          text = text.replace(
              "from bochan.api.support.multi_group_best_subset import BEST_SUBSET_GROUPS_KWARG\n",
              "from bochan.api.support.multi_group_best_subset import BEST_SUBSET_GROUPS_KWARG\nfrom bochan.api.support.one_shot import is_one_shot_acquisition\n",
              1,
          )
          text = text.replace(
              "    RawDecisionAcquisition,\n    _raw_fixed_features_list_from_training,\n    _reject_one_shot_acquisition,\n",
              "    _raw_fixed_features_list_from_training,\n    wrap_raw_decision_acquisition,\n",
              1,
          )
          text = text.replace("    _reject_one_shot_acquisition(base_acqf)\n", "", 1)
          text = text.replace(
              "    wrapped = RawDecisionAcquisition(base_acqf, bridge)  # type: ignore[arg-type]\n",
              "    wrapped = wrap_raw_decision_acquisition(base_acqf, bridge)\n",
              1,
          )
          text = text.replace(
              "    raw_candidates, _raw_value = optimize_fn(\n",
              "    raw_candidates, raw_value = optimize_fn(\n",
              1,
          )
          text = text.replace(
              "    final_value = base_acqf(model_candidates)\n    if hasattr(final_value, \"detach\"):\n        final_value = final_value.detach()\n",
              "    if is_one_shot_acquisition(base_acqf):\n        final_value = raw_value\n    else:\n        final_value = base_acqf(model_candidates)\n    if hasattr(final_value, \"detach\"):\n        final_value = final_value.detach()\n",
              1,
          )
          Path(path).write_text(text)

          # Recover qKG / qHVKG specialized initializers through the raw wrapper.
          path = "src/bochan/api/factory.py"
          old = '''    common_kwargs = {\n        \"acq_function\": acqf,\n        \"bounds\": bounds,\n        \"q\": config.q,\n        \"num_restarts\": config.num_restarts,\n        \"raw_samples\": config.raw_samples,\n        \"return_best_only\": config.return_best_only,\n    }\n'''
          new = old + '''\n    from .support.one_shot import resolve_one_shot_ic_generator\n\n    one_shot_ic_generator = resolve_one_shot_ic_generator(acqf)\n    if one_shot_ic_generator is not None and \"ic_generator\" not in config.optimizer_kwargs:\n        common_kwargs[\"ic_generator\"] = one_shot_ic_generator\n'''
          replace_once(path, old, new)
          PY
      - name: Ruff fix touched sources
        run: |
          python -m pip install ruff
          ruff check --fix --ignore SIM108 \
            src/bochan/api/support/one_shot.py \
            src/bochan/api/support/best_subset.py \
            src/bochan/api/support/multi_group_best_subset.py \
            src/bochan/api/factory.py \
            src/bochan/tabular/composition/logratio_support.py \
            src/bochan/tabular/composition/variable_total_support.py \
            src/bochan/tabular/composition/multi_raw_support.py
      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src/bochan
            git commit -m "Support one-shot acquisition Best Subset search"
            git push origin HEAD:codex/composition-one-shot-best-subset
          fi
