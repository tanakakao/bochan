name: Regression final candidate uniqueness

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: regression-final-candidate-uniqueness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Clone pull request branch
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git clone --branch "${{ github.head_ref }}" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo

      - name: Apply source changes
        shell: pwsh
        working-directory: repo
        run: py -3.12 scripts/apply_regression_candidate_uniqueness.py

      - name: Install Python dependencies
        shell: pwsh
        working-directory: repo
        run: |
          py -3.12 -m pip install --upgrade pip
          py -3.12 -m pip install -e ".[test,web]" ruff

      - name: Format and lint Python changes
        shell: pwsh
        working-directory: repo
        run: |
          py -3.12 -m ruff format src/bochan/api/optimizer_config.py src/bochan/api/candidate_uniqueness.py src/bochan/serving/webapp/target_results.py src/bochan/serving/webapp/app.py src/bochan/serving/webapp/workflows_tabular.py tests/test_regression_final_candidate_uniqueness_e2e.py
          py -3.12 -m ruff check --fix src/bochan/api/optimizer_config.py src/bochan/api/candidate_uniqueness.py src/bochan/serving/webapp/target_results.py src/bochan/serving/webapp/app.py src/bochan/serving/webapp/workflows_tabular.py tests/test_regression_final_candidate_uniqueness_e2e.py
          py -3.12 -m ruff check src/bochan/api/optimizer_config.py src/bochan/api/candidate_uniqueness.py src/bochan/serving/webapp/target_results.py src/bochan/serving/webapp/app.py src/bochan/serving/webapp/workflows_tabular.py tests/test_regression_final_candidate_uniqueness_e2e.py

      - name: Run candidate uniqueness tests
        shell: pwsh
        working-directory: repo
        run: py -3.12 -m pytest tests/test_api_candidate_uniqueness.py tests/test_regression_final_candidate_uniqueness_e2e.py -q

      - name: Build Web application
        shell: pwsh
        working-directory: repo/web
        run: |
          npm ci
          npm run build

      - name: Commit validated source changes
        shell: pwsh
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bochan/api/optimizer_config.py
          git add src/bochan/api/candidate_uniqueness.py
          git add src/bochan/serving/webapp/target_results.py
          git add src/bochan/serving/webapp/app.py
          git add src/bochan/serving/webapp/workflows_tabular.py
          git add web/src/types.ts
          git add web/src/api.ts
          git add web/src/context/WorkbenchContext.tsx
          git add web/src/modelArtifactRestore.ts
          git add web/src/pages/OptimizePage.tsx
          git add web/src/pages/ResultsPage.tsx
          git add tests/test_regression_final_candidate_uniqueness_e2e.py
          if (git diff --cached --quiet) {
            Write-Host "No validated source changes to commit."
          } else {
            git commit -m "Improve regression candidate uniqueness"
            git push origin "HEAD:${{ github.head_ref }}"
          }
