name: Replace disallowed math macros

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  replace-operatorname:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Replace disallowed operatorname macros
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          pattern = re.compile(r"\\operatorname\{([^{}]+)\}")
          theory_dir = Path("docs/theory")
          changed = []
          names = Counter()

          for path in sorted(theory_dir.glob("*.md")):
              original = path.read_text(encoding="utf-8")

              def replace(match: re.Match[str]) -> str:
                  name = match.group(1)
                  names[name] += 1
                  return rf"\mathrm{{{name}}}"

              updated = pattern.sub(replace, original)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print(f"Updated {len(changed)} files.")
          print("Replaced operators:")
          for name, count in sorted(names.items()):
              print(f"  {name}: {count}")

          remaining = []
          for path in sorted(theory_dir.glob("*.md")):
              text = path.read_text(encoding="utf-8")
              if r"\operatorname" in text:
                  remaining.append(str(path))

          if remaining:
              raise RuntimeError(
                  "Unconverted operatorname macros remain in: "
                  + ", ".join(remaining)
              )
          PY

      - name: Commit converted documentation
        shell: bash
        run: |
          if git diff --quiet -- docs/theory; then
            echo 'No documentation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/theory
          git commit -m 'docs: replace disallowed operatorname math macros'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
