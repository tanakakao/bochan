name: Restore classification generated artifacts

on:
  push:
    branches:
      - agent/exclude-classification-duplicates
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exclude-classification-duplicates
          fetch-depth: 0

      - name: Restore tracked generated files from main
        run: |
          git fetch origin main
          mapfile -t generated_files < <(
            git diff --name-only origin/main...HEAD \
              | grep -E '(^src/bochan\.egg-info/|/__pycache__/.*\.pyc$)' || true
          )
          for path in "${generated_files[@]}"; do
            if git cat-file -e "origin/main:${path}" 2>/dev/null; then
              git checkout origin/main -- "${path}"
            else
              git rm -f --ignore-unmatch "${path}"
            fi
          done
          git diff --check

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No generated artifacts require cleanup.'
            exit 0
          fi
          git commit -m 'Restore tracked generated artifacts'
          git push origin HEAD:agent/exclude-classification-duplicates
