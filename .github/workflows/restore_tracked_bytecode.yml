name: Restore tracked bytecode

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/binary-multioutput-rrp-compatibility
          fetch-depth: 0

      - name: Restore tracked bytecode from main
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD \
            | grep -E '(^|/)(__pycache__/.*\.pyc|[^/]+\.py[co])$' \
            > /tmp/tracked-bytecode.txt || true
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            git checkout origin/main -- "$path"
          done < /tmp/tracked-bytecode.txt
          rm -f .github/workflows/restore_tracked_bytecode.yml

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Restore tracked bytecode outside compatibility fix'
          git push origin HEAD:fix/binary-multioutput-rrp-compatibility
