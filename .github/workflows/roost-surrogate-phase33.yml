name: Roost surrogate Phase 33

on:
  pull_request:
    paths:
      - "src/bochan/models/regression/gaussian/deep/roost_extended.py"
      - "src/bochan/models/regression/gaussian/materials/composition/**"
      - "src/bochan/models/regression/gaussian/materials/common/registry.py"
      - "tests/test_roost_surrogate_phase33.py"
      - ".github/workflows/roost-surrogate-phase33.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff
      - name: Run Roost surrogate tests
        run: pytest -q tests/test_roost_surrogate_phase33.py tests/test_material_surrogate_factory.py
      - name: Ruff
        run: |
          ruff check \
            src/bochan/models/regression/gaussian/deep/roost_extended.py \
            src/bochan/models/regression/gaussian/materials/composition/__init__.py \
            src/bochan/models/regression/gaussian/materials/composition/roost/__init__.py \
            src/bochan/models/regression/gaussian/materials/common/registry.py \
            tests/test_roost_surrogate_phase33.py
