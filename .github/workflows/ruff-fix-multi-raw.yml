name: Ruff fix multi raw

on:
  push:
    branches:
      - codex/composition-multi-raw-bridges

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/composition-multi-raw-bridges
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fix lint
        run: |
          python -m pip install ruff
          ruff check --fix --ignore SIM108 \
            src/bochan/tabular/composition/multi_raw_support.py \
            tests/test_composition_multi_raw_best_subset.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src/bochan/tabular/composition/multi_raw_support.py tests/test_composition_multi_raw_best_subset.py
            git commit -m "Fix grouped raw composition lint"
            git push origin HEAD:codex/composition-multi-raw-bridges
          fi
