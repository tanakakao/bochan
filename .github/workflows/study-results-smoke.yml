name: Study results smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,api,visualization]"
      - name: Run Study tests
        shell: bash
        run: |
          set +e
          pytest -q --maxfail=1 \
            tests/api/test_study.py \
            tests/api/test_study_results.py \
            tests/test_study_visualization.py \
            2>&1 | tee pytest-study.log
          status=${PIPESTATUS[0]}
          echo "$status" > pytest-study.status
          exit "$status"
      - name: Run lint
        if: always()
        shell: bash
        run: |
          python -m pip install ruff
          set +e
          ruff check \
            src/bochan/api/study_controls.py \
            src/bochan/api/study_results.py \
            src/bochan/visualization/__init__.py \
            src/bochan/visualization/study.py \
            tests/api/test_study_results.py \
            tests/test_study_visualization.py \
            2>&1 | tee ruff-study.log
          status=${PIPESTATUS[0]}
          echo "$status" > ruff-study.status
          exit "$status"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-results-smoke-logs
          path: |
            pytest-study.log
            pytest-study.status
            ruff-study.log
            ruff-study.status
          if-no-files-found: warn
