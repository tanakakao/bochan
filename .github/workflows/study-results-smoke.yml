name: Study results smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/study-best-results-visualization
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply pending best_x shape fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/bochan/api/study_results.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "    return get_best_trial(\n"
              "        self,\n"
              "        output_index=output_index,\n"
              "        direction=direction,\n"
              "    ).x\n"
          )
          new = (
              "    x = get_best_trial(\n"
              "        self,\n"
              "        output_index=output_index,\n"
              "        direction=direction,\n"
              "    ).x\n"
              "    shape = getattr(x, \"shape\", None)\n"
              "    if shape is not None:\n"
              "        try:\n"
              "            if len(shape) > 1 and int(shape[0]) == 1:\n"
              "                return x[0]\n"
              "        except (TypeError, ValueError):\n"
              "            pass\n"
              "    if isinstance(x, Sequence) and not isinstance(x, (str, bytes)):\n"
              "        try:\n"
              "            if len(x) == 1 and isinstance(x[0], Sequence):\n"
              "                return x[0]\n"
              "        except (TypeError, IndexError):\n"
              "            pass\n"
              "    return x\n"
          )
          if old not in text:
              raise RuntimeError("get_best_x patch marker was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install
        run: python -m pip install -e ".[test,api,visualization]"
      - name: Run Study result tests
        shell: bash
        run: |
          set +e
          pytest -q --maxfail=1 \
            tests/api/test_study_results.py \
            tests/test_study_visualization.py \
            2>&1 | tee pytest-study.log
          status=${PIPESTATUS[0]}
          echo "$status" > pytest-study.status
          exit "$status"
      - name: Run lint
        if: always()
        shell: bash
        run: |
          python -m pip install ruff
          set +e
          ruff check \
            src/bochan/api/study_results.py \
            src/bochan/visualization/study.py \
            tests/api/test_study_results.py \
            tests/test_study_visualization.py \
            2>&1 | tee ruff-study.log
          status=${PIPESTATUS[0]}
          echo "$status" > ruff-study.status
          exit "$status"
      - name: Create validated fix commit object
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          parent = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          path = Path("src/bochan/api/study_results.py")

          def api(api_path, data=None):
              body = None if data is None else json.dumps(data).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}{api_path}",
                  data=body,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="GET" if data is None else "POST",
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          parent_commit = api(f"/git/commits/{parent}")
          blob = api(
              "/git/blobs",
              {"content": path.read_text(encoding="utf-8"), "encoding": "utf-8"},
          )
          tree = api(
              "/git/trees",
              {
                  "base_tree": parent_commit["tree"]["sha"],
                  "tree": [
                      {
                          "path": str(path),
                          "mode": "100644",
                          "type": "blob",
                          "sha": blob["sha"],
                      }
                  ],
              },
          )
          commit = api(
              "/git/commits",
              {
                  "message": "Normalize Study best_x shape",
                  "tree": tree["sha"],
                  "parents": [parent],
              },
          )
          Path("generated_fix_sha.txt").write_text(commit["sha"] + "\n", encoding="utf-8")
          print(commit["sha"])
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-results-smoke-logs
          path: |
            pytest-study.log
            pytest-study.status
            ruff-study.log
            ruff-study.status
            generated_fix_sha.txt
          if-no-files-found: warn
