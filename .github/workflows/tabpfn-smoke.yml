name: TabPFN smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "src/bochan/api/model_registry.py"
      - "src/bochan/models/external/native_categorical.py"
      - "src/bochan/models/regression/foundation/**"
      - "src/bochan/models/classification/common/tabpfn.py"
      - "src/bochan/models/classification/binary/foundation/**"
      - "src/bochan/models/classification/multiclass/foundation/**"
      - "tests/test_tabpfn_models.py"
      - "tests/test_tabpfn_optional_smoke.py"
      - ".github/workflows/tabpfn-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,tabpfn]"
      - name: Run TabPFN tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_tabpfn_models.py \
            tests/test_tabpfn_optional_smoke.py
      - name: Lint TabPFN modules
        run: |
          python -m pip install ruff
          ruff check --ignore I001 \
            src/bochan/models/regression/foundation/tabpfn.py \
            src/bochan/models/regression/foundation/__init__.py \
            src/bochan/models/classification/common/tabpfn.py \
            src/bochan/models/classification/binary/foundation \
            src/bochan/models/classification/multiclass/foundation \
            tests/test_tabpfn_models.py \
            tests/test_tabpfn_optional_smoke.py
