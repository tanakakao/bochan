name: Temporary model strategy layout refactor

on:
  push:
    branches:
      - agent/reorganize-multioutput-multitask
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reorganize-multioutput-multitask
          fetch-depth: 0

      - name: Reorganize model strategy packages
        run: python .github/tmp_model_strategy_layout.py

      - name: Validate Python syntax
        run: python -m compileall -q src/bochan tests

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reorganize multioutput and multitask models"
          git push origin HEAD:agent/reorganize-multioutput-multitask
