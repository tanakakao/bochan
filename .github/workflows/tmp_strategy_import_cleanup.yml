name: Temporary strategy import cleanup

on:
  push:
    branches:
      - agent/reorganize-multioutput-multitask
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reorganize-multioutput-multitask
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean canonical imports and import ordering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/bochan/models/multioutput/binary.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from typing import Any, Optional, Sequence, Union',
              'from typing import TYPE_CHECKING, Any, Optional, Sequence, Union',
              1,
          )
          text = text.replace(
              'from bochan.models.classification.binary.base.posterior import SimpleBernoulliPosterior\n',
              'if TYPE_CHECKING:\n    from bochan.models.classification.binary.base.posterior import SimpleBernoulliPosterior\n',
              1,
          )
          text = text.replace(
              ') -> "MultiOutputClassificationModel":',
              ') -> "MultiOutputBinaryClassificationModel":',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

          python -m pip install ruff
          ruff check --fix \
            tests/test_ordinal_nehvi_repeated_backward.py \
            tests/test_wide_multitask_models.py \
            tests/test_wide_multitask_public_transform.py \
            tests/test_model_strategy_package_layout.py

          git checkout HEAD -- .github/workflows

      - name: Validate direct imports
        run: |
          python -m pip install -e ".[test,tabular,api]"
          pytest -q tests/test_model_strategy_package_layout.py

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bochan/models/multioutput/binary.py \
            tests/test_ordinal_nehvi_repeated_backward.py \
            tests/test_wide_multitask_models.py \
            tests/test_wide_multitask_public_transform.py \
            tests/test_model_strategy_package_layout.py
          git diff --cached --check
          git commit -m "Harden canonical model strategy imports"
          git push origin HEAD:agent/reorganize-multioutput-multitask
