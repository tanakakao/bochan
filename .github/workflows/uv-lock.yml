name: Python environment

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "start_web.bat"
      - ".github/workflows/uv-lock.yml"
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "start_web.bat"
      - ".github/workflows/uv-lock.yml"

jobs:
  lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.1"
      - name: Install project Python
        run: uv python install 3.12
      - name: Verify lockfile is current
        run: uv lock --check

  launcher-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows launcher
        shell: cmd
        run: call start_web.bat check
