name: Validate binary multi-output and RRP fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/binary-multioutput-rrp-compatibility
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply source changes
        run: python .github/scripts/apply_binary_multioutput_rrp_compatibility.py

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,tabular,evo]'

      - name: Compile changed modules
        run: |
          python -m compileall -q \
            src/bochan/models/classification/binary/base/_latent_models.py \
            src/bochan/models/classification/binary/base/multioutput.py \
            src/bochan/models/classification/binary/robust/relevance_pursuit.py \
            src/bochan/models/components/robust.py \
            tests/test_binary_multioutput_rrp_compatibility.py

      - name: Run focused compatibility tests
        run: pytest -q tests/test_binary_multioutput_rrp_compatibility.py

      - name: Run existing non-slow multi-output tests
        run: pytest -q tests/test_binary_classification_base_multi_output.py -k 'not slow'

      - name: Run existing RRP basic tests
        run: pytest -q tests/test_binary_classification_rrp_single_output.py -k 'basic_behavior'

      - name: Remove temporary files
        run: |
          rm -f .github/README_BINARY_MODEL_COMPAT_FIX.tmp3
          rm -f .github/README_BINARY_MODEL_COMPAT_FIX.tmp4
          rm -f .github/README_BINARY_MODEL_COMPAT_FIX.tmp5
          rm -f .github/scripts/apply_binary_multioutput_rrp_compatibility.py
          rm -f .github/workflows/apply_binary_multioutput_rrp_compatibility.yml
          rm -f .github/workflows/validate_binary_multioutput_rrp_compatibility.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf .pytest_cache src/bochan.egg-info

      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Fix binary multi-output subset and RRP compatibility'
          git push origin HEAD:fix/binary-multioutput-rrp-compatibility
