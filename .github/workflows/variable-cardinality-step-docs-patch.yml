name: Apply variable-cardinality step-grid docs cleanup

on:
  push:
    branches:
      - codex/composition-variable-cardinality-step-grid
    paths:
      - ".github/workflows/variable-cardinality-step-docs-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/composition-variable-cardinality-step-grid
      - name: Patch remaining docs wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/composition_best_subset.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "- the selected exact-k support;": "- the selected support and its cardinality;",
              "- the selected exact-k element support;": "- the selected element support and its cardinality;",
              "- component steps use the same exact-cardinality-only MILP contract as the Python API.": "- component steps use the same variable-cardinality, support-preserving MILP contract as the Python API.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f"Missing expected docs text: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/variable-cardinality-step-docs-patch.yml
          git add docs/composition_best_subset.md
          git commit -m "Document variable-cardinality step-grid contract"
          git push origin HEAD:codex/composition-variable-cardinality-step-grid
