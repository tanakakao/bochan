name: Web composition smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/bochan/serving/webapp/composition_web_support.py"
      - "src/bochan/serving/webapp/composition_web_routes.py"
      - "src/bochan/serving/webapp/composition_constraint_adapter.py"
      - "src/bochan/serving/webapp/composition_visualization.py"
      - "src/bochan/serving/webapp/composition_visualization_compat.py"
      - "src/bochan/serving/webapp/composition_pd_compat.py"
      - "src/bochan/serving/webapp/composition_feature_importance.py"
      - "src/bochan/serving/webapp/composition_feature_importance_views.py"
      - "src/bochan/serving/webapp/composition_importance_records_compat.py"
      - "src/bochan/serving/webapp/composition_importance_output_compat.py"
      - "src/bochan/serving/webapp/composition_element_importance_figures.py"
      - "src/bochan/serving/webapp/visualization_feature_types.py"
      - "src/bochan/serving/webapp/__init__.py"
      - "web/src/compositionExtension.ts"
      - "web/src/compositionDatasetState.ts"
      - "web/src/composition-extension.css"
      - "web/src/compositionVisualizationTypes.ts"
      - "web/src/compositionVisualizationGuard.ts"
      - "web/src/importanceFeatureLabels.ts"
      - "web/src/InteractiveResultPlots.tsx"
      - "web/src/red-theme.css"
      - "web/src/main.tsx"
      - "web/test/importanceFeatureLabels.test.ts"
      - "web/package.json"
      - "tests/test_webapp_composition_support.py"
      - "tests/test_webapp_composition_visualization.py"
      - "tests/test_webapp_composition_state_pd.py"
      - "tests/test_webapp_composition_feature_importance.py"
      - "tests/test_webapp_composition_feature_importance_integration.py"
      - "tests/test_webapp_composition_settings_placement.py"
      - "tests/test_webapp_color_theme.py"
      - ".github/workflows/web-composition-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python package
        run: python -m pip install -e ".[test,api]" pandas plotly
      - name: Run composition API tests
        run: >-
          pytest -q
          tests/test_webapp_composition_support.py
          tests/test_webapp_composition_visualization.py
          tests/test_webapp_composition_state_pd.py
          tests/test_webapp_composition_feature_importance.py
          tests/test_webapp_composition_feature_importance_integration.py
          tests/test_webapp_composition_settings_placement.py
          tests/test_webapp_color_theme.py
      - name: Run Python lint
        run: |
          python -m pip install ruff
          ruff check --ignore I001,SIM102,SIM105,SIM108,B010 \
            src/bochan/serving/webapp/composition_web_support.py \
            src/bochan/serving/webapp/composition_web_routes.py \
            src/bochan/serving/webapp/composition_constraint_adapter.py \
            src/bochan/serving/webapp/composition_visualization.py \
            src/bochan/serving/webapp/composition_visualization_compat.py \
            src/bochan/serving/webapp/composition_pd_compat.py \
            src/bochan/serving/webapp/composition_feature_importance.py \
            src/bochan/serving/webapp/composition_feature_importance_views.py \
            src/bochan/serving/webapp/composition_importance_records_compat.py \
            src/bochan/serving/webapp/composition_importance_output_compat.py \
            src/bochan/serving/webapp/composition_element_importance_figures.py \
            src/bochan/serving/webapp/visualization_feature_types.py \
            src/bochan/serving/webapp/__init__.py \
            tests/test_webapp_composition_support.py \
            tests/test_webapp_composition_visualization.py \
            tests/test_webapp_composition_state_pd.py \
            tests/test_webapp_composition_feature_importance.py \
            tests/test_webapp_composition_feature_importance_integration.py \
            tests/test_webapp_composition_settings_placement.py \
            tests/test_webapp_color_theme.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install React dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Test importance labels
        working-directory: web
        run: npm run test:importance-labels
      - name: Build React workbench
        working-directory: web
        run: npm run build
