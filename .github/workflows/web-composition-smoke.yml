name: Web composition smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/bochan/serving/webapp/composition_web_support.py"
      - "src/bochan/serving/webapp/composition_web_routes.py"
      - "src/bochan/serving/webapp/__init__.py"
      - "web/src/compositionExtension.ts"
      - "web/src/composition-extension.css"
      - "web/src/main.tsx"
      - "tests/test_webapp_composition_support.py"
      - ".github/workflows/web-composition-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python package
        run: python -m pip install -e ".[test,api]"
      - name: Run composition API tests
        run: pytest -q tests/test_webapp_composition_support.py
      - name: Run Python lint
        run: |
          python -m pip install ruff
          ruff check --ignore I001,SIM102,SIM108 \
            src/bochan/serving/webapp/composition_web_support.py \
            src/bochan/serving/webapp/composition_web_routes.py \
            src/bochan/serving/webapp/__init__.py \
            tests/test_webapp_composition_support.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build React workbench
        working-directory: web
        run: |
          npm ci
          npm run build
