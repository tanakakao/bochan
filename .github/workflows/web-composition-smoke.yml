name: Web composition smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/bochan/tabular/data/conversion.py"
      - "src/bochan/serving/webapp/composition/support.py"
      - "src/bochan/serving/webapp/routers/composition.py"
      - "src/bochan/serving/webapp/schemas/composition.py"
      - "src/bochan/serving/webapp/workflows/tabular.py"
      - "src/bochan/serving/webapp/tabular_backend.py"
      - "src/bochan/serving/webapp/composition/visualization.py"
      - "src/bochan/serving/webapp/composition/visualization_dispatch.py"
      - "src/bochan/serving/webapp/composition/multielement_ternary.py"
      - "src/bochan/serving/webapp/composition/feature_importance.py"
      - "src/bochan/serving/webapp/composition/feature_importance_views.py"
      - "src/bochan/serving/webapp/composition/element_importance_figures.py"
      - "src/bochan/serving/webapp/services/visualization_sessions.py"
      - "src/bochan/serving/webapp/__init__.py"
      - "src/bochan/visualization/__init__.py"
      - "src/bochan/visualization/ternary.py"
      - "web/vite.config.ts"
      - "web/src/compositionExtension.ts"
      - "web/src/compositionRuntime.ts"
      - "web/src/compositionDatasetState.ts"
      - "web/src/composition-extension.css"
      - "web/src/compositionVisualizationTypes.ts"
      - "web/src/components/CompositionModelSettings.tsx"
      - "web/src/components/CompositionCandidateConstraints.tsx"
      - "web/src/components/WorkbenchPageErrorBoundary.tsx"
      - "web/src/components/SearchVariableSettings.tsx"
      - "web/src/components/FeatureConstraints.tsx"
      - "web/src/pages/SettingsPage.tsx"
      - "web/src/pages/ResultsPage.tsx"
      - "web/src/importanceFeatureLabels.ts"
      - "web/src/InteractiveResultPlots.tsx"
      - "web/src/workflow-layout-extension.css"
      - "web/src/red-theme.css"
      - "web/src/main.tsx"
      - "web/test/importanceFeatureLabels.test.ts"
      - "web/package.json"
      - "tests/test_webapp_composition_support.py"
      - "tests/test_webapp_composition_candidate_repair.py"
      - "tests/test_webapp_composition_visualization.py"
      - "tests/test_webapp_visualization_feature_types.py"
      - "tests/test_ternary_plot_grid.py"
      - "tests/test_webapp_composition_state_pd.py"
      - "tests/test_webapp_composition_feature_importance.py"
      - "tests/test_webapp_composition_feature_importance_integration.py"
      - "tests/test_webapp_composition_settings_placement.py"
      - "tests/test_webapp_composition_navigation_architecture.py"
      - "tests/test_webapp_composition_runtime_transport.py"
      - "tests/test_webapp_model_suggest_react_ownership.py"
      - "tests/test_webapp_results_navigation.py"
      - "tests/test_webapp_workflow_layout.py"
      - "tests/test_webapp_color_theme.py"
      - ".github/workflows/web-composition-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python package
        run: python -m pip install -e ".[test,api]" pandas plotly scikit-image
      - name: Run composition API tests
        run: >-
          pytest -q
          tests/test_webapp_composition_support.py
          tests/test_webapp_composition_candidate_repair.py
          tests/test_webapp_composition_visualization.py
          tests/test_webapp_visualization_feature_types.py
          tests/test_ternary_plot_grid.py
          tests/test_webapp_composition_state_pd.py
          tests/test_webapp_composition_feature_importance.py
          tests/test_webapp_composition_feature_importance_integration.py
          tests/test_webapp_composition_settings_placement.py
          tests/test_webapp_composition_navigation_architecture.py
          tests/test_webapp_composition_runtime_transport.py
          tests/test_webapp_model_suggest_react_ownership.py
          tests/test_webapp_results_navigation.py
          tests/test_webapp_workflow_layout.py
          tests/test_webapp_color_theme.py
      - name: Run Python lint
        run: |
          python -m pip install ruff
          ruff check --ignore I001,SIM102,SIM105,SIM108,B010 \
            src/bochan/tabular/data/conversion.py \
            src/bochan/serving/webapp/composition/support.py \
            src/bochan/serving/webapp/routers/composition.py \
            src/bochan/serving/webapp/schemas/composition.py \
            src/bochan/serving/webapp/workflows/tabular.py \
            src/bochan/serving/webapp/tabular_backend.py \
            src/bochan/serving/webapp/composition/visualization.py \
            src/bochan/serving/webapp/composition/visualization_dispatch.py \
            src/bochan/serving/webapp/composition/multielement_ternary.py \
            src/bochan/serving/webapp/composition/feature_importance.py \
            src/bochan/serving/webapp/composition/feature_importance_views.py \
            src/bochan/serving/webapp/composition/element_importance_figures.py \
            src/bochan/serving/webapp/services/visualization_sessions.py \
            src/bochan/serving/webapp/__init__.py \
            src/bochan/visualization/__init__.py \
            src/bochan/visualization/ternary.py \
            tests/test_webapp_composition_support.py \
            tests/test_webapp_composition_candidate_repair.py \
            tests/test_webapp_composition_visualization.py \
            tests/test_webapp_visualization_feature_types.py \
            tests/test_ternary_plot_grid.py \
            tests/test_webapp_composition_state_pd.py \
            tests/test_webapp_composition_feature_importance.py \
            tests/test_webapp_composition_feature_importance_integration.py \
            tests/test_webapp_composition_settings_placement.py \
            tests/test_webapp_composition_navigation_architecture.py \
            tests/test_webapp_composition_runtime_transport.py \
            tests/test_webapp_model_suggest_react_ownership.py \
            tests/test_webapp_results_navigation.py \
            tests/test_webapp_workflow_layout.py \
            tests/test_webapp_color_theme.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install React dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Test importance labels
        working-directory: web
        run: npm run test:importance-labels
      - name: Build React workbench
        working-directory: web
        run: npm run build