name: Web input perturbation smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/bochan/api/**"
      - "src/bochan/acquisition/**"
      - "src/bochan/inspection/**"
      - "src/bochan/models/**"
      - "src/bochan/serving/webapp/**"
      - "src/bochan/tabular/**"
      - "src/bochan/visualization/multiclass_yy.py"
      - "web/src/api.ts"
      - "web/src/context/WorkbenchContext.tsx"
      - "web/src/pages/SettingsPage.tsx"
      - "tests/api/test_cross_validation_prediction_aggregation.py"
      - "tests/test_binary_active_learning_input_perturbation_duplicates.py"
      - "tests/test_feature_importance_input_perturbation.py"
      - "tests/test_multiclass_yy_visualization.py"
      - "tests/test_regression_active_learning_input_perturbation_duplicates.py"
      - "tests/test_webapp_binary_variance_input_perturbation_e2e.py"
      - "tests/test_webapp_input_perturbation_e2e.py"
      - "tests/test_webapp_input_perturbation_prediction_shape.py"
      - ".github/workflows/web-input-perturbation-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e ".[test,api,visualization]"
      - name: Run InputPerturbation regression tests
        run: |
          pytest -q --maxfail=1 \
            tests/api/test_cross_validation_prediction_aggregation.py \
            tests/test_binary_active_learning_input_perturbation_duplicates.py \
            tests/test_feature_importance_input_perturbation.py \
            tests/test_multiclass_yy_visualization.py \
            tests/test_regression_active_learning_input_perturbation_duplicates.py \
            tests/test_webapp_binary_variance_input_perturbation_e2e.py \
            tests/test_webapp_input_perturbation_e2e.py \
            tests/test_webapp_input_perturbation_prediction_shape.py
      - name: Run Ruff
        run: |
          python -m pip install ruff
          ruff check --ignore I001,SIM102,SIM108 \
            src/bochan/api/cross_validation.py \
            src/bochan/acquisition/binary/active_learning/__init__.py \
            src/bochan/acquisition/binary/active_learning/input_perturbation_safe.py \
            src/bochan/acquisition/regression/active_learning/_base_objective.py \
            src/bochan/acquisition/regression/active_learning/_base_scoring.py \
            src/bochan/inspection/feature_importance.py \
            src/bochan/serving/webapp/target_results.py \
            src/bochan/visualization/multiclass_yy.py \
            tests/api/test_cross_validation_prediction_aggregation.py \
            tests/test_binary_active_learning_input_perturbation_duplicates.py \
            tests/test_feature_importance_input_perturbation.py \
            tests/test_multiclass_yy_visualization.py \
            tests/test_regression_active_learning_input_perturbation_duplicates.py \
            tests/test_webapp_binary_variance_input_perturbation_e2e.py \
            tests/test_webapp_input_perturbation_e2e.py \
            tests/test_webapp_input_perturbation_prediction_shape.py
