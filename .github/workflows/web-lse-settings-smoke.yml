name: Web LSE settings smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/bochan/acquisition/regression/levelset_estimation/**"
      - "src/bochan/serving/webapp/settings/level_set.py"
      - "src/bochan/serving/webapp/settings/risk.py"
      - "src/bochan/serving/webapp/settings/search.py"
      - "src/bochan/serving/webapp/settings/targets.py"
      - "src/bochan/serving/webapp/workflows/__init__.py"
      - "src/bochan/serving/webapp/workflows/tabular.py"
      - "web/src/api.ts"
      - "web/src/components/InputPerturbationRiskSettings.tsx"
      - "web/src/components/TargetProposalSettings.tsx"
      - "web/src/targetSettingUtils.ts"
      - "web/src/modelArtifactRestore.ts"
      - "web/src/pages/OptimizePage.tsx"
      - "web/src/types.ts"
      - "tests/test_regression_lse_input_perturbation_shape.py"
      - "tests/test_webapp_input_perturbation_risk.py"
      - "tests/test_webapp_input_perturbation_prediction_shape.py"
      - "tests/test_webapp_level_set_settings.py"
      - "tests/test_webapp_lse_target_defaults.py"
      - "tests/test_webapp_lse_web_contract.py"
      - ".github/workflows/web-lse-settings-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e ".[test,api,visualization]"
      - name: Run focused LSE Web tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_regression_lse_input_perturbation_shape.py \
            tests/test_webapp_level_set_settings.py \
            tests/test_webapp_lse_target_defaults.py \
            tests/test_webapp_lse_web_contract.py \
            tests/test_webapp_input_perturbation_risk.py \
            tests/test_webapp_input_perturbation_prediction_shape.py
      - name: Run Ruff
        run: |
          python -m pip install ruff
          ruff check --ignore I001,SIM102,SIM108 \
            src/bochan/acquisition/regression/levelset_estimation/input_perturbation_shapes.py \
            src/bochan/acquisition/regression/levelset_estimation/__init__.py \
            src/bochan/serving/webapp/settings/level_set.py \
            src/bochan/serving/webapp/settings/risk.py \
            src/bochan/serving/webapp/settings/search.py \
            src/bochan/serving/webapp/settings/targets.py \
            src/bochan/serving/webapp/workflows/__init__.py \
            src/bochan/serving/webapp/workflows/tabular.py \
            tests/test_regression_lse_input_perturbation_shape.py \
            tests/test_webapp_input_perturbation_risk.py \
            tests/test_webapp_input_perturbation_prediction_shape.py \
            tests/test_webapp_lse_target_defaults.py \
            tests/test_webapp_lse_web_contract.py
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          package-json-file: web/package.json
          runtime: node@24
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
          install: false
      - name: Build Web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
