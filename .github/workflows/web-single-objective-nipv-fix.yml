name: Web single-objective NIPV fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: web-single-objective-nipv-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Clone pull request branch
        run: |
          git config --global core.autocrlf false
          git clone --branch "${{ github.head_ref }}" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo

      - name: Apply source changes
        working-directory: repo
        run: python scripts/apply_web_single_objective_nipv_fix.py

      - name: Install Python dependencies
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,web]" ruff

      - name: Format and lint touched clean files
        working-directory: repo
        run: |
          python -m ruff format src/bochan/serving/webapp/workflows_tabular.py tests/test_webapp_single_objective_nipv.py
          python -m ruff check --fix src/bochan/serving/webapp/workflows_tabular.py tests/test_webapp_single_objective_nipv.py
          python -m ruff check src/bochan/serving/webapp/workflows_tabular.py tests/test_webapp_single_objective_nipv.py
          python -m py_compile src/bochan/models/hybrid/multi_output.py

      - name: Run focused tests
        working-directory: repo
        run: |
          python -m pytest tests/test_webapp_single_objective_nipv.py tests/test_regression_active_learning_equivalence.py tests/test_regression_final_candidate_uniqueness_e2e.py tests/test_hybrid_model_eval.py -q

      - name: Commit validated source changes
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bochan/serving/webapp/workflows_tabular.py src/bochan/models/hybrid/multi_output.py tests/test_webapp_single_objective_nipv.py
          if git diff --cached --quiet; then
            echo "No validated source changes to commit."
          else
            git commit -m "Fix Web single-objective NIPV"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
