name: Web target settings smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "src/bochan/likelihoods/regression.py"
      - "src/bochan/model_artifact.py"
      - "src/bochan/tabular/optimizer_api.py"
      - "src/bochan/serving/fastapi/**"
      - "src/bochan/serving/webapp/**"
      - "src/bochan/visualization/plots.py"
      - "src/bochan/visualization/target_relation.py"
      - "tests/test_common_model_artifact_api.py"
      - "tests/test_tabular_noise_alpha.py"
      - "tests/test_webapp_multiobjective_contract.py"
      - "tests/test_webapp_target_results_contract.py"
      - "tests/test_webapp_feature_constraints_optimizer_contract.py"
      - "tests/test_webapp_tabular_backend.py"
      - "tests/test_webapp_advanced_controls.py"
      - "tests/test_webapp_input_perturbation_disabled.py"
      - "tests/test_webapp_model_reuse.py"
      - "tests/test_webapp_reuse_dataset_and_pareto.py"
      - "tests/test_webapp_model_artifacts.py"
      - "tests/test_web_experiment_history.py"
      - "tests/test_web_experiment_project_archive.py"
      - "tests/test_web_experiment_page.py"
      - "tests/test_web_project_archive_filename.py"
      - "tests/test_ternary_plot_dependency.py"
      - ".github/workflows/web-target-settings-smoke.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,api,visualization]"
      - name: Run target setting tests
        shell: bash
        run: |
          set +e
          pytest -q --maxfail=1 \
            tests/test_common_model_artifact_api.py \
            tests/test_tabular_noise_alpha.py \
            tests/test_webapp_multiobjective_contract.py \
            tests/test_webapp_target_results_contract.py \
            tests/test_webapp_feature_constraints_optimizer_contract.py \
            tests/test_webapp_tabular_backend.py \
            tests/test_webapp_advanced_controls.py \
            tests/test_webapp_input_perturbation_disabled.py \
            tests/test_webapp_model_reuse.py \
            tests/test_webapp_reuse_dataset_and_pareto.py \
            tests/test_webapp_model_artifacts.py \
            tests/test_web_experiment_history.py \
            tests/test_web_experiment_project_archive.py \
            tests/test_web_experiment_page.py \
            tests/test_web_project_archive_filename.py \
            tests/test_ternary_plot_dependency.py \
            2>&1 | tee pytest-web-target-settings.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Run lint
        if: always()
        shell: bash
        run: |
          python -m pip install ruff
          set +e
          ruff check --ignore I001,SIM102,SIM108 \
            src/bochan/model_artifact.py \
            src/bochan/serving/fastapi/router.py \
            src/bochan/serving/fastapi/routers/artifacts.py \
            src/bochan/serving/fastapi/routers/tabular.py \
            src/bochan/serving/fastapi/routers/tabular_artifacts.py \
            src/bochan/serving/fastapi/schemas/__init__.py \
            src/bochan/serving/fastapi/schemas/tabular.py \
            src/bochan/serving/fastapi/stores/file.py \
            src/bochan/serving/webapp/app.py \
            src/bochan/serving/webapp/experiment_history.py \
            src/bochan/serving/webapp/project_archive.py \
            src/bochan/serving/webapp/model_artifacts.py \
            src/bochan/serving/webapp/model_artifact_routes.py \
            src/bochan/serving/webapp/model_reuse.py \
            src/bochan/serving/webapp/reuse_dataset.py \
            src/bochan/serving/webapp/target_settings.py \
            src/bochan/serving/webapp/target_roles.py \
            src/bochan/serving/webapp/target_results.py \
            src/bochan/serving/webapp/search_settings.py \
            src/bochan/serving/webapp/tabular_backend.py \
            src/bochan/serving/webapp/visualization_sessions.py \
            src/bochan/serving/webapp/workflows.py \
            src/bochan/serving/webapp/workflows_extended.py \
            src/bochan/serving/webapp/workflows_tabular.py \
            src/bochan/visualization/plots.py \
            src/bochan/visualization/target_relation.py \
            tests/test_common_model_artifact_api.py \
            tests/test_webapp_multiobjective_contract.py \
            tests/test_webapp_target_results_contract.py \
            tests/test_webapp_feature_constraints_optimizer_contract.py \
            tests/test_webapp_tabular_backend.py \
            tests/test_webapp_advanced_controls.py \
            tests/test_webapp_input_perturbation_disabled.py \
            tests/test_webapp_model_reuse.py \
            tests/test_webapp_reuse_dataset_and_pareto.py \
            tests/test_webapp_model_artifacts.py \
            tests/test_web_experiment_history.py \
            tests/test_web_experiment_project_archive.py \
            tests/test_web_experiment_page.py \
            tests/test_web_project_archive_filename.py \
            tests/test_ternary_plot_dependency.py \
            2>&1 | tee ruff-web-target-settings.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-target-settings-smoke-logs
          path: |
            pytest-web-target-settings.log
            ruff-web-target-settings.log
          if-no-files-found: warn
