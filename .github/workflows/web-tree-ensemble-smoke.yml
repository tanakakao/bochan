name: Web external model smoke

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "scripts/preload_tabpfn.bat"
      - "scripts/preload_tabpfn.sh"
      - "src/bochan/api/model_registry.py"
      - "src/bochan/models/external/common.py"
      - "src/bochan/models/hybrid/task_aware_posterior.py"
      - "src/bochan/models/regression/foundation/tabpfn.py"
      - "src/bochan/models/classification/common/tabpfn.py"
      - "src/bochan/models/classification/binary/foundation/tabpfn.py"
      - "src/bochan/models/classification/multiclass/foundation/tabpfn.py"
      - "src/bochan/serving/webapp/app.py"
      - "src/bochan/serving/webapp/candidate_runtime.py"
      - "src/bochan/serving/webapp/model_capabilities.py"
      - "src/bochan/serving/webapp/model_reuse.py"
      - "src/bochan/serving/webapp/model_runtime.py"
      - "src/bochan/serving/webapp/risk_settings.py"
      - "src/bochan/serving/webapp/search_settings.py"
      - "src/bochan/serving/webapp/tabpfn_assets.py"
      - "src/bochan/serving/webapp/tabpfn_preload.py"
      - "src/bochan/serving/webapp/target_missing_policy.py"
      - "src/bochan/serving/webapp/target_settings.py"
      - "web/src/modelOptions.ts"
      - "web/src/regressionLikelihoodOptions.ts"
      - "web/src/pages/OptimizePage.tsx"
      - "web/src/pages/SettingsPage.tsx"
      - "web/test/regressionLikelihoodOptions.test.ts"
      - "tests/test_hybrid_task_aware_posterior.py"
      - "tests/test_tabpfn_input_perturbation.py"
      - "tests/test_tabpfn_models.py"
      - "tests/test_tabpfn_optional_smoke.py"
      - "tests/test_tree_ensemble_input_perturbation.py"
      - "tests/test_web_external_ensemble_matrix.py"
      - "tests/test_web_model_capabilities.py"
      - "tests/test_web_ngboost_runtime.py"
      - "tests/test_web_tabpfn_preload_runtime.py"
      - "tests/test_web_tabpfn_diagnostics.py"
      - "tests/test_web_tabpfn_mixed.py"
      - "tests/test_web_tabpfn_models.py"
      - "tests/test_web_tree_ensemble_models.py"
      - "tests/test_webapp_multiobjective_contract.py"
      - ".github/workflows/web-tree-ensemble-smoke.yml"
  workflow_dispatch:

concurrency:
  group: web-external-model-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-external-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Smoke Linux TabPFN preload helper
        run: bash scripts/preload_tabpfn.sh --help
      - name: Install Web external model dependencies
        run: python -m pip install -e ".[test,web]" "ruff>=0.6"
      - name: Run Web external model, perturbation, runtime, posterior, and capability tests
        run: |
          pytest -q --maxfail=1 \
            tests/test_tabpfn_input_perturbation.py \
            tests/test_tabpfn_models.py \
            tests/test_tabpfn_optional_smoke.py \
            tests/test_tree_ensemble_input_perturbation.py \
            tests/test_web_external_ensemble_matrix.py \
            tests/test_web_model_capabilities.py \
            tests/test_web_ngboost_runtime.py \
            tests/test_web_tabpfn_preload_runtime.py \
            tests/test_web_tabpfn_diagnostics.py \
            tests/test_web_tabpfn_mixed.py \
            tests/test_web_tabpfn_models.py \
            tests/test_web_tree_ensemble_models.py \
            tests/test_hybrid_task_aware_posterior.py \
            tests/test_webapp_multiobjective_contract.py
      - name: Lint focused Python changes
        run: |
          ruff check --ignore I001,SIM108 \
            src/bochan/models/external/common.py \
            src/bochan/serving/webapp/app.py \
            src/bochan/serving/webapp/candidate_runtime.py \
            src/bochan/serving/webapp/model_capabilities.py \
            src/bochan/serving/webapp/model_reuse.py \
            src/bochan/serving/webapp/model_runtime.py \
            src/bochan/serving/webapp/risk_settings.py \
            src/bochan/serving/webapp/search_settings.py \
            src/bochan/serving/webapp/tabpfn_assets.py \
            src/bochan/serving/webapp/tabpfn_preload.py \
            src/bochan/serving/webapp/target_missing_policy.py \
            src/bochan/serving/webapp/target_settings.py \
            src/bochan/models/hybrid/task_aware_posterior.py \
            tests/test_tabpfn_input_perturbation.py \
            tests/test_tabpfn_optional_smoke.py \
            tests/test_tree_ensemble_input_perturbation.py \
            tests/test_web_external_ensemble_matrix.py \
            tests/test_web_model_capabilities.py \
            tests/test_web_ngboost_runtime.py \
            tests/test_web_tabpfn_preload_runtime.py \
            tests/test_web_tabpfn_diagnostics.py \
            tests/test_web_tabpfn_mixed.py \
            tests/test_web_tabpfn_models.py \
            tests/test_web_tree_ensemble_models.py \
            tests/test_webapp_multiobjective_contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Web frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Test Web regression model labels
        working-directory: web
        run: node --experimental-strip-types test/regressionLikelihoodOptions.test.ts
      - name: Build Web frontend
        working-directory: web
        run: npm run build

  tabpfn-preload-windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Smoke Windows TabPFN preload helper
        shell: cmd
        run: scripts\preload_tabpfn.bat --help
