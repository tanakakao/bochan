name: Web tree ensemble smoke

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/bochan/api/model_registry.py"
      - "src/bochan/models/hybrid/task_aware_posterior.py"
      - "src/bochan/serving/webapp/app.py"
      - "web/src/modelOptions.ts"
      - "web/src/regressionLikelihoodOptions.ts"
      - "web/src/pages/OptimizePage.tsx"
      - "tests/test_hybrid_task_aware_posterior.py"
      - "tests/test_web_tree_ensemble_models.py"
      - "tests/test_webapp_multiobjective_contract.py"
      - ".github/workflows/web-tree-ensemble-smoke.yml"
  workflow_dispatch:

jobs:
  web-tree-ensemble-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Web tree ensemble dependencies
        run: python -m pip install -e ".[test,web]" "ruff>=0.6"
      - name: Run Web tree ensemble, hybrid posterior, and capability tests
        run: pytest -q tests/test_web_tree_ensemble_models.py tests/test_hybrid_task_aware_posterior.py tests/test_webapp_multiobjective_contract.py
      - name: Lint focused Python changes
        run: ruff check src/bochan/models/hybrid/task_aware_posterior.py tests/test_web_tree_ensemble_models.py tests/test_webapp_multiobjective_contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build Web frontend
        working-directory: web
        run: npm run build
