name: Wide multitask smoke

on:
  push:
    branches:
      - codex/wide-bald-public-transform
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run focused tests
        shell: bash
        run: |
          set +e
          pytest -q --maxfail=1 \
            tests/test_wide_multitask_public_transform.py \
            tests/test_wide_multitask_models.py \
            tests/test_wide_multitask_acquisition_consistency.py \
            2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          echo "$status" > pytest.status
          exit "$status"
      - name: Run lint on changed modules
        if: always()
        shell: bash
        run: |
          python -m pip install ruff
          set +e
          ruff check \
            src/bochan/models/wide_multitask_compat.py \
            tests/test_wide_multitask_public_transform.py \
            2>&1 | tee ruff.log
          status=${PIPESTATUS[0]}
          echo "$status" > ruff.status
          exit "$status"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wide-bald-public-transform-logs
          path: |
            pytest.log
            pytest.status
            ruff.log
            ruff.status
          if-no-files-found: warn
