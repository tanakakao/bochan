name: Wide multitask smoke

on:
  push:
    branches:
      - codex/wide-task-axis
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,tabular,api]"
      - name: Run focused tests
        shell: bash
        run: |
          set +e
          pytest -q --maxfail=1 \
            tests/test_gamma_fantasize.py \
            tests/test_wide_multitask_models.py \
            tests/test_wide_multitask_public_transform.py \
            tests/test_wide_multitask_acquisition_consistency.py \
            tests/test_wide_multitask_classification_acquisitions.py \
            tests/test_classification_hypervolume_signatures.py \
            tests/test_api_objective_input_transform_defaults.py \
            tests/test_regression_straddle_input_perturbation_objective.py \
            tests/test_hetero_regression_levelset_input_perturbation_objective.py \
            tests/test_api_optimizer_config.py \
            tests/test_hetero_regression_nehvi_autograd.py \
            tests/test_ordinal_missing_multiobjective.py \
            tests/test_ordinal_nehvi_repeated_backward.py \
            tests/test_torch_multitask_restart.py \
            tests/test_multiclass_nparego_context.py \
            tests/test_multiobjective_thompson_sampling.py \
            tests/test_thompson_sampling_target_resolution.py \
            tests/test_outcome_constraints.py \
            tests/test_api_acquisition_constraints.py \
            tests/test_outcome_constraint_config_api.py \
            tests/test_feasibility_architecture.py \
            tests/test_nsgaii_acquisition_adapter.py \
            tests/test_nsgaii_linear_constraint.py \
            tests/test_tabular_outcome_constraint_column_names.py \
            tests/test_tabular_non_native_outcome_constraints.py \
            tests/test_tabular_string_outcome_constraint_classes.py \
            tests/test_tabular_prediction_labels.py \
            tests/test_direct_api_candidate_constraints.py \
            tests/test_fastapi_tabular_endpoints.py \
            tests/test_fastapi_tabular_direct_candidate_config.py \
            tests/test_fastapi_tabular_fit_candidate_constraints.py \
            tests/test_hybrid_task_aware_posterior.py \
            tests/test_hybrid_deepgp_probability_shapes.py \
            tests/test_hybrid_input_perturbation_probability_shapes.py \
            2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          echo "$status" > pytest.status
          exit "$status"
      - name: Run lint on changed modules
        if: always()
        shell: bash
        run: |
          python -m pip install ruff
          set +e
          ruff check \
            --per-file-ignores "src/bochan/acquisition/ordinal/bayesian_optimization/__init__.py:E402" \
            --per-file-ignores "src/bochan/acquisition/ordinal/bayesian_optimization/__init__.py:I001" \
            src/bochan/acquisition/__init__.py \
            src/bochan/acquisition/_nehvi_cache_root.py \
            src/bochan/acquisition/classification_constraints.py \
            src/bochan/acquisition/feasible/wrapper.py \
            src/bochan/acquisition/multiclass/bayesian_optimization/nparego_observed_baseline.py \
            src/bochan/acquisition/nsgaii_constraint_install.py \
            src/bochan/acquisition/objective/__init__.py \
            src/bochan/acquisition/objective/outcome_constraints.py \
            src/bochan/acquisition/objective/regression_perturbation.py \
            src/bochan/acquisition/ordinal/bayesian_optimization/__init__.py \
            src/bochan/acquisition/ordinal/bayesian_optimization/_fixed_likelihood_graph.py \
            src/bochan/acquisition/ordinal/bayesian_optimization/_utility_defaults.py \
            src/bochan/acquisition/ordinal_constraint_install.py \
            src/bochan/acquisition/ordinal_multitask.py \
            src/bochan/acquisition/regression/active_learning/__init__.py \
            src/bochan/acquisition/regression/active_learning/integrated_variance.py \
            src/bochan/acquisition/regression/bayesian_optimization/__init__.py \
            src/bochan/acquisition/regression/bayesian_optimization/hetero_multi_output_autograd.py \
            src/bochan/acquisition/regression/levelset_estimation/objective_compat.py \
            src/bochan/acquisition/regression/levelset_estimation/hetero_objective_compat.py \
            src/bochan/api/acquisition_config.py \
            src/bochan/api/automatic_multiobjective.py \
            src/bochan/api/classification_perturbation_defaults.py \
            src/bochan/api/feasibility_defaults.py \
            src/bochan/api/nan_multiobjective.py \
            src/bochan/api/optimizer_api.py \
            src/bochan/api/optimizer_config.py \
            src/bochan/models/components/projected.py \
            src/bochan/models/components/projected_utils.py \
            src/bochan/models/hybrid/__init__.py \
            src/bochan/models/hybrid/class_probability_shapes.py \
            src/bochan/models/hybrid/task_aware_posterior.py \
            src/bochan/models/hybrid/task_aware_sampling.py \
            src/bochan/models/multifidelity/__init__.py \
            src/bochan/models/multioutput/__init__.py \
            src/bochan/models/multioutput/binary.py \
            src/bochan/models/multioutput/multiclass.py \
            src/bochan/models/multioutput/ordinal.py \
            src/bochan/models/multitask/__init__.py \
            src/bochan/models/multitask/kronecker.py \
            src/bochan/models/multitask/mixed.py \
            src/bochan/models/multitask/task_feature.py \
            src/bochan/models/multitask/validation.py \
            src/bochan/models/multitask/wide.py \
            src/bochan/models/regression/gamma/base/aligned.py \
            src/bochan/optim/__init__.py \
            src/bochan/optim/nsgaii_adapter.py \
            src/bochan/optim/nsgaii_constraints.py \
            src/bochan/optim/nsgaii_diversity.py \
            src/bochan/optim/torch_multitask.py \
            src/bochan/tabular/__init__.py \
            src/bochan/tabular/optimizer_api.py \
            src/bochan/tabular/outcome_constraints.py \
            src/bochan/tabular/prediction_labels.py \
            src/bochan/serving/fastapi/dependencies.py \
            src/bochan/serving/fastapi/router.py \
            src/bochan/serving/fastapi/routers/tabular.py \
            src/bochan/serving/fastapi/schemas/__init__.py \
            src/bochan/serving/fastapi/schemas/tabular.py \
            src/bochan/serving/fastapi/stores/__init__.py \
            src/bochan/serving/fastapi/stores/tabular.py \
            tests/test_gamma_fantasize.py \
            tests/test_wide_multitask_models.py \
            tests/test_wide_multitask_public_transform.py \
            tests/test_wide_multitask_acquisition_consistency.py \
            tests/test_wide_multitask_classification_acquisitions.py \
            tests/test_classification_hypervolume_signatures.py \
            tests/test_api_objective_input_transform_defaults.py \
            tests/test_regression_straddle_input_perturbation_objective.py \
            tests/test_hetero_regression_levelset_input_perturbation_objective.py \
            tests/test_api_optimizer_config.py \
            tests/test_hetero_regression_nehvi_autograd.py \
            tests/test_ordinal_missing_multiobjective.py \
            tests/test_ordinal_nehvi_repeated_backward.py \
            tests/test_torch_multitask_restart.py \
            tests/test_multiclass_nparego_context.py \
            tests/test_multiclass_nparego_signature.py \
            tests/test_multiclass_nparego_public_api.py \
            tests/test_multiobjective_thompson_sampling.py \
            tests/test_thompson_sampling_target_resolution.py \
            tests/test_outcome_constraint_config_api.py \
            tests/test_feasibility_architecture.py \
            tests/test_nsgaii_acquisition_adapter.py \
            tests/test_nsgaii_linear_constraint.py \
            tests/test_tabular_outcome_constraint_column_names.py \
            tests/test_tabular_non_native_outcome_constraints.py \
            tests/test_tabular_string_outcome_constraint_classes.py \
            tests/test_tabular_prediction_labels.py \
            tests/test_direct_api_candidate_constraints.py \
            tests/test_fastapi_tabular_endpoints.py \
            tests/test_fastapi_tabular_direct_candidate_config.py \
            tests/test_fastapi_tabular_fit_candidate_constraints.py \
            tests/test_hybrid_task_aware_posterior.py \
            tests/test_hybrid_deepgp_probability_shapes.py \
            tests/test_hybrid_input_perturbation_probability_shapes.py \
            2>&1 | tee ruff.log
          status=${PIPESTATUS[0]}
          echo "$status" > ruff.status
          exit "$status"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wide-multitask-smoke-logs
          path: |
            pytest.log
            pytest.status
            ruff.log
            ruff.status
          if-no-files-found: warn
