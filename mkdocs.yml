site_name: bochan
site_description: BoTorch-oriented Bayesian optimization, active learning, and materials-informatics toolkit
repo_url: https://github.com/tanakakao/bochan
repo_name: tanakakao/bochan

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Materials:
      - Unified MLIP workflows: materials/mlip-workflows.md
      - ALIGNN structure input: alignn_structure_input.md
      - ALIGNN multi-output: alignn_multioutput.md
      - ALIGNN multitask: alignn_multitask.md
      - ALIGNN scaling: alignn_scaling.md
      - Composition best subset: composition_best_subset.md
  - API Reference:
      - FastAPI overview: reference/fastapi.md
      - ALIGNN FastAPI: alignn_fastapi.md
      - CHGNet FastAPI: chgnet_fastapi.md
      - M3GNet FastAPI: m3gnet_fastapi.md
      - MACE FastAPI: mace_fastapi.md
      - CrabNet FastAPI / Web: crabnet_fastapi_web.md
  - Model Notes:
      - Beta regression: beta-regression.md
      - Beta models: beta_models.md
      - Gamma models: gamma_models.md
  - LLM:
      - Overview: llm/README.md
      - Candidate explanation: llm/candidate_explanation.md
      - Hybrid constraints: llm/hybrid_constraints.md
      - Selected acquisition: llm_selected_acquisition.md
  - Maintenance: maintenance.md

strict: true
