# プロジェクトのメタデータ
[project]
name = "botorch_ext"
version = "0.1.0"
authors = [
  { name="Your Name", email="you@example.com" },
]
description = "botorchの拡張のためのパッケージです。"
readme = "README.md"
requires-python = ">=3.11"
# このパッケージが動作するために必要なライブラリ
dependencies = [
  "numpy>=1.20.0",
  "pandas>=2.0.0",
  "requests",
]

# (キーポイント) 開発時にのみ必要なライブラリ
[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
]
tabular = [
  "pandas>=2.0.0",
]
impute = [
  "scikit-learn>=1.3.0",
]
all = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
  "pandas>=2.0.0",
  "scikit-learn>=1.3.0",
]
dev = [
  "pytest", # テスト用
  "black",  # コードフォーマッター
]
